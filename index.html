   pixels-per-hour. Both were wrong. The app already owns both facts - window.TG
   holds startHour/endHour/HOUR_PX and window.tgToY(hhmm) returns the exact Y for
   a time - so use them and stop inventing. */
(function () {

  function nowHHMM() {
    var d = new Date();
    function p(v) { return (v < 10 ? '0' : '') + v; }
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function targetTop(host) {
    if (!window.tgToY || !window.TG) return 0;
    var y = window.tgToY(nowHHMM());
    if (y === null || isNaN(y)) return 0;
    var range = host.scrollHeight - host.clientHeight;
    if (range <= 0) return 0;
    var t = y - (host.clientHeight / 3);
    if (t < 0) t = 0;
    if (t > range) t = range;
    return t;
  }

  var oldMorning = window.tgScrollToMorning;
  window.tgScrollToMorning = function (scroll) {
    if (!scroll) return;
    try { scroll.scrollTop = targetTop(scroll); }
    catch (e) { if (typeof oldMorning === 'function') oldMorning(scroll); }
  };

  window.scrollGridToNow = function () {
    var hosts = document.querySelectorAll('.tgscroll'), i, did = false;
    for (i = 0; i < hosts.length; i++) {
      if (!hosts[i].clientHeight) continue;
      hosts[i].scrollTop = targetTop(hosts[i]);
      did = true;
    }
    return did;
  };

  setTimeout(function () { window.scrollGridToNow(); }, 1500);
})();


/* ===== m133 settings entry point ===== */
/* Why this exists.
   The operator could not find the Visual formats button "in the settings area".
   They were right, and for a reason I had not checked: on DESKTOP there is no
   settings area at all. The top bar holds only btnTreeToggle, btnPrevMonth,
   btnToday, btnNextMonth, btnSignIn. Every secondary control lives in a drawer
   behind the hamburger, which is not called Settings and does not look like it.
   On the phone the bottom bar does have a Settings tab and the button IS there.
   So: give desktop the same Settings, opened through ONE shared function, so the
   two entry points cannot drift apart. */
(function () {

  // ONE mechanism. Both entry points call this, so they cannot behave differently.
  window.plannerOpenSettings = function () {
    var d = document.getElementById('treeDrawer');
    if (!d) return false;
    d.hidden = false;
    d.classList.remove('hidden');
    if (window.__bbShow && window.innerWidth <= 700) window.__bbShow('settings');
    try { d.scrollIntoView({ block: 'nearest' }); } catch (e) {}
    return true;
  };

  window.plannerCloseSettings = function () {
    var d = document.getElementById('treeDrawer');
    if (!d) return false;
    d.hidden = true;
    if (window.__bbShow && window.innerWidth <= 700) window.__bbShow('plan');
    return true;
  };

  function isOpen() {
    var d = document.getElementById('treeDrawer');
    return !!(d && !d.hidden && d.getBoundingClientRect().height > 0);
  }

  // Desktop entry point, sitting next to the sign-in button.
  function addGear() {
    if (document.getElementById('btnSettings')) return;
    var bar = document.getElementById('topbar');
    if (!bar) return;
    var b = document.createElement('button');
    b.id = 'btnSettings';
    b.type = 'button';
    b.className = 'btn-icon';
    b.title = 'Settings';
    b.textContent = 'Settings';
    b.addEventListener('click', function (e) {
      e.preventDefault();
      if (isOpen()) window.plannerCloseSettings();
      else window.plannerOpenSettings();
    });
    var anchor = document.getElementById('btnSignIn');
    if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(b, anchor);
    else bar.appendChild(b);
  }

  /* Label the drawer so it reads as Settings rather than as a nameless tray, and
     say what Visual formats does. "Visual formats" with no explanation is what
     caused this round-trip in the first place. */
  function labelDrawer() {
    var d = document.getElementById('treeDrawer');
    if (!d || document.getElementById('drawerTitle')) return;
    var h = document.createElement('div');
    h.id = 'drawerTitle';
    h.className = 'drawer-title';
    h.textContent = 'Settings';
    d.insertBefore(h, d.firstChild);
    var looks = document.getElementById('btnLooks');
    if (looks) {
      var hint = document.createElement('div');
      hint.id = 'looksHint';
      hint.className = 'drawer-hint';
      hint.textContent = 'Choose how the whole app looks. Changes apply straight away.';
      if (looks.nextSibling) d.insertBefore(hint, looks.nextSibling);
      else d.appendChild(hint);
    }
  }

  function start() {
    addGear();
    labelDrawer();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(start, 1200); });
  } else {
    setTimeout(start, 1200);
  }
  setTimeout(start, 2200);
})();


/* ===== m134 visual variations - 10 aspects x 10 ===== */
(function () {
  var ASPECTS = [
    { key: 'surface',  name: 'Background depth', hint: 'How dark the page is and how far panels lift off it' },
    { key: 'text',     name: 'Text shades',      hint: 'Four levels, from titles down to faint detail' },
    { key: 'type',     name: 'Type size & weight', hint: 'Bigger vs bolder. 1 and 2 match a shipped pro app' },
    { key: 'density',  name: 'Row height',       hint: 'How much air each task gets' },
    { key: 'radius',   name: 'Corner rounding',  hint: '3 is square, 5 is fully rounded pills' },
    { key: 'accent',   name: 'Accent colour',    hint: 'The one colour. 9 removes colour entirely' },
    { key: 'emphasis', name: 'Goal vs subtask',  hint: 'What makes a top-level goal stand out' },
    { key: 'line',     name: 'Divider lines',    hint: '3 removes every line' },
    { key: 'event',    name: 'Calendar blocks',  hint: 'How an event looks on the day grid' },
    { key: 'chip',     name: 'Time & tag pills', hint: 'The small labels on a row' }
  ];
  var DEFAULTS = { surface:'1', text:'1', type:'2', density:'3', radius:'1',
                   accent:'1', emphasis:'1', line:'1', event:'1', chip:'1' };
  var LS = 'planner.variations';

  function load() {
    var out = {}, k, saved = null;
    try { saved = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { saved = null; }
    for (k in DEFAULTS) { if (DEFAULTS.hasOwnProperty(k)) out[k] = DEFAULTS[k]; }
    if (saved) { for (k in saved) { if (saved.hasOwnProperty(k) && DEFAULTS.hasOwnProperty(k)) out[k] = String(saved[k]); } }
    return out;
  }

  function save(state) {
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
  }

  window.plannerVariations = function () { return load(); };

  window.applyVariations = function (state) {
    var s = state || load(), i, k;
    for (i = 0; i < ASPECTS.length; i++) {
      k = ASPECTS[i].key;
      document.documentElement.setAttribute('data-v-' + k, s[k] || DEFAULTS[k]);
    }
    return s;
  };

  window.setVariation = function (key, value) {
    if (!DEFAULTS.hasOwnProperty(key)) return false;
    var s = load();
    s[key] = String(value);
    save(s);
    window.applyVariations(s);
    return true;
  };

  window.resetVariations = function () {
    try { localStorage.removeItem(LS); } catch (e) {}
    window.applyVariations(load());
    return true;
  };

  window.showVisualFormats = function () {
    var body = document.createElement('div');
    var state = load();
    var intro = document.createElement('p');
    intro.style.cssText = 'font-size:12px;margin:0 0 10px;line-height:1.5';
    intro.textContent = 'Ten aspects, ten variations each. Tap a number and the app changes behind this box. Nothing is saved until you tap it, and every tap is remembered.';
    body.appendChild(intro);
    var wrap = document.createElement('div');
    wrap.className = 'vp-wrap';
    var i, j;
    for (i = 0; i < ASPECTS.length; i++) {
      (function (asp) {
        var sec = document.createElement('div');
        sec.className = 'vp-aspect';
        var h = document.createElement('h4');
        h.textContent = (ASPECTS.indexOf(asp) + 1) + '. ' + asp.name;
        var p = document.createElement('p');
        p.textContent = asp.hint;
        var opts = document.createElement('div');
        opts.className = 'vp-opts';
        for (j = 1; j <= 10; j++) {
          (function (n) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'vp-opt' + (String(state[asp.key]) === String(n) ? ' on' : '');
            b.textContent = String(n);
            b.setAttribute('data-asp', asp.key);
            b.addEventListener('click', function (e) {
              e.preventDefault();
              window.setVariation(asp.key, n);
              var sib = opts.querySelectorAll('.vp-opt'), q;
              for (q = 0; q < sib.length; q++) sib[q].classList.remove('on');
              b.classList.add('on');
            });
            opts.appendChild(b);
          })(j);
        }
        sec.appendChild(h); sec.appendChild(p); sec.appendChild(opts);
        wrap.appendChild(sec);
      })(ASPECTS[i]);
    }
    body.appendChild(wrap);
    var acts = document.createElement('div');
    acts.className = 'vp-actions';
    var rb = document.createElement('button');
    rb.type = 'button';
    rb.className = 'drawer-btn';
    rb.textContent = 'Back to the researched default';
    rb.addEventListener('click', function (e) { e.preventDefault(); window.resetVariations(); window.showVisualFormats(); });
    acts.appendChild(rb);
    body.appendChild(acts);
    window.showModal('Visual formats', body, [{ label: 'Done' }]);
  };

  window.setChrome = function (mode) {
    var m = (mode === 'bottom') ? 'bottom' : 'top';
    try { localStorage.setItem('planner.chrome', m); } catch (e) {}
    document.documentElement.setAttribute('data-chrome', m);
    if (m === 'bottom' && !document.getElementById('bottomBar') && window.__bbBuild) window.__bbBuild();
    return m;
  };

  window.plannerChrome = function () {
    var v = '';
    try { v = localStorage.getItem('planner.chrome') || ''; } catch (e) {}
    return v === 'top' ? 'top' : 'bottom';
  };

  function start() {
    window.applyVariations(load());
    window.setChrome(window.plannerChrome());
  }

  window.applyVariations(load());
  document.documentElement.setAttribute('data-chrome', window.plannerChrome());
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(start, 1300); });
  } else {
    setTimeout(start, 1300);
  }
  setTimeout(start, 2400);
})();

/* ===== m135 bottom bar on desktop ===== */
/* The bottom bar on the computer.
   The existing bottom-bar module (m125) builds the bar ONLY when the window is
   700px or narrower, and actively tears it down again when it is wider. It
   exposes __bbShow but never a build function, so the newer code that tried to
   call window.__bbBuild was calling nothing - checked, it does not exist.
   So build the bar here, independently, and wire each tab to the same __bbShow
   the phone uses, so both sizes share one code path. */
(function () {
  var TABS = [
    { id: 'plan',     label: 'Plan',     icon: '☑' },
    { id: 'alarms',   label: 'Alarms',   icon: '⏰' },
    { id: 'settings', label: 'Settings', icon: '⚙' }
  ];

  function buildBar() {
    var existing = document.getElementById('bottomBar');
    if (existing) return existing;
    var nav = document.createElement('nav');
    nav.id = 'bottomBar';
    var i;
    for (i = 0; i < TABS.length; i++) {
      (function (t) {
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('data-tab', t.id);
        var ic = document.createElement('span');
        ic.textContent = t.icon;
        var lb = document.createElement('span');
        lb.textContent = t.label;
        b.appendChild(ic);
        b.appendChild(lb);
        b.addEventListener('click', function (e) {
          e.preventDefault();
          if (window.__bbShow) window.__bbShow(t.id);
          else if (t.id === 'settings' && window.plannerOpenSettings) window.plannerOpenSettings();
          mark(t.id);
        });
        nav.appendChild(b);
      })(TABS[i]);
    }
    document.body.appendChild(nav);
    return nav;
  }

  function mark(id) {
    var all = document.querySelectorAll('#bottomBar [data-tab]'), i;
    for (i = 0; i < all.length; i++) {
      if (all[i].getAttribute('data-tab') === id) all[i].classList.add('on');
      else all[i].classList.remove('on');
    }
  }

  window.__bbBuild = function () {
    var n = buildBar();
    mark('plan');
    return !!n;
  };

  function guard() {
    if (document.documentElement.getAttribute('data-chrome') !== 'bottom') return;
    if (!document.getElementById('bottomBar')) window.__bbBuild();
  }

  function start() {
    if (document.documentElement.getAttribute('data-chrome') === 'bottom') window.__bbBuild();
    window.addEventListener('resize', guard);
    setInterval(guard, 2000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(start, 1500); });
  } else {
    setTimeout(start, 1500);
  }
  setTimeout(start, 2600);
})();


/* ===== m136 one choke point for showing Settings ===== */
/* One choke point for "show Settings".
   Third time this exact bug has bitten: #treeDrawer is created with the hidden
   ATTRIBUTE, and __bbShow clears a CLASS of the same name that is never set. It
   happened to work on the phone because a body[data-bb="settings"] CSS rule
   forced the pane visible anyway; on the computer there is no such rule, so the
   drawer stayed empty. Rather than fix the third caller, wrap __bbShow itself so
   every present and future caller goes through one place. */
(function () {
  var inner = window.__bbShow;

  window.__bbShow = function (id) {
    var r;
    if (typeof inner === 'function') { try { r = inner.apply(this, arguments); } catch (e) {} }
    var d = document.getElementById('treeDrawer');
    if (d) {
      if (id === 'settings') { d.hidden = false; d.classList.remove('hidden'); }
      else { d.hidden = true; }
    }
    var all = document.querySelectorAll('#bottomBar [data-tab]'), i;
    for (i = 0; i < all.length; i++) {
      if (all[i].getAttribute('data-tab') === id) all[i].classList.add('on');
      else all[i].classList.remove('on');
    }
    return r;
  };

  window.plannerShowTab = function (id) {
    document.body.setAttribute('data-bb', id);
    return window.__bbShow(id);
  };
})();


/* ===== m137 floating visual-formats panel ===== */
/* The picker was a MODAL, so it covered and blocked the very screen the
   operator was trying to judge. Every choice applied instantly and they still
   could not see it. This replaces it with a floating panel: no scrim, drag it
   by the header, resize it from the corner, and the app keeps working
   underneath while every tap changes it live.
   Hardened where a floating panel usually goes wrong: it is mounted on
   document.body so the tree re-rendering cannot move or bury it, and a stored
   position is validated on load - an off-screen panel is unrecoverable
   otherwise. */
(function () {
  /* Each aspect says WHERE it shows in plain words, and carries a selector so
     the panel can outline those exact elements on the real screen. The operator
     could not tell whether an aspect affected the main screen, the calendar or
     Settings - so stop expecting them to guess and point at it. */
  var ASPECTS = [
    { key: 'surface',  name: 'Background depth',   where: 'The whole app - page and panels',   sel: 'body, aside#treePane, section#rightPane' },
    { key: 'text',     name: 'Text shades',        where: 'Every piece of writing',            sel: '#treeRoot .tree-title' },
    { key: 'type',     name: 'Type size & weight', where: 'Task and goal titles',              sel: '#treeRoot .tree-title' },
    { key: 'density',  name: 'Row height',         where: 'The task rows on the main screen',  sel: '#treeRoot .tree-row' },
    { key: 'radius',   name: 'Corner rounding',    where: 'Rows, buttons and small labels',    sel: '#treeRoot .tree-row' },
    { key: 'accent',   name: 'Accent colour',      where: 'Tick boxes and the selected tab',   sel: '#bottomBar [data-tab], #treeRoot input[type="checkbox"]' },
    { key: 'emphasis', name: 'Goal vs subtask',    where: 'Top-level goals vs the tasks under them', sel: '#treeRoot .tree-row[data-depth="0"]' },
    { key: 'line',     name: 'Divider lines',      where: 'The thin lines - top bar, Settings edges', sel: 'header#topbar' },
    { key: 'event',    name: 'Calendar blocks',    where: 'Appointments on the day calendar',  sel: '.tgevent', day: true },
    { key: 'chip',     name: 'Time & tag pills',   where: 'The small 18:30 and tag labels',    sel: '.time-chip, .tag-chip' }
  ];
  var LS_BOX = 'planner.vp.box';
  var panel = null;

  function phone() { return window.innerWidth <= 700; }

  function defaultBox() {
    if (phone()) {
      return { x: 8, y: Math.round(window.innerHeight * 0.42),
               w: window.innerWidth - 16, h: Math.round(window.innerHeight * 0.46) };
    }
    return { x: Math.max(8, window.innerWidth - 300), y: 70, w: 280, h: 300 };
  }

  function readBox() {
    var b = null;
    try { b = JSON.parse(localStorage.getItem(LS_BOX) || 'null'); } catch (e) { b = null; }
    var d = defaultBox();
    if (!b || typeof b.x !== 'number' || typeof b.w !== 'number') return d;
    return clamp(b);
  }

  function clamp(b) {
    b.w = Math.max(220, Math.min(b.w, window.innerWidth - 8));
    b.h = Math.max(160, Math.min(b.h, window.innerHeight - 8));
    if (b.x < 0) b.x = 0;
    if (b.y < 0) b.y = 0;
    if (b.x + b.w > window.innerWidth - 4) b.x = window.innerWidth - 4 - b.w;
    if (b.y + b.h > window.innerHeight - 4) b.y = window.innerHeight - 4 - b.h;
    if (b.x < 0) b.x = 0;
    if (b.y < 0) b.y = 0;
    return b;
  }

  function writeBox(b) {
    try { localStorage.setItem(LS_BOX, JSON.stringify(b)); } catch (e) {}
  }

  function applyBox(b) {
    if (!panel) return;
    panel.style.left = Math.round(b.x) + 'px';
    panel.style.top = Math.round(b.y) + 'px';
    panel.style.width = Math.round(b.w) + 'px';
    panel.style.height = Math.round(b.h) + 'px';
  }

  window.resetVisualPanel = function () {
    try { localStorage.removeItem(LS_BOX); } catch (e) {}
    var d = defaultBox();
    applyBox(d);
    writeBox(d);
    return d;
  };

  window.closeVisualFormats = function () {
    if (panel && panel.parentNode) panel.parentNode.removeChild(panel);
    panel = null;
    return true;
  };

  // Drag by the header, resize by the corner grip. One pointer path for both.
  function wireDrag(handle, grip) {
    var mode = null, sx = 0, sy = 0, box = null;
    function down(m) {
      return function (e) {
        // A pointerdown on the header preventDefaults, which cancels the
        // click that would follow - so the reset and close buttons living
        // INSIDE the header never fired. Let anything button-like through.
        var t = e.target;
        while (t && t !== handle && t !== grip) {
          if (t.tagName === 'BUTTON') return;
          t = t.parentElement;
        }
        mode = m;
        sx = e.clientX; sy = e.clientY;
        box = { x: panel.offsetLeft, y: panel.offsetTop, w: panel.offsetWidth, h: panel.offsetHeight };
        e.preventDefault();
        e.stopPropagation();
        document.addEventListener('pointermove', move, true);
        document.addEventListener('pointerup', up, true);
      };
    }
    function move(e) {
      if (!mode || !panel) return;
      var dx = e.clientX - sx, dy = e.clientY - sy, b;
      if (mode === 'drag') {
        b = { x: box.x + dx, y: box.y + dy, w: box.w, h: box.h };
      } else {
        b = { x: box.x, y: box.y, w: box.w + dx, h: box.h + dy };
      }
      applyBox(clamp(b));
      e.preventDefault();
    }
    function up() {
      mode = null;
      document.removeEventListener('pointermove', move, true);
      document.removeEventListener('pointerup', up, true);
      writeBox({ x: panel.offsetLeft, y: panel.offsetTop, w: panel.offsetWidth, h: panel.offsetHeight });
    }
    handle.addEventListener('pointerdown', down('drag'));
    grip.addEventListener('pointerdown', down('size'));
  }

  function row(asp, state) {
    var wrap = document.createElement('div');
    wrap.className = 'vp-aspect';
    var head = document.createElement('div');
    head.className = 'vp-head';
    var h = document.createElement('h4');
    h.textContent = asp.name;
    var nav = document.createElement('div');
    nav.className = 'vp-nav';
    var prev = document.createElement('button');
    prev.type = 'button'; prev.className = 'vp-step'; prev.textContent = '‹';
    var num = document.createElement('span');
    num.className = 'vp-num'; num.textContent = String(state[asp.key]);
    var next = document.createElement('button');
    next.type = 'button'; next.className = 'vp-step'; next.textContent = '›';
    nav.appendChild(prev); nav.appendChild(num); nav.appendChild(next);
    head.appendChild(h); head.appendChild(nav);
    var opts = document.createElement('div');
    opts.className = 'vp-opts';
    var btns = [], j;
    function pick(n) {
      if (n < 1) n = 10;
      if (n > 10) n = 1;
      window.setVariation(asp.key, n);
      num.textContent = String(n);
      var q;
      for (q = 0; q < btns.length; q++) {
        if (q === n - 1) btns[q].classList.add('on');
        else btns[q].classList.remove('on');
      }
    }
    for (j = 1; j <= 10; j++) {
      (function (nn) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'vp-opt' + (String(state[asp.key]) === String(nn) ? ' on' : '');
        b.textContent = String(nn);
        b.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); pick(nn); });
        btns.push(b);
        opts.appendChild(b);
      })(j);
    }
    prev.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); pick(parseInt(num.textContent, 10) - 1); });
    next.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); pick(parseInt(num.textContent, 10) + 1); });
    wrap.setAttribute('data-asp', asp.key);
    var w = document.createElement('div');
    w.className = 'vp-where';
    w.textContent = asp.where;
    wrap.appendChild(head);
    wrap.appendChild(w);
    wrap.addEventListener('click', function () { window.vpSetCurrent(asp.key); });
    wrap.appendChild(opts);
    return wrap;
  }

  window.showVisualFormats = function () {
    window.closeVisualFormats();
    var state = window.plannerVariations();
    panel = document.createElement('div');
    panel.id = 'vpPanel';

    var bar = document.createElement('div');
    bar.className = 'vp-bar';
    var title = document.createElement('span');
    title.className = 'vp-title';
    title.textContent = 'Visual formats';
    var rst = document.createElement('button');
    rst.type = 'button'; rst.className = 'vp-x'; rst.title = 'Put the panel back'; rst.textContent = '↺';
    rst.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); window.resetVisualPanel(); });
    var x = document.createElement('button');
    x.type = 'button'; x.className = 'vp-x'; x.title = 'Close'; x.textContent = '×';
    x.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); window.closeVisualFormats(); });
    bar.appendChild(title); bar.appendChild(rst); bar.appendChild(x);

    var body = document.createElement('div');
    body.className = 'vp-body';
    var note = document.createElement('p');
    note.className = 'vp-note';
    note.textContent = 'Pick a row and the part of the screen it changes flashes an outline. \u2190 \u2192 change it, \u2191 \u2193 pick another row. Shift+arrows move this panel.';
    body.appendChild(note);
    var i;
    for (i = 0; i < ASPECTS.length; i++) body.appendChild(row(ASPECTS[i], state));

    var foot = document.createElement('div');
    foot.className = 'vp-foot';
    var def = document.createElement('button');
    def.type = 'button'; def.className = 'vp-reset';
    def.textContent = 'Back to the researched default';
    def.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      window.resetVariations();
      window.showVisualFormats();
    });
    foot.appendChild(def);

    var grip = document.createElement('div');
    grip.className = 'vp-grip';

   but not yet committed is gone. The same late render is why starting a new
   goal can jump to a different goal: focus lands wherever the rebuilt DOM puts
   it.

/* ===== m140 mark arrivals whose row appears late ===== */
/* An arriving task nested under COLLAPSED ancestors never got its "due today"
   marker. The arrivals code adds the class immediately after the render:
     var el = document.querySelector('.tree-row[data-id="'+n.id+'"]');
     if (el) el.classList.add('just-arrived');

   that moment - the expand happens in a later pass. querySelector returns null,
   the arrival is already consumed, and the marker is lost for good. Proven: the
   marker works for a top-level task and is missing for a nested one.
   This re-applies the marker once the row actually exists. */

    if (!id) return false;

      if (el) {
        el.classList.add('just-arrived');
        setTimeout(function () { el.classList.remove('just-arrived'); }, 3000);
        delete PENDING[id];
        return;

     even if its row appears late. */

        if (!list[i]) continue;
        if (list[i].date === today && !list[i].done) out.push(list[i].id);
        if (list[i].children) walk(list[i].children);
      }
    })(window.Store && window.Store.data ? window.Store.data.tree : []);
    return out;
  }

    var ids = todayIds(), i;
    if (seen === null) { seen = {}; for (i = 0; i < ids.length; i++) seen[ids[i]] = 1; return; }

    var next = document.createElement('button');

    var grid = document.createElement('div');

    for (i = 0; i < first; i++) {

  function redraw(node) {

/* ===== m172 chosen dates are the rule ===== */
/* For "On specific dates", the dates ARE the rule.
   Found by testing: a date picked BEFORE the Start date was silently dropped -
   the engine checked the start/end window first, so choosing the 10th while
   Start said the 20th meant the task simply never appeared. Nobody would guess
   that; you pick a date, it should count. Start and End still gate every other
   frequency. */
(function () {
  var base = window.plannerRepeatMatches;
  if (typeof base !== 'function') return;

  window.plannerRepeatMatches = function (node, iso) {
    if (node && node.repeat && node.repeat.freq === 'specific') {
      var list = (node.repeat.dates || []), i;
      for (i = 0; i < list.length; i++) {
        if (list[i] === iso) return true;
      }
      return false;
    }
    return base.apply(this, arguments);
  };
})();


/* ===== m173 routines drawn on every matching day ===== */
(function () {
  function hasActiveRepeat(nd) {
    return !!(nd && nd.repeat && nd.repeat.freq && typeof nd.repeat.freq === 'string' && nd.repeat.freq !== '' && nd.repeat.freq !== 'none' && nd.repeat.freq !== 'never');
  }

  function wrap(node, iso) {
    return {
      id: node.id,
      title: node.title,
      priority: node.priority,
      done: !!(window.plannerOccurrenceDone && window.plannerOccurrenceDone(node, iso)),
      duration: node.duration,
      date: iso,
      time: node.time,
      node: node
    };
  }

  var base = window.scheduledOn;
  if (typeof base !== 'function') return;

  window.scheduledOn = function (iso) {
    var res = base.apply(this, arguments) || [];
    if (!iso) return res;

    var kept = [], i, item, nd;
    for (i = 0; i < res.length; i++) {
      item = res[i];
      nd = (item && item.node) ? item.node : item;
      if (nd && hasActiveRepeat(nd) && window.plannerRepeatMatches) {
        if (!window.plannerRepeatMatches(nd, iso)) continue;
      }
      kept.push(item);
    }

    var out = [], seen2 = {}, key;
    for (i = 0; i < kept.length; i++) {
      item = kept[i];
      if (!item) continue;
      nd = item.node ? item.node : item;
      key = nd.id;
      if (seen2[key]) continue;
      seen2[key] = 1;
      out.push(item.node ? item : wrap(nd, iso));
    }
    if (window.plannerRoutinesOn) {
      var extra = window.plannerRoutinesOn(iso);
      for (i = 0; i < extra.length; i++) {
        if (seen2[extra[i].id]) continue;
        seen2[extra[i].id] = 1;
        out.push(wrap(extra[i], iso));
      }
    }
    return out;
  };
})();


/* ===== m175 the month shows the time ===== */
(function () {
    function label12(hhmm) {
        if (!hhmm) return '';
        var idx = hhmm.indexOf(':');
        if (idx === -1) return '';
        var hStr = hhmm.substring(0, idx);
        var mStr = hhmm.substring(idx + 1);
        var h = parseInt(hStr, 10);
        var m = parseInt(mStr, 10);
        if (isNaN(h) || isNaN(m)) return '';
        var suffix = h >= 12 ? 'p' : 'a';
        var hr = h % 12;
        if (hr === 0) hr = 12;
        var mm = m < 10 ? '0' + m : m;
        return hr + ':' + mm + suffix;
    }

    function timeOfChip(chip) {
        var id = chip.getAttribute('data-node-id');
        if (!id) return '';
        var f = window.findNode ? window.findNode(id) : null;
        var nd = f && f.node ? f.node : null;
        return (nd && nd.time) ? nd.time : '';
    }

    function decorate(root) {
        var root = root || document;
        var chips = root.querySelectorAll('.mchip'), i, chip, t, tag;
        for (i = 0; i < chips.length; i++) {
            chip = chips[i];
            if (chip.getAttribute('data-timed') === '1') continue;
            t = timeOfChip(chip);
            chip.setAttribute('data-timed', '1');
            chip.setAttribute('data-time', t || '');
            if (!t) continue;
            tag = document.createElement('span');
            tag.className = 'mtime';
            tag.textContent = label12(t);
            chip.insertBefore(tag, chip.firstChild);
        }
        var cells = root.querySelectorAll('.mchips'), c, list, j, arr;
        for (i = 0; i < cells.length; i++) {
            c = cells[i];
            list = c.querySelectorAll('.mchip');
            arr = [];
            for (j = 0; j < list.length; j++) arr.push(list[j]);
            arr.sort(function (a, b) {
                var x = a.getAttribute('data-time') || '', y = b.getAttribute('data-time') || '';
                if (!x && !y) return 0;
                if (!x) return 1;
                if (!y) return -1;
                if (x < y) return -1;
                if (x > y) return 1;
                return 0;
            });
            for (j = 0; j < arr.length; j++) c.appendChild(arr[j]);
        }
    }

    var baseMonth = window.renderMonth;
    if (typeof baseMonth === 'function') {
        window.renderMonth = function () {
            var r = baseMonth.apply(this, arguments);
            try { decorate(document.getElementById('monthGrid') || document); } catch (e) {}

/* ===== m180 new-build pill ===== */
(function () {
    var MINE = '';
    var pill = null;
    var waitInterval = null;

    function stampOf(text) {
        var m = String(text).match(/id="buildStamp">([^<]*)/);
        return m ? m[1].trim() : '';
    }

    function busy() {
        var active = document.activeElement;
        if (active) {
            var tag = active.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || active.isContentEditable) {
                return true;
            }
        }
        var dialog = document.querySelector('.modal-backdrop, .ea, .actmenu');
        if (dialog) {
            return true;
        }
        var sel = window.getSelection && window.getSelection();
        if (sel && String(sel).length > 0) {
            return true;
        }
        if (document.visibilityState === 'hidden') {
            return true;
        }
        return false;
    }

    function startWaiter() {
        if (waitInterval) {
            return;
        }
        waitInterval = setInterval(function () {
            if (!busy()) {
                clearInterval(waitInterval);
                waitInterval = null;
                location.reload();
            }
        }, 1500);
    }

    function show() {
        if (pill) {
            return;
        }
        pill = document.createElement('button');
        pill.type = 'button';
        pill.className = 'newbuild-pill';
        pill.textContent = 'New version ready - tap to load';
        pill.addEventListener('click', function () {
            if (waitInterval) {
                clearInterval(waitInterval);
                waitInterval = null;
            }
            location.reload(true);
        });
        document.body.appendChild(pill);
    }

    function check() {
        if (!window.fetch) {
            return;
        }
        fetch(location.href, { cache: 'no-store' })
            .then(function (r) { return r.text(); })
            .then(function (t) {
                var there = stampOf(t);
                if (there && MINE && there !== MINE) {
                    if (!busy()) {
                        location.reload();
                    } else {
                        show();
                        startWaiter();
                    }
                }
            })
            .catch(function () {});
    }

    function start() {
        var el = document.getElementById('buildStamp');
        MINE = el ? el.textContent.trim() : '';
        if (!MINE) {
            return;
        }
        setInterval(check, 60000);
        setTimeout(check, 8000);
        document.addEventListener('visibilitychange', check);
        window.addEventListener('focus', check);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
    } else {
        start();
    }
})();

    // Remove EVERY previous header, from the tab as well as the grid. The header
      // moved out of #monthGrid, but this only ever looked inside it - so each
      // render appended another and ten stacked up, shoving the grid down the page.
      var tabEl = document.getElementById('tabMonth') || host.parentElement;
      var stale = [], q, z;
      q = host.querySelectorAll('.tgtop');
      for (z = 0; z < q.length; z++) stale.push(q[z]);
      if (tabEl) {
        q = tabEl.querySelectorAll(':scope > .tgtop');
        for (z = 0; z < q.length; z++) stale.push(q[z]);
      }
      for (z = 0; z < stale.length; z++) {
        if (stale[z].parentNode) stale[z].parentNode.removeChild(stale[z]);
      }
    var top = document.createElement('div');
    top.className = 'tgtop';

    var prev = document.createElement('button');
    prev.type='button'; prev.textContent='◀';
    prev.setAttribute('title','Previous month');
    prev.addEventListener('click', function(){ shift(-1); });

    var lab = document.createElement('span');
    lab.className = 'tgdatelabel';
    lab.setAttribute('data-datepop','1');
    lab.setAttribute('title','Pick a date');
    lab.textContent = labelText();
    lab.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      if (window.__openDatePop) window.__openDatePop(this);
    });

    var next = document.createElement('button');
    next.type='button'; next.textContent='▶';
    next.setAttribute('title','Next month');
    next.addEventListener('click', function(){ shift(1); });

    var today = document.createElement('button');
    today.type='button'; today.textContent='This month';
    today.addEventListener('click', function(){
      window.selectedDate = window.todayISO();
         var n = new Date();
         window.viewMonth = new Date(n.getFullYear(), n.getMonth(), 1);
         window.renderAll(); });

    var spacer = document.createElement('span');
    spacer.className = 'tgspacer';

    top.appendChild(prev); top.appendChild(lab); top.appendChild(next);
    top.appendChild(today); top.appendChild(spacer);
    // Put the header where the WEEK view puts its own: at the top of the tab,
      // ABOVE the grid - not inside it. #monthGrid is display:grid with
      // grid-auto-rows: minmax(88px,1fr), so a header placed inside it was forced
      // to an 88px row instead of the week header's 42px.
      var tab = document.getElementById('tabMonth') || host.parentElement;
      if (tab && tab !== host) {
        if (host.parentNode === tab) tab.insertBefore(top, host);
        else tab.insertBefore(top, tab.firstChild);
      } else if (host.firstChild) { host.insertBefore(top, host.firstChild); }
      else { host.appendChild(top); }
  }

  var base = window.renderMonth;
  if (typeof base === 'function') {
    window.renderMonth = function () {
      var r = base.apply(this, arguments);
      try { build(); } catch (e) {}
      return r;
    };
  }
  window.__buildMonthHeader = build;
  setTimeout(build, 1200);
})();


/* ===== m183 undo ===== */
(function () {
  var MAX = 30;
  var stack = [];
  var prev = null;
  var restoring = false;
  var btn = null;

  function snap() {
    try { return JSON.stringify(window.Store.data); } catch (e) { return null; }
  }

  function label() {
    if (!btn) return;
    btn.textContent = stack.length ? ('↶  Undo last change (' + stack.length + ')') : '↶  Nothing to undo';
    btn.disabled = !stack.length;
    btn.style.opacity = stack.length ? '1' : '.5';
  }

  function record() {
    if (restoring) return;
    if (prev !== null) {
      var cur = snap();
      if (cur !== null && cur !== prev) {
        stack.push(prev);
        if (stack.length > MAX) stack.shift();
      }
    }
    prev = snap();
    label();
  }

  window.plannerUndo = function () {
    if (!stack.length) return false;
    var s = stack.pop();
    var parsed;
    try { parsed = JSON.parse(s); } catch (e) { return false; }
    restoring = true;
    window.Store.data = parsed;
    try { window.Store.save(); } catch (e) {}
    restoring = false;
    prev = snap();
    label();
    try { window.renderAll(); } catch (e) {}
    return true;
  };

  window.plannerUndoDepth = function () { return stack.length; };

  function wrapSave() {
    var base = window.Store && window.Store.save;
    if (typeof base !== 'function') return false;
    window.Store.save = function () {
      try { record(); } catch (e) {}
      return base.apply(this, arguments);
    };
    prev = snap();
    return true;
  }

  function addButton() {
    var d = document.getElementById('treeDrawer');
    if (!d) return;
    if (document.getElementById('btnUndo')) return;
    btn = document.createElement('button');
    btn.id = 'btnUndo';
    btn.type = 'button';
    btn.className = 'drawer-btn';
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      window.plannerUndo();
    });
    d.appendChild(btn);
    label();
  }

  function start() {
    wrapSave();
    addButton();
    setInterval(addButton, 2000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(start, 600); });
  } else {
    setTimeout(start, 600);
  }
})();


/* ===== m184 uniform calendar headers ===== */
(function () {
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function shortOf(iso) {
    var p = String(iso || '').split('-');
    if (p.length !== 3) return '';
    var mi = parseInt(p[1], 10) - 1;
    if (isNaN(mi) || mi < 0 || mi > 11) return '';
    return MON[mi] + ' ' + parseInt(p[2], 10);
  }

  // The DAY view keeps its weekday - the operator asked for "Thursday, Aug 20".
  // Week and month stay bare, because a week or a month has no single weekday.
  function dayLabel(iso) {
    var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var s = shortOf(iso);
    if (!s) return '';
    var p = String(iso).split('-');
    var d = new Date(parseInt(p[0],10), parseInt(p[1],10) - 1, parseInt(p[2],10));
    if (isNaN(d.getTime())) return s;
    return DAYS[d.getDay()] + ', ' + s;
  }

  function fixDay() {
    var top = document.querySelector('#dayView .tgtop');
    if (!top) return;
    var badge = top.querySelector('.relbadge');
    if (badge) badge.style.display = 'none';
    var t = top.querySelector('.tgtitle');
    if (t) {
      var s = dayLabel(window.selectedDate);
      if (s) t.textContent = s;
      t.classList.add('tgdatelabel');
      if (t.getAttribute('data-datepop') !== '1') {
        t.setAttribute('data-datepop', '1');
        t.setAttribute('title', 'Pick a date');
        t.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          if (window.__openDatePop) window.__openDatePop(this);
        });
      }
    }
    // Day had no Today control where week and month put theirs (right after the
    // next arrow) - its only one sat at the far end, past "Show 24h". Same button,
    // same slot, so the three headers finally match.
    if (!top.querySelector('.tgtoday-btn')) {
      var nextBtn = null, kids = top.children, q;
      for (q = 0; q < kids.length; q++) {
        if (kids[q].tagName === 'BUTTON' && kids[q].textContent.indexOf('\u25B6') >= 0) nextBtn = kids[q];
      }
      var tb = document.createElement('button');
      tb.type = 'button';
      tb.className = 'tgtoday-btn';
      tb.textContent = 'Today';
      tb.addEventListener('click', function (e) {
        e.preventDefault();
        window.selectedDate = window.todayISO();
        var nn = new Date();
        window.viewMonth = new Date(nn.getFullYear(), nn.getMonth(), 1);
        window.renderAll();
      });
      if (nextBtn && nextBtn.nextSibling) top.insertBefore(tb, nextBtn.nextSibling);
      else top.appendChild(tb);
    }
    var inline = top.querySelector('.btn-today-inline');
    if (inline) inline.style.display = 'none';
  }

  function fixWeek() {
    var top = document.querySelector('#weekGrid .tgtop');
    if (!top) return;
    var lab = top.querySelector('.tgdatelabel');
    if (!lab) return;
    var txt = lab.textContent.trim();
    var m = txt.match(/^([A-Za-z]{3}) (\d+) - ([A-Za-z]{3}) (\d+)$/);
    if (m && m[1] === m[3]) lab.textContent = m[1] + ' ' + m[2] + ' - ' + m[4];
    var inline = top.querySelector('.btn-today-inline');
    if (inline) inline.style.display = 'none';
  }

  function run() {
    try { fixDay(); } catch (e) {}
    try { fixWeek(); } catch (e) {}
  }

  ['renderDay', 'renderWeek', 'renderAll'].forEach(function (fn) {
    var base = window[fn];
    if (typeof base !== 'function') return;
    window[fn] = function () {
      var r = base.apply(this, arguments);
      try { run(); } catch (e) {}
      return r;
    };
  });
  window.__uniformHeaders = run;
  setTimeout(run, 1200);
})();




/* ===== m186 empty-task sweep + must-live-in-a-branch ===== */
(function () {
  var EMPTY_MS = 3 * 60 * 1000;
  var stamps = {};

  function isBlank(n) {
    if (!n) return false;
    if (n.children && n.children.length) return false;
    if (String(n.title || '').trim()) return false;
    if (String(n.notes || '').trim()) return false;
    if (n.date || n.time) return false;
    if (n.tags && n.tags.length) return false;
    if (n.done) return false;
    return true;
  }

  function isBeingEdited(id) {
    var a = document.activeElement;
    if (!a) return false;
    var row = document.querySelector('#treeRoot .tree-row[data-id="' + id + '"]');
    if (row && (row === a || row.contains(a))) return true;
    if (a.isContentEditable) return true;
    var t = (a.tagName || '').toUpperCase();
    if (t === 'INPUT' || t === 'TEXTAREA') return true;
    if (document.querySelector('.modal-backdrop, .ea')) return true;
    return false;
  }

  function sweep() {
    var now = Date.now();
    var seen = {}, doomed = [];
    window.walkTree(function (n) {
      if (!n || !n.id) return;
      seen[n.id] = 1;
      if (!isBlank(n)) { delete stamps[n.id]; return; }
      if (!stamps[n.id]) { stamps[n.id] = now; return; }
      if (now - stamps[n.id] >= EMPTY_MS && !isBeingEdited(n.id)) doomed.push(n.id);
    });
    var k;
    for (k in stamps) { if (!seen[k]) delete stamps[k]; }
    if (!doomed.length) return 0;
    var removed = 0, i;
    for (i = 0; i < doomed.length; i++) {
      var f = window.findNode(doomed[i]);
      if (!f || !f.node) continue;
      if (!isBlank(f.node)) continue;
      var list = f.parent ? f.parent.children : window.Store.data.tree;
      var idx = list.indexOf(f.node);
      if (idx >= 0) { list.splice(idx, 1); removed++; delete stamps[doomed[i]]; }
    }
    if (removed) { try { window.Store.save(); } catch (e) {} 
                   try { window.renderAll(); } catch (e) {} }
    return removed;
  }

  window.plannerSweepEmpty = sweep;
  window.__emptyStamps = stamps;
  setInterval(function () { try { sweep(); } catch (e) {} }, 20000);

  function topLevelIds() {
    var out = [], t = window.Store.data.tree || [], i;
    for (i = 0; i < t.length; i++) {
      if (t[i] && t[i].children && t[i].children.length) out.push({id: t[i].id, title: t[i].title});
    }
    return out;
  }

  window.plannerNeedsBranch = function (id) {
    var f = window.findNode(id);
    if (!f || !f.node) return false;
    if (f.parent) return false;
    if (f.node.children && f.node.children.length) return false;
    return true;
  };

  window.plannerFileUnder = function (id, branchId) {
    var f = window.findNode(id), b = window.findNode(branchId);
    if (!f || !f.node || !b || !b.node) return false;
    if (f.node === b.node) return false;
    var list = f.parent ? f.parent.children : window.Store.data.tree;
    var idx = list.indexOf(f.node);
    if (idx < 0) return false;
    list.splice(idx, 1);
    if (!b.node.children) b.node.children = [];
    b.node.children.push(f.node);
    try { window.Store.save(); } catch (e) {}
    try { window.renderAll(); } catch (e) {}
    return true;
  };

  window.plannerBranchChoices = topLevelIds;
})();


/* ===== m187  a task must be filed under a branch before it is saved =====
   Operator: "you have to save the task within a branch, so if I try to press save,
   it will direct me to put in a branch." A task sitting at the top level with no
   branch is how things got lost. Saving one now opens a branch picker first. */
(function () {
  function pickBranch(nodeId, onDone) {
    var choices = (window.plannerBranchChoices ? window.plannerBranchChoices() : []) || [];
    var back = document.createElement('div');
    back.className = 'modal-backdrop branchpick-back';
    var box = document.createElement('div');
    box.className = 'branchpick';

    var h = document.createElement('div');
    h.className = 'branchpick-head';
    h.textContent = 'Which branch does this belong to?';
    box.appendChild(h);

    var sub = document.createElement('div');
    sub.className = 'branchpick-sub';
    sub.textContent = 'A task has to live under a branch so it can be found later.';
    box.appendChild(sub);

    var list = document.createElement('div');
    list.className = 'branchpick-list';
    if (!choices.length) {
      var none = document.createElement('div');
      none.className = 'branchpick-sub';
      none.textContent = 'No branches yet - create one first.';
      list.appendChild(none);
    }
    choices.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'branchpick-item';
      b.textContent = c.title || '(untitled branch)';
      b.addEventListener('click', function () {
        if (window.plannerFileUnder) window.plannerFileUnder(nodeId, c.id);
        close();
        if (onDone) onDone(true);
      });
      list.appendChild(b);
    });
    box.appendChild(list);

    var foot = document.createElement('div');
    foot.className = 'branchpick-foot';
    var later = document.createElement('button');
    later.type = 'button';
    later.className = 'branchpick-later';
    later.textContent = 'Leave it unfiled';
    later.addEventListener('click', function () { close(); if (onDone) onDone(false); });
    foot.appendChild(later);
    box.appendChild(foot);

    function close() {
      if (back.parentNode) back.parentNode.removeChild(back);
    }
    back.appendChild(box);
    back.addEventListener('click', function (e) { if (e.target === back) { close(); if (onDone) onDone(false); } });
    document.body.appendChild(back);
  }

  window.plannerPickBranch = pickBranch;

  // Intercept the Edit dialog's save/close, in the capture phase, BEFORE it closes.
  document.addEventListener('click', function (e) {
    var b = e.target;
    while (b && b !== document && !(b.tagName === 'BUTTON')) b = b.parentElement;
    if (!b || b.tagName !== 'BUTTON') return;
    if (!/^(save|done|ok)$/i.test(b.textContent.trim())) return;
    var ea = document.querySelector('.ea');
    if (!ea) return;
    var id = ea.getAttribute('data-node-id') || window.__editingNodeId;
    if (!id || !window.plannerNeedsBranch || !window.plannerNeedsBranch(id)) return;
    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
    pickBranch(id, function () { b.click(); });
  }, true);
})();

/* ===== m188  separate menus for the calendar and the priority tree =====
   One menu served both, so the calendar carried tree-only items. Operator's order,
   Duplicate removed from both, "Show in tree" removed from both (meaningless inside
   the tree, and dropped from the calendar at their request). The tree keeps
   Show/Hide hidden below - a tree-only view toggle with nothing to act on in a
   calendar. Delete stays last and stays danger-styled in both. */
(function () {
  var CAL   = ['Edit', 'Complete', 'Mark not complete', 'Due today', 'Due tomorrow',
               'Reschedule...', 'Delete'];
  var TREE  = ['Edit', 'Complete', 'Mark not complete', 'Due today', 'Due tomorrow',
               'Reschedule...', 'Show hidden below', 'Hide hidden below', 'Delete'];

  /* The hidden-tasks control used to be ONE item that changed its own label, so you
     could never see both states. Operator asked for both, stacked, with whichever is
     already in effect greyed out - so the menu shows what IS and what you can switch to. */
  function twoWayHidden(menu, id) {
    var existing = null, all = menu.querySelectorAll('.actmenu-item'), i;
    for (i = 0; i < all.length; i++) {
      var t = all[i].textContent.trim();
      if (t === 'Show hidden below' || t === 'Hide hidden below') { existing = all[i]; break; }
    }
    if (!existing) return;
    var showing = !!(window.isRevealed && window.isRevealed(id));

    var showBtn = existing;
    showBtn.textContent = 'Show hidden below';
    var hideBtn = showBtn.cloneNode(false);
    hideBtn.className = showBtn.className;
    hideBtn.textContent = 'Hide hidden below';

    function wire(btn, wantShown) {
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        if (btn.getAttribute('data-inactive') === '1') { e.stopPropagation(); return; }
        // The real function is revealBelow - toggleRevealed/setRevealed do not exist,
        // so both buttons silently did nothing. Found by checking which globals are
        // actually defined instead of assuming the name.
        if (typeof window.revealBelow === 'function') window.revealBelow(id);
        if (window.__closeActMenu) window.__closeActMenu();
        if (window.renderAll) window.renderAll();
      });
    }
    var fresh = showBtn.cloneNode(false);
    fresh.className = showBtn.className;
    fresh.textContent = 'Show hidden below';
    if (showBtn.parentNode) showBtn.parentNode.replaceChild(fresh, showBtn);
    showBtn = fresh;
    wire(showBtn, true);
    wire(hideBtn, false);
    if (showBtn.nextSibling) showBtn.parentNode.insertBefore(hideBtn, showBtn.nextSibling);
    else showBtn.parentNode.appendChild(hideBtn);

    // grey out whichever state is already in effect
    var dim = showing ? showBtn : hideBtn;
    var live = showing ? hideBtn : showBtn;
    dim.setAttribute('data-inactive', '1');
    dim.classList.add('actmenu-dim');
    live.removeAttribute('data-inactive');
    live.classList.remove('actmenu-dim');
  }

  function orderOf(list, label) {
    var i;
    for (i = 0; i < list.length; i++) { if (list[i] === label) return i; }
    return -1;
  }

  function applyTo(menu, fromTree) {
    var allowed = fromTree ? TREE : CAL;
    var btns = menu.querySelectorAll('.actmenu-item');
    var keep = [], i, b, label;
    for (i = 0; i < btns.length; i++) {
      b = btns[i];
      label = b.textContent.trim();
      if (orderOf(allowed, label) < 0) { if (b.parentNode) b.parentNode.removeChild(b); continue; }
      keep.push(b);
    }
    keep.sort(function (x, y) {
      return orderOf(allowed, x.textContent.trim()) - orderOf(allowed, y.textContent.trim());
    });
    for (i = 0; i < keep.length; i++) menu.appendChild(keep[i]);

    // Operator: drop the line after Complete and the line after Reschedule. Keep only
    // the one above Delete, so the destructive item stays visually set apart.
    var seps = menu.querySelectorAll('.actmenu-sep'), s;
    for (s = 0; s < seps.length; s++) {
      if (seps[s].parentNode) seps[s].parentNode.removeChild(seps[s]);
    }
    var del = null, kids = menu.querySelectorAll('.actmenu-item');
    for (s = 0; s < kids.length; s++) {
      if (kids[s].textContent.trim() === 'Delete') del = kids[s];
    }
    if (del) {
      var sep = document.createElement('div');
      sep.className = 'actmenu-sep';
      del.parentNode.insertBefore(sep, del);
    }
  }

  var lastFromTree = false;
  // Remember where the menu was opened from. A tree row lives inside #treeRoot.
  document.addEventListener('mousedown', function (e) {
    var el = e.target;
    while (el && el !== document) {
      if (el.id === 'treeRoot') { lastFromTree = true; return; }
      if (el.id === 'weekGrid' || el.id === 'dayView' || el.id === 'monthGrid' ||
          el.id === 'tabMonth') { lastFromTree = false; return; }
      el = el.parentElement;
    }
  }, true);

  /* Watch for the menu appearing, whatever built it.
     Wrapping window.__openActMenu was not enough: the calendar's own three-dot handler
     calls the builder DIRECTLY inside its module, so the wrapper never ran and the
     calendar kept the old menu entirely. An observer catches every path - the wrapper,
     the calendar's internal call, right-click, anything added later. */
  function contextFor(menu, id) {
    var tr = document.getElementById('treeRoot');
    var mr = menu.getBoundingClientRect();
    if (tr) {
      var b = tr.getBoundingClientRect();
      return (mr.left <= b.right + 8);
    }
    return false;
  }
  function idFor(menu) {
    var d = menu.getAttribute('data-node-id') || menu.getAttribute('data-id');
    if (d) return d;
    if (window.__actMenuId) return window.__actMenuId;
    return null;
  }
  var obs = new MutationObserver(function (recs) {
    var i, j;
    for (i = 0; i < recs.length; i++) {
      for (j = 0; j < recs[i].addedNodes.length; j++) {
        var nd = recs[i].addedNodes[j];
        if (!nd || nd.nodeType !== 1) continue;
        var menu = nd.classList && nd.classList.contains('actmenu')
                   ? nd : (nd.querySelector ? nd.querySelector('.actmenu') : null);
        if (!menu || menu.getAttribute('data-split') === '1') continue;
        menu.setAttribute('data-split', '1');
        try {
          var fromTree = contextFor(menu, null);
          var id = idFor(menu);
          if (fromTree && id) twoWayHidden(menu, id);
          applyTo(menu, fromTree);
        } catch (e) {}
      }
    }
  });
  obs.observe(document.body, { childList: true, subtree: true });

  var base = window.__openActMenu;
  if (typeof base === 'function') {
    window.__openActMenu = function (id, x, y) {
      window.__actMenuId = id;
      var r = base.apply(this, arguments);
      // The observer does all the work now. This wrapper only records which node the
      // menu is for - running applyTo here as well added the Hide item twice.
      return r;
    };
  }
  window.__menuSetFromTree = function (v) { lastFromTree = !!v; };
  window.__menuAllowed = function (fromTree) { return fromTree ? TREE.slice() : CAL.slice(); };
})();
</script>
