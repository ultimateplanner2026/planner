/* ============================================================
   Planner — stylesheet part A
   Reset, tokens, layout shell, header, sync pill, tree pane + rows
   ============================================================ */

/* ---------- modern reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body, h1, h2, h3, h4, h5, h6, p, ul, ol, figure, blockquote, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea {
  font: inherit; color: inherit; margin: 0;
  background: none; border: none; padding: 0;
}
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }

/* ---------- tokens: light theme (default) ---------- */
:root {
  --bg:          #fafafa;
  --surface:     #ffffff;
  --surface-2:   #f4f4f5;
  --border:      #e4e4e7;
  --text:        #18181b;
  --text-dim:    #71717a;
  --accent:      #2563eb;
  --accent-soft: #dbeafe;
  --danger:      #dc2626;
  --ok:          #16a34a;
  --warn:        #d97706;

  --radius:      6px;
  --shadow:      0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.06);

  /* 8px spacing scale */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;

  /* derived */
  --hairline: 1px solid var(--border);
  --hover-bg: var(--surface-2);
}

/* ---------- tokens: OS dark preference ---------- */
@media (prefers-color-scheme: dark) {
  :root {
    --bg:          #09090b;
    --surface:     #18181b;
    --surface-2:   #27272a;
    --border:      #3f3f46;
    --text:        #fafafa;
    --text-dim:    #a1a1aa;
    --accent:      #60a5fa;
    --accent-soft: #1e3a8a;
    --danger:      #f87171;
    --ok:          #4ade80;
    --warn:        #fbbf24;
    --shadow:      0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.5);
  }
}

/* ---------- explicit theme overrides (win over media query) ---------- */
:root[data-theme="light"] {
  --bg:          #fafafa;
  --surface:     #ffffff;
  --surface-2:   #f4f4f5;
  --border:      #e4e4e7;
  --text:        #18181b;
  --text-dim:    #71717a;
  --accent:      #2563eb;
  --accent-soft: #dbeafe;
  --danger:      #dc2626;
  --ok:          #16a34a;
  --warn:        #d97706;
  --shadow:      0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.06);
}
:root[data-theme="dark"] {
  --bg:          #09090b;
  --surface:     #18181b;
  --surface-2:   #27272a;
  --border:      #3f3f46;
  --text:        #fafafa;
  --text-dim:    #a1a1aa;
  --accent:      #60a5fa;
  --accent-soft: #1e3a8a;
  --danger:      #f87171;
  --ok:          #4ade80;
  --warn:        #fbbf24;
  --shadow:      0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.5);
}

/* ---------- base layout ---------- */
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
               Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

/* ---------- header ---------- */
header#topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s2) var(--s4);
  background: var(--surface);
  border-bottom: var(--hairline);
  min-height: 48px;
}
header#topbar .group,
header#topbar .topbar-group {
  display: flex;
  align-items: center;
  gap: var(--s1);
}
header#topbar .group + .group,
header#topbar .topbar-group + .topbar-group {
  padding-left: var(--s3);
  margin-left: var(--s2);
  border-left: var(--hairline);
}
header#topbar .spacer,
header#topbar .topbar-spacer { flex: 1 1 auto; }
/* The markup uses class="topbar-group"/"topbar-spacer" but these rules only ever
   named .group/.spacer, so they never applied. The container fell back to
   display:block, its buttons became inline-level, and #btnToday - the only one
   containing text - aligned on a TEXT BASELINE, landing 4.094px below the arrow
   buttons beside it. That is the box that would not line up. */

header#topbar button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 28px;
  min-width: 28px;
  padding: 0 var(--s2);
  border-radius: var(--radius);
  color: var(--text);
  border: var(--hairline);
  background: var(--surface);
  transition: background .12s ease, border-color .12s ease, color .12s ease;
}
header#topbar button:hover { background: var(--surface-2); }
header#topbar button:active { background: var(--accent-soft); }
header#topbar button[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
header#topbar button.icon-only { padding: 0; }

#lblMonth {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  min-width: 130px;
  text-align: center;
  color: var(--text);
}
#btnPrevMonth, #btnNextMonth { font-size: 13px; }
#btnToday { font-weight: 500; }

/* ---------- sync pill ---------- */
#syncPill {
  display: inline-flex;
  align-items: center;
  gap: var(--s1);
  height: 24px;
  padding: 0 var(--s2);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-dim);
  background: var(--surface-2);
  border: var(--hairline);
  user-select: none;
  white-space: nowrap;
}
#syncPill::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  flex: 0 0 auto;
}
#syncPill[data-state="offline"]   { color: var(--text-dim); }
#syncPill[data-state="connecting"] { color: var(--warn); }
#syncPill[data-state="syncing"]    { color: var(--warn); }
#syncPill[data-state="syncing"]::before {
  animation: pillPulse 1s ease-in-out infinite;
}
#syncPill[data-state="synced"]    { color: var(--ok); }
#syncPill[data-state="error"]     { color: var(--danger); }
@keyframes pillPulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: .35; }
}

/* ---------- main layout ---------- */
main#main {
  flex: 1 1 auto;
  display: flex;
  flex-direction: row;
  min-height: 0;
  background: var(--bg);
}
aside#treePane {
  flex: 0 0 33%;
  min-width: 260px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--surface);
  border-right: var(--hairline);
  overflow: hidden;
}
div#splitter {
  flex: 0 0 5px;
  cursor: col-resize;
  background: var(--bg);
  border-left: var(--hairline);
  border-right: var(--hairline);
  position: relative;
  transition: background .15s ease;
}
div#splitter:hover,
div#splitter.dragging { background: var(--accent-soft); }
section#rightPane {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

/* responsive: stack under 900px */
@media (max-width: 900px) {
  body { overflow: auto; }
  main#main { flex-direction: column; }
  aside#treePane {
    flex: 0 0 auto;
    width: 100%;
    max-height: 40vh;
    border-right: none;
    border-bottom: var(--hairline);
  }
  aside#treePane.collapsed { max-height: 0; }
  div#splitter { display: none; }
}

/* ---------- tree pane toolbar ---------- */
.tree-toolbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding: var(--s2) var(--s3);
  border-bottom: var(--hairline);
  background: var(--surface);
}
#treeSearch {
  flex: 1 1 auto;
  height: 28px;
  padding: 0 var(--s2);
  background: var(--surface-2);
  border: var(--hairline);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  min-width: 0;
}
#treeSearch::placeholder { color: var(--text-dim); }
#treeSearch:focus { border-color: var(--accent); background: var(--surface); }

#btnAddGoal {
  flex: 0 0 auto;
  height: 28px;
  padding: 0 var(--s3);
  border-radius: var(--radius);
  background: var(--accent);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--accent);
  display: inline-flex;
  align-items: center;
  gap: var(--s1);
  transition: filter .12s ease;
}
#btnAddGoal:hover { filter: brightness(1.08); }
#btnAddGoal:active { filter: brightness(.92); }

.tree-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: var(--s2) var(--s1);
}

/* ---------- tree rows ---------- */
#treeRoot { display: block; }
.tree-children { display: block; }

.tree-row {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--s1);
  min-height: 30px;
  padding: 2px var(--s2) 2px 0;
  border-radius: var(--radius);
  color: var(--text);
  cursor: default;
  user-select: none;
}
.tree-row:hover { background: var(--hover-bg); }
.tree-row:focus-within { background: var(--hover-bg); }

/* priority accent bar */
.tree-row.high {
  box-shadow: inset 3px 0 0 0 var(--accent);
  padding-left: 0;
}
.tree-row.high .tree-title { padding-left: var(--s1); }

/* completion */
.tree-row.done .tree-title {
  color: var(--text-dim);
  text-decoration: line-through;
  text-decoration-color: var(--text-dim);
  text-decoration-thickness: 1px;
}
.tree-row.done { opacity: .85; }

/* drag visuals */
.tree-row.dragging { opacity: .4; }
.tree-row.drop-into {
  outline: 2px dashed var(--accent);
  outline-offset: -2px;
  background: var(--accent-soft);
}
.tree-row.drop-before { box-shadow: inset 0 2px 0 0 var(--accent); }
.tree-row.drop-after  { box-shadow: inset 0 -2px 0 0 var(--accent); }

.tree-caret {
  flex: 0 0 16px;
  width: 16px;
  height: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  border-radius: 4px;
  transition: transform .12s ease, color .12s ease, background .12s ease;
  cursor: pointer;
}
.tree-caret:hover { color: var(--text); background: var(--surface-2); }
.tree-caret.open { transform: rotate(90deg); }
.tree-caret.placeholder { visibility: hidden; }

.tree-check {
  flex: 0 0 16px;
  width: 16px;
  height: 16px;
  border: 1px solid var(--border);
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  cursor: pointer;
  transition: background .12s ease, border-color .12s ease;
}
.tree-check:hover { border-color: var(--accent); }
.tree-check.checked {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.tree-check.checked svg { display: block; }
.tree-check svg { display: none; width: 12px; height: 12px; }

.tree-title {
  flex: 1 1 auto;
  min-width: 0;
  padding: 2px 4px;
  margin: 0;
  font-size: 13.5px;
  line-height: 1.3;
  border-radius: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tree-title[contenteditable="true"]:focus {
  outline: none;
  background: var(--surface);
  box-shadow: 0 0 0 2px var(--accent-soft);
  white-space: normal;
}

.tree-datechip {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 18px;
  padding: 0 6px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-dim);
  background: var(--surface-2);
  border: var(--hairline);
  border-radius: 999px;
  white-space: nowrap;
}
.tree-datechip.overdue { color: var(--danger); border-color: var(--danger); }
.tree-datechip.today   { color: var(--accent); border-color: var(--accent); }

.tree-row .indent {
  flex: 0 0 auto;
  display: inline-block;
  width: 14px;
}

/* row actions: hidden until hover or focus */
.tree-actions {
  flex: 0 0 auto;
  display: none;
  align-items: center;
  gap: 2px;
  margin-left: var(--s1);
}
.tree-row:hover .tree-actions,
.tree-row:focus-within .tree-actions { display: inline-flex; }
.tree-actions button {
  width: 22px;
  height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  color: var(--text-dim);
  background: transparent;
  transition: background .12s ease, color .12s ease;
}
.tree-actions button:hover {
  background: var(--surface);
  color: var(--text);
}
.tree-actions button.danger:hover { color: var(--danger); }
.tree-actions svg { width: 14px; height: 14px; }

/* drag handle cue */
.tree-row[draggable="true"] { cursor: grab; }
.tree-row.dragging { cursor: grabbing; }


/* ============================================================
   Tabs bar
   ============================================================ */
#tabsBar {
  display: flex;
  align-items: stretch;
  gap: 0;
  padding: 0 8px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
#tabsBar::-webkit-scrollbar { display: none; }

.tab {
  appearance: none;
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 16px;
  margin-bottom: -1px;
  cursor: pointer;
  white-space: nowrap;
  border-radius: 0;
  transition: color 120ms ease, border-color 120ms ease;
}
.tab:hover {
  color: var(--text);
}
.tab.active {
  color: var(--text);
  border-bottom-color: var(--accent);
  font-weight: 600;
}

/* ============================================================
   Tab panels
   ============================================================ */
#tabMonth,
#tabDay,
#tabJournal,
#tabHabits {
  display: none;
  flex: 1;
  min-height: 0;
  overflow: auto;
}
#tabMonth.active,
#tabDay.active,
#tabJournal.active,
#tabHabits.active {
  display: flex;
  flex-direction: column;
}

/* ============================================================
   Month grid
   ============================================================ */
#monthGrid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: var(--border);
  padding: 1px;
  flex: 1;
  min-height: 0;
  align-content: start;
}

.mhead {
  background: var(--surface);
  padding: 8px 10px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-dim);
  text-align: left;
  position: sticky;
  top: 0;
  z-index: 1;
}

.mcell {
  background: var(--surface);
  min-height: 110px;
  padding: 6px 8px 8px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow: hidden;
  position: relative;
  cursor: default;
}

.mcell .mnum {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-dim);
  line-height: 1;
  margin-bottom: 2px;
}

.mcell.other {
  background: var(--surface-2);
  opacity: 0.55;
}
.mcell.other .mnum {
  color: var(--text-dim);
}

.mcell.today {
  background: var(--accent-soft);
}
.mcell.today .mnum {
  color: var(--accent);
  font-weight: 700;
}

.mcell.selected {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
  z-index: 1;
}

.mcell.dropping {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 2px var(--accent);
}

.mchips {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-height: 0;
  overflow: hidden;
}

.mchip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 6px 2px 4px;
  border-radius: 4px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  font-size: 11px;
  line-height: 1.4;
  color: var(--text);
  cursor: grab;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  min-width: 0;
  position: relative;
}
.mchip::before {
  content: "";
  display: block;
  width: 3px;
  align-self: stretch;
  border-radius: 2px;
  background: transparent;
  flex-shrink: 0;
}
.mchip.high::before {
  background: var(--accent);
}
.mchip .mtitle {
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.mchip.done {
  opacity: 0.5;
  text-decoration: line-through;
}
.mchip:active {
  cursor: grabbing;
}

.mmore {
  font-size: 10px;
  color: var(--text-dim);
  padding: 1px 6px;
  border-radius: 3px;
  align-self: flex-start;
  cursor: pointer;
}
.mmore:hover {
  background: var(--surface-2);
  color: var(--text);
}

/* ============================================================
   Day view
   ============================================================ */
#dayView {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  padding: 1px;
  flex: 1;
  min-height: 0;
}

.daycol {
  background: var(--surface);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

.daycol.dropping {
  background: var(--accent-soft);
}

.daycol-head {
  padding: 8px 12px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.daycol-list {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.daycol-empty {
  color: var(--text-dim);
  font-size: 12px;
  padding: 8px;
  text-align: center;
  opacity: 0.6;
}

.daycol-quick {
  padding: 8px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}
.daycol-quick input {
  flex: 1;
  min-width: 0;
  padding: 6px 8px;
  font: inherit;
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  outline: none;
}
.daycol-quick input:focus {
  border-color: var(--accent);
}
.daycol-quick button {
  padding: 6px 10px;
  font-size: 12px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  border-radius: var(--radius);
  cursor: pointer;
  font: inherit;
}
.daycol-quick button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.dayitem {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface-2);
  font-size: 12px;
  cursor: pointer;
  min-height: 32px;
  position: relative;
}
.dayitem::before {
  content: "";
  display: block;
  width: 3px;
  align-self: stretch;
  border-radius: 2px;
  background: transparent;
  flex-shrink: 0;
}
.dayitem.high::before {
  background: var(--accent);
}
.dayitem .diet {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dayitem .dimeta {
  font-size: 10px;
  color: var(--text-dim);
  flex-shrink: 0;
}
.dayitem.done {
  opacity: 0.55;
  text-decoration: line-through;
}
.dayitem:hover {
  border-color: var(--accent);
}

@media (max-width: 1100px) {
  #dayView {
    grid-template-columns: 1fr;
  }
}

/* ============================================================
   Journal view
   ============================================================ */
#journalView {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
  padding: 16px;
  flex: 1;
  min-height: 0;
  overflow: auto;
}

.journal-main {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
}

.journal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.journal-head h2 {
  font-size: 14px;
  font-weight: 600;
  margin: 0;
}

.journal-saved {
  font-size: 11px;
  color: var(--text-dim);
  opacity: 0;
  transition: opacity 300ms ease;
}
.journal-saved.show {
  opacity: 1;
}

#journalText {
  flex: 1;
  min-height: 420px;
  width: 100%;
  padding: 12px 14px;
  font: inherit;
  font-size: 13px;
  line-height: 1.6;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  outline: none;
  resize: none;
  overflow: auto;
}
#journalText:focus {
  border-color: var(--accent);
}

.jlist {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-height: 0;
  overflow: auto;
  padding-right: 4px;
}
.jlist h3 {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-dim);
  margin: 4px 0 4px;
}
.jrow {
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.jrow:hover {
  border-color: var(--accent);
}
.jrow .jdate {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 500;
}
.jrow .jprev {
  font-size: 12px;
  color: var(--text);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: normal;
}
.jrow.empty {
  color: var(--text-dim);
  font-size: 12px;
  cursor: default;
  text-align: center;
  padding: 16px;
}
.jrow.empty:hover {
  border-color: var(--border);
}

@media (max-width: 900px) {
  #journalView {
    grid-template-columns: 1fr;
  }
}

/* ============================================================
   Habits view
   ============================================================ */
#habitsView {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex: 1;
  min-height: 0;
  overflow: auto;
}

.habits-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.habits-head h2 {
  font-size: 14px;
  font-weight: 600;
  margin: 0;
}

.habits-add {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}
.habits-add input[type="text"] {
  flex: 1;
  min-width: 140px;
  padding: 6px 8px;
  font: inherit;
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  outline: none;
}
.habits-add input[type="text"]:focus {
  border-color: var(--accent);
}
.habits-add input[type="number"] {
  width: 70px;
  padding: 6px 8px;
  font: inherit;
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  outline: none;
}
.habits-add input[type="color"] {
  width: 28px;
  height: 28px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  cursor: pointer;
}
.habits-add select {
  padding: 6px 8px;
  font: inherit;
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  outline: none;
  font-family: inherit;
}
.habits-add button {
  padding: 6px 12px;
  font: inherit;
  font-size: 12px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--surface);
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 500;
}
.habits-add button:hover {
  opacity: 0.9;
}

.habits-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.habit-row {
  display: grid;
  grid-template-columns: 1.5fr repeat(7, 28px) 60px 28px;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}

.habit-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.habit-cell {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  cursor: pointer;
  justify-self: center;
  transition: transform 80ms ease, border-color 120ms ease;
}
.habit-cell:hover {
  border-color: var(--accent);
}
.habit-cell.done {
  border-color: transparent;
}
.habit-cell.today {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.habit-streak {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 500;
  text-align: right;
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--surface-2);
}
.habit-streak.has {
  color: var(--text);
  background: var(--accent-soft);
  font-weight: 600;
}

.habit-del {
  width: 24px;
  height: 24px;
  padding: 0;
  border: 1px solid transparent;
  background: transparent;
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  line-height: 1;
}
.habit-del:hover {
  background: var(--surface-2);
  color: var(--danger);
  border-color: var(--border);
}

.habits-empty {
  padding: 24px;
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}

/* ============================================================
   Toast notifications
   ============================================================ */
#toast {
  position: fixed;
  bottom: 16px;
  right: 16px;
  display: flex;
  flex-direction: column-reverse;
  gap: 8px;
  z-index: 9999;
  pointer-events: none;
  max-width: calc(100vw - 32px);
}

.toast {
  pointer-events: auto;
  padding: 10px 14px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  font-size: 13px;
  color: var(--text);
  min-width: 200px;
  max-width: 360px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  animation: toastIn 180ms ease-out;
}

.toast.ok { border-left: 3px solid var(--ok); }
.toast.warn { border-left: 3px solid var(--warn); }
.toast.err { border-left: 3px solid var(--danger); }

.toast.dismissing {
  animation: toastOut 200ms ease-in forwards;
}

@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateX(20px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes toastOut {
  from {
    opacity: 1;
    transform: translateX(0);
  }
  to {
    opacity: 0;
    transform: translateX(20px);
  }
}

/* ============================================================
   Modal
   ============================================================ */
#modalHost {
  position: fixed;
  inset: 0;
  z-index: 10000;
  pointer-events: none;
}
#modalHost:not(:empty) {
  pointer-events: auto;
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  animation: fadeIn 140ms ease-out;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  max-width: 480px;
  width: 100%;
  max-height: calc(100vh - 32px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: modalIn 160ms ease-out;
}

.modal-head {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-shrink: 0;
}
.modal-head h3 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
}
.modal-close {
  appearance: none;
  background: transparent;
  border: 0;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: inherit;
}
.modal-close:hover {
  color: var(--text);
  background: var(--surface-2);
}

.modal-body {
  padding: 16px;
  overflow: auto;
  flex: 1;
  min-height: 0;
  font-size: 13px;
  line-height: 1.5;
}

.modal-foot {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  flex-shrink: 0;
  background: var(--surface-2);
}

.modal-foot button {
  appearance: none;
  font: inherit;
  font-size: 12px;
  padding: 6px 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 500;
}
.modal-foot button:hover {
  border-color: var(--accent);
}
.modal-foot button.primary {
  background: var(--accent);
  color: var(--surface);
  border-color: var(--accent);
}
.modal-foot button.primary:hover {
  opacity: 0.9;
}
.modal-foot button.danger {
  border-color: var(--danger);
  color: var(--danger);
}
.modal-foot button.danger:hover {
  background: var(--danger);
  color: var(--surface);
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modalIn {
  from {
    opacity: 0;
    transform: translateY(-8px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ============================================================
   Responsive: under 900px
   ============================================================ */
@media (max-width: 900px) {
  #main {
    flex-direction: column;
  }
  #splitter {
    display: none;
  }
  aside#treePane {
    width: 100% !important;
    border-right: 0;
    border-bottom: 1px solid var(--border);
    max-height: 50vh;
    overflow: hidden;
    transition: max-height 200ms ease;
    flex-shrink: 0;
  }
  aside#treePane.collapsed {
    max-height: 40px;
    overflow: hidden;
  }
  aside#treePane.collapsed .tree-body {
    display: none;
  }
  section#rightPane {
    width: 100%;
    min-height: 0;
  }
  .mcell {
    min-height: 76px;
    padding: 4px 6px 6px;
  }
  .mhead {
    padding: 6px 8px;
    font-size: 10px;
  }
  .mchip {
    font-size: 10px;
    padding: 1px 4px 1px 3px;
  }
  .mcell .mnum {
    font-size: 11px;
  }
  #tabJournal.active,
  #tabHabits.active,
  #tabMonth.active,
  #tabDay.active {
    min-height: 400px;
  }
}

/* ============================================================
   Integration fixes
   ============================================================ */

/* renderMonth wraps the seven weekday labels in a .mheader div.
   Without this the wrapper becomes a single grid item and the labels
   stack vertically in column one, shifting the whole month. */
.mheader {
  display: contents;
}

/* Rows without children have no caret, so their content sat flush with their
   parent's and the hierarchy read as flat. Reserve the caret's width. */
.tree-row:not(:has(> .tree-caret)) > .tree-check {
  margin-left: 20px;
}
.tree-row.ancestor-muted {
  opacity: 0.45;
}
.tree-row.ancestor-muted .tree-title {
  font-style: italic;
}
.tree-row.ancestor-muted .tree-check,
.tree-row.ancestor-muted .tree-actions {
  cursor: not-allowed;
}
.tree-row.overdue .tree-title::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: var(--danger);
  margin-right: 4px;
  vertical-align: middle;
}
.tree-row.overdue .tree-datechip {
  color: var(--danger);
}
#treeFooter {
  border-top: 1px solid var(--border);
  padding: 8px 10px;
  font-size: 12px;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
}
#btnRevealAhead {
  font-size: 12px;
  color: var(--text-dim);
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: none;
}
#btnRevealAhead:hover {
  text-decoration: underline;
  color: var(--accent);
}
.overdue-count {
  font-size: 12px;
  color: var(--danger);
  font-weight: 600;
}
.tree-empty {
  padding: 24px 0;
  text-align: center;
  color: var(--text-dim);
  font-size: 14px;
}
.tree-empty-action {
  font-size: 12px;
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
}
.tree-empty-action:hover {
  text-decoration: underline;
}
@keyframes rowFadeIn {
  from {
    opacity: 0;
    transform: translateY(-4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.tree-row.just-arrived {
  animation: rowFadeIn 200ms ease-out;
}
@media (prefers-reduced-motion: reduce) {
  .tree-row.just-arrived {
    animation: none;
  }
}


:root{--bg:#f7f8fa;--surface:#ffffff;--surface-2:#f2f3f5;--border:#e3e5e9;--text:#1a1d21;--text-dim:#6b7280;--accent:#2f6feb;--accent-soft:#e8f0fe;--radius:6px;--warn:#f59e0b;--ok:#10b981;--danger:#ef4444}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--surface:#1d2025;--surface-2:#24272e;--border:#2e323a;--text:#e6e8ec;--text-dim:#9aa1ab;--accent:#4d8bff;--accent-soft:#1e2a3f}}
:root[data-theme="dark"]{--bg:#16181c;--surface:#1d2025;--surface-2:#24272e;--border:#2e323a;--text:#e6e8ec;--text-dim:#9aa1ab;--accent:#4d8bff;--accent-soft:#1e2a3f}
:root[data-theme="light"]{--bg:#f7f8fa;--surface:#ffffff;--surface-2:#f2f3f5;--border:#e3e5e9;--text:#1a1d21;--text-dim:#6b7280;--accent:#2f6feb;--accent-soft:#e8f0fe}
body{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;line-height:1.35;-webkit-font-smoothing:antialiased}
#lblMonth{font-size:20px;font-weight:600;letter-spacing:-0.01em}
#lblMonth,.mcell,.mdaynum,.tree-datechip{font-variant-numeric:tabular-nums}
#topbar{height:48px;padding:0 12px;gap:8px;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:none}
#topbar button{height:28px;padding:0 10px;border-radius:var(--radius);font-size:12px;color:var(--text);background:transparent;border:1px solid transparent;transition:background 120ms}
#topbar button:hover{background:var(--surface-2);border-color:var(--border)}
#syncPill{height:22px;padding:0 8px 0 6px;border-radius:999px;font-size:11px;background:var(--surface-2);color:var(--text-dim);display:inline-flex;align-items:center;gap:6px}
#syncPill::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--text-dim)}
#syncPill[data-state="connecting"]::before,#syncPill[data-state="syncing"]::before{background:var(--warn)}
#syncPill[data-state="synced"]::before{background:var(--ok)}
#syncPill[data-state="error"]::before{background:var(--danger)}


#treeSearch{height:30px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px;width:100%}
#treeSearch:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);outline:none}
#btnAddGoal{background:var(--accent);color:#fff;height:30px;padding:0 12px;border-radius:6px;font-size:12px;font-weight:500;border:none}
#treePane{background:var(--surface)}
.tree-row{min-height:26px;border-radius:4px;margin:1px 6px;gap:6px;border-left:2px solid transparent;transition:background 100ms}
.tree-row:hover{background:var(--surface-2)}
.tree-row:focus-within{border-left-color:var(--accent);background:var(--accent-soft)}
.tree-title{font-size:13px;font-weight:400}
.tree-row.done .tree-title{opacity:.45;text-decoration:line-through}
.tree-actions{opacity:0;transition:opacity 120ms}
.tree-row:hover .tree-actions,.tree-row:focus-within .tree-actions{opacity:1}
.tree-datechip{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--text-dim);border:none}
#treeFooter{font-size:11px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


#tabsBar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 8px;gap:2px}
.tab{height:38px;padding:0 12px;font-size:13px;color:var(--text-dim);background:transparent;border:none;border-bottom:2px solid transparent}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);font-weight:500;border-bottom-color:var(--accent)}
#monthGrid{gap:1px;background:var(--border);padding:1px}
.mhead{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);font-weight:600;padding:8px;background:var(--surface)}
.mcell{background:var(--surface);padding:6px;min-height:104px}
.mcell.other{opacity:0.4}
.mcell.today{background:var(--accent-soft)}
.mcell.today .mdaynum{background:var(--accent);color:#fff;border-radius:999px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.mcell.selected{box-shadow:inset 0 0 0 2px var(--accent)}
.mdaynum{font-size:12px;color:var(--text-dim);font-weight:500}
.mchip,.wchip,.dayitem{display:block;font-size:11px;line-height:1.5;padding:2px 6px;margin-top:2px;border-radius:4px;background:var(--surface-2);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:none;cursor:pointer}
.high{border-left:3px solid var(--accent);padding-left:5px}
.done{opacity:0.45;text-decoration:line-through}
.mmore{font-size:10px;color:var(--text-dim);padding-left:6px;margin-top:2px}
#weekGrid{display:flex;flex-direction:column;height:100%}
.wheader{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px}
.wheader button{height:26px;padding:0 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:12px}
.wbody{display:grid;gap:1px;background:var(--border);flex:1;overflow:auto}
.whead{background:var(--surface);padding:8px 6px;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-dim);cursor:pointer}
.whead.wtoday{color:var(--accent);font-weight:700}
.whead.wselected{box-shadow:inset 0 -2px 0 var(--accent)}
.wlabel{background:var(--surface-2);padding:8px 6px;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em}
.wcell{background:var(--surface);padding:4px;min-height:72px}
.wcell.wdrop{background:var(--accent-soft)}
.wbody>.wlabel:nth-of-type(even),.wbody>.wcell:nth-of-type(even){background:var(--surface-2);opacity:0.5}
#yearGrid{padding:16px}
.yhead{display:flex;align-items:center;justify-content:center;gap:16px;font-size:15px;font-weight:600;margin-bottom:12px}
.ybody{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ycell{height:56px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--text);cursor:pointer}
.ycell:hover{background:var(--surface-2)}
.ycell.ycurrent{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.ycell.ytoday{position:relative}
.ycell.ytoday::after{content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent)}
.daycol{background:var(--surface);border-right:1px solid var(--border)}
.daycol-head{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);padding:8px 10px;border-bottom:1px solid var(--border)}
.quickadd{height:30px;border:none;border-top:1px solid var(--border);padding:0 10px;font-size:12px;background:transparent;width:100%}
#journalView textarea{width:100%;min-height:420px;border:none;background:transparent;font-size:14px;line-height:1.6;resize:none;outline:none;padding:12px}
.habit-cell{width:34px;height:34px;border-radius:6px;border:1px solid var(--border);font-size:10px}
#toast .toast,.modal{box-shadow:0 8px 24px rgba(0,0,0,0.18);border-radius:8px;background:var(--surface);border:1px solid var(--border)}

/* ============================================================
   Integration fixes for the Week tab and layout
   ============================================================ */

/* The panel show/hide rules were written before the Week tab existed, so
   #tabWeek never hid and rendered inside the Day tab. */
#tabWeek { display: none; }
#tabWeek.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }

/* renderWeek wraps each row in a .wrow, which would otherwise become a single
   grid item and collapse the 8-column layout. */
.wrow { display: contents; }
.wcorner { background: var(--surface-2); }

/* Fill the viewport. There is no #app wrapper - body IS the column. */
html { height: 100%; }
body {
  height: 100vh;
  margin: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header#topbar { flex: 0 0 auto; }
main#main { flex: 1 1 auto; min-height: 0; display: flex; }
aside#treePane { overflow-y: auto; }
#rightPane { flex: 1 1 auto; min-height: 0; }
#rightPane .tab-panel.active { flex: 1 1 auto; min-height: 0; }

/* Day columns had no height, collapsing to just a header and an input. */
#dayView { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.daycol { display: flex; flex-direction: column; min-height: 0; }
.daycol-list { flex: 1 1 auto; overflow-y: auto; padding: 4px; min-height: 120px; }
.daycol-count {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-dim);
  background: var(--surface-2);
  border-radius: 999px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.day-header { padding: 8px 12px; border-bottom: 1px solid var(--border); gap: 8px; }
.day-header-date { font-size: 14px; font-weight: 600; }

/* The day-column count badge is built with an inline style using
   var(--accent-fg), which was never defined - the number rendered invisible on
   a solid blue blob. Define the variable and quiet the badge down. */
:root { --accent-fg: #ffffff; }
.daycol-head .daycol-count {
  background: var(--surface-2) !important;
  color: var(--text-dim) !important;
  font-size: 10px;
  font-weight: 600;
  min-width: 18px;
  text-align: center;
}
.daycol-head { display: flex; align-items: center; justify-content: space-between; }
.daycol-list { background: var(--surface); }
.daycol-quick input { height: 30px; font-size: 12px; }

/* "Afternoon" was clipping in the week label column. */
.wbody { grid-template-columns: 88px repeat(7, 1fr) !important; }
.wlabel { font-size: 10px; padding: 8px 6px; letter-spacing: 0.02em; }

/* The month grid left dead space below the last row. */
#tabMonth.active { display: flex; flex-direction: column; }
#monthGrid { flex: 1 1 auto; grid-auto-rows: minmax(88px, 1fr); }
:root {
  --grid-line: rgba(0,0,0,0.11);
  --grid-line-half: rgba(0,0,0,0.05);
  --grid-canvas: #fafbfc;
  --now: #e5484d;
}
@media (prefers-color-scheme: dark) {
  :root {
    --grid-line: rgba(255,255,255,0.10);
    --grid-line-half: rgba(255,255,255,0.045);
    --grid-canvas: #1a1d22;
    --now: #ff6369;
  }
}
:root[data-theme="dark"] {
  --grid-line: rgba(255,255,255,0.10);
  --grid-line-half: rgba(255,255,255,0.045);
  --grid-canvas: #1a1d22;
  --now: #ff6369;
}
:root[data-theme="light"] {
  --grid-line: rgba(0,0,0,0.11);
  --grid-line-half: rgba(0,0,0,0.05);
  --grid-canvas: #fafbfc;
  --now: #e5484d;
}

#dayView,
#weekGrid {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-height: 0;
}

.tgtop {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  background: var(--surface);
}
.tgtop button {
  height: 26px;
  padding: 0 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 12px;
}
.tgtop .tgspacer {
  flex-grow: 1;
}
.tgexpand {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-dim);
}
.tgweekhead {
  display: grid;
  grid-template-columns: 56px repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.tgdayhead {
  padding: 8px 4px;
  text-align: center;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-dim);
  cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.tgdayhead.tgtoday {
  color: var(--accent);
  font-weight: 700;
}
.tgdayhead.tgsel {
  box-shadow: inset 0 -2px 0 var(--accent);
}
.tgallday {
  display: grid;
  grid-template-columns: 56px repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
  min-height: 30px;
  background: var(--surface);
}
#dayView .tgallday {
  grid-template-columns: 56px 1fr;
}
.tggutterlabel {
  font-size: 10px;
  color: var(--text-dim);
  text-align: right;
  padding: 6px 12px 0 0;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.tgalldaycell {
  padding: 4px;
  border-left: 1px solid var(--border);
  min-height: 30px;
}
.tgchip {
  display: block;
  font-size: 11px;
  padding: 2px 6px;
  margin-bottom: 2px;
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tgscroll {
  flex: 1 1 auto;
  overflow-y: auto;
  background: var(--grid-canvas);
  position: relative;
}
.tgbody {
  position: relative;
  width: 100%;
}
.tggutter {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 56px;
  pointer-events: none;
  z-index: 2;
}
.tghour-label {
  position: absolute;
  right: 12px;
  transform: translateY(-50%);
  font-size: 11px;
  line-height: 1;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.tglines {
  position: absolute;
  left: 56px;
  right: 0;
  top: 0;
  bottom: 0;
  pointer-events: none;
  z-index: 0;
}
.tghour-line {
  position: absolute;
  left: 0;
  right: 0;
  height: 0;
  border-top: 1px solid var(--grid-line);
}
.tghalf-line {
  position: absolute;
  left: 0;
  right: 0;
  height: 0;
  border-top: 1px solid var(--grid-line-half);
}
.tgcols {
  position: absolute;
  left: 56px;
  right: 0;
  top: 0;
  bottom: 0;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  z-index: 1;
}
.tgcol {
  position: relative;
  border-left: 1px solid var(--border);
}
#dayView .tgcol {
  position: absolute;
  left: 56px;
  right: 0;
  top: 0;
  bottom: 0;
}
.tgevent {
  position: absolute;
  box-sizing: border-box;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  color: var(--text);
  font-size: 11px;
  line-height: 1.25;
  overflow: hidden;
  cursor: pointer;
  margin-right: 2px;
}
.tgevent.high {
  border-left-width: 3px;
}
.tgevent.done {
  opacity: 0.5;
  text-decoration: line-through;
}
.tgevent-time {
  font-size: 10px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.tgevent-title {
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tgnow {
  position: absolute;
  left: 0;
  right: 0;
  height: 0;
  border-top: 2px solid var(--now);
  z-index: 3;
  pointer-events: none;
}
.tgnow-dot {
  position: absolute;
  left: -4px;
  top: -4px;
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: var(--now);
}
.tgcol.tgdrop {
  background: var(--accent-soft);
}

/* A 30-minute event is only 20px tall, so stacking the time above the title
   clipped the title entirely. One line, time first. */
.tgevent {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 1px 6px;
}
.tgevent-time { flex: 0 0 auto; }
.tgevent-title { flex: 1 1 auto; min-width: 0; }

/* The first hour label was clipped against the top of the scroll area. */
.tgbody { padding-top: 10px; }
.tggutter, .tglines, .tgcols { top: 10px; }

/* Current-time indicator removed at the user's request. */
.tgnow, .tgnow-dot { display: none !important; }
.area-dot { width:8px; height:8px; border-radius:999px; flex:0 0 auto;
  margin-right:2px; }
.tag-chip { font-size:10px; padding:0 5px; border-radius:999px;
  background:var(--surface-2); color:var(--text-dim); margin-left:4px;
  white-space:nowrap; }
#treeFilters { display:flex; flex-wrap:wrap; gap:4px; padding:6px 8px;
  border-bottom:1px solid var(--border); }
#treeFilters button { font-size:11px; height:22px; padding:0 8px;
  border-radius:999px; border:1px solid var(--border);
  background:var(--surface); color:var(--text-dim); display:inline-flex;
  align-items:center; gap:5px; cursor:pointer; }
#treeFilters button:hover { background:var(--surface-2); }
#treeFilters button.on { border-color:var(--accent); color:var(--text);
  background:var(--accent-soft); }
#treeFilters button .fdot { width:8px; height:8px; border-radius:999px;
  flex:0 0 auto; }
#btnClearFilters { color:var(--accent); }
.ctxmenu { position:absolute; z-index:60; background:var(--surface);
  border:1px solid var(--border); border-radius:6px; padding:4px;
  box-shadow:0 8px 24px rgba(0,0,0,0.18); min-width:140px; }
.ctxmenu button { display:block; width:100%; text-align:left; font-size:12px;
  padding:6px 10px; border-radius:4px; background:none; border:none;
  color:var(--text); cursor:pointer; }
.ctxmenu button:hover { background:var(--surface-2); }

.area-picker { display: flex; flex-direction: column; gap: 2px; }
.area-picker button {
  display: flex; align-items: center; gap: 8px; width: 100%;
  text-align: left; height: 30px; padding: 0 8px; border-radius: 4px;
  background: none; border: none; color: var(--text); font-size: 13px;
  cursor: pointer;
}
.area-picker button:hover { background: var(--surface-2); }
.area-picker .pdot { width: 10px; height: 10px; border-radius: 999px; flex: 0 0 auto; }


/* Time chip on tree rows, beside the date chip. */
.tree-timechip {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--text-dim);
  border: none;
  cursor: pointer;
  margin-left: 4px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.tree-timechip:hover { color: var(--text); }
.tree-row input[type="time"] {
  font-size: 11px; height: 22px; border: 1px solid var(--border);
  border-radius: 4px; background: var(--surface); color: var(--text);
  padding: 0 4px; margin-left: 4px;
}

/* Dragging an event on the time grid. */
.tgevent.tgdragging {
  box-shadow: 0 6px 16px rgba(0,0,0,0.25);
  z-index: 20;
  cursor: grabbing;
}
.tgevent { cursor: grab; touch-action: none; user-select: none; }

/* Delete confirmation dialog. */
.del-count { font-size: 12px; color: var(--text-dim); margin: 8px 0 4px; }
.del-list {
  max-height: 200px; overflow-y: auto; border: 1px solid var(--border);
  border-radius: 6px; padding: 6px; background: var(--surface-2);
  font-size: 12px;
}
.del-item { padding: 2px 0; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.del-warn { font-size: 12px; color: var(--danger); margin-top: 10px; }
.modal button.danger, .modal .danger {
  background: var(--danger); color: #fff; border: none;
}

/* ============================================================
   Modal chrome had NO styling at all - the footer buttons were
   invisible, so dialogs looked like they had no actions.
   ============================================================ */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 20px;
}
.modal {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.32);
  width: 100%; max-width: 460px; max-height: 85vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border);
}
.modal-header h2 { font-size: 15px; font-weight: 600; margin: 0; }
.modal-close {
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; padding: 4px; border-radius: 4px; line-height: 0;
}
.modal-close:hover { background: var(--surface-2); color: var(--text); }
.modal-body { padding: 16px; overflow-y: auto; font-size: 13px; }
.modal-body p { margin: 0 0 8px; }
.modal-footer {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 12px 16px; border-top: 1px solid var(--border);
  background: var(--surface-2);
}
.modal-btn {
  height: 32px; padding: 0 14px; border-radius: 6px; font-size: 13px;
  font-weight: 500; cursor: pointer; border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
}
.modal-btn:hover { background: var(--surface-2); }
.modal-btn-primary {
  background: var(--accent); border-color: var(--accent); color: #fff;
}
.modal-btn-primary:hover { filter: brightness(1.08); }
.modal-btn-danger {
  background: var(--danger); border-color: var(--danger); color: #fff;
}
.modal-btn-danger:hover { filter: brightness(1.08); }
.tree-dateinput {
  font-size: 11px; height: 22px; border: 1px solid var(--border);
  border-radius: 4px; background: var(--surface); color: var(--text);
  padding: 0 4px;
}

/* An empty title shows a faded placeholder instead of the app writing the
   literal word "Untitled" into your data. */
.tree-title:empty::before {
  content: 'New task';
  color: var(--text-dim);
  opacity: 0.6;
  pointer-events: none;
}
.tree-dateclear {
  border: none; background: none; color: var(--text-dim);
  font-size: 13px; line-height: 1; cursor: pointer; padding: 0 3px;
  border-radius: 4px; margin-left: 1px;
}
.tree-dateclear:hover { color: var(--danger); background: var(--surface-2); }
.tree-outdent, .tree-indent { font-size: 12px; line-height: 1; }
.tree-outdent:disabled, .tree-indent:disabled { opacity: 0.25; cursor: default; }
.btn-today-inline {
  height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); cursor: pointer; margin-left: 8px;
}
.btn-today-inline:hover { background: var(--surface-2); }
#tabMonth > .btn-today-inline { align-self: flex-start; margin: 8px 0 0 12px; }
#lblMonth:hover { color: var(--accent); }

/* Build stamp so a stale tab is instantly obvious. */
#buildStamp {
  font-size: 10px; color: var(--text-dim); opacity: 0.75;
  margin-left: 8px; font-variant-numeric: tabular-nums; white-space: nowrap;
}

/* All-day chips are draggable onto the time grid and between days. */
.tgchip { cursor: grab; user-select: none; touch-action: none; }
.tgchip.tgdragging { opacity: 0.75; cursor: grabbing; }
.tgalldaycell.tgdrop { background: var(--accent-soft); }

/* The All-day strip was a 30px band that was easy to miss entirely - users
   moved a task there and concluded it had vanished. Make it unmissable. */
.tgallday { min-height: 46px; background: var(--surface-2); }
.tgalldaycell { min-height: 46px; padding: 5px; }
.tgallday .tggutterlabel {
  font-weight: 600; color: var(--text); opacity: 0.75; padding-top: 8px;
}
.tgalldaycell .tgchip {
  background: var(--accent-soft);
  border-left: 3px solid var(--accent);
  padding: 3px 6px;
  font-size: 11px;
}
.tgalldaycell:empty::after,
.tgalldaycell:not(:has(.tgchip))::after {
  content: '';
  display: block;
  height: 100%;
}

/* Diagnose button + the "moved off-screen" toast with a Jump action. */
#btnDiagnose { font-size: 11px; opacity: 0.7; }
#btnDiagnose:hover { opacity: 1; }
.toast-jump {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--accent); border-left: 3px solid var(--accent);
  padding: 8px 12px; border-radius: 8px; font-size: 12px;
}
.toast-jump button {
  background: var(--accent); color: #fff; border: none;
  border-radius: 5px; height: 24px; padding: 0 10px;
  font-size: 12px; cursor: pointer;
}

/* Loud indicator when Day/Week is parked on a date that is not today. */
.not-today {
  margin-left: auto;
  background: var(--warn, #ca8a04);
  color: #fff;
  border: none;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.not-today:hover { filter: brightness(1.1); }

/* Month view parked on the wrong month - same loud treatment as Day/Week. */
.not-this-month {
  margin: 8px 12px 0;
  align-self: flex-start;
  display: inline-block;
}
.mchip { cursor: grab; user-select: none; touch-action: none; }
.mchip.tgdragging { opacity: 0.75; cursor: grabbing; }

/* Inline date picker for tree rows - the bare native input showed no calendar. */
.datepop {
  z-index: 200; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,0.24);
  padding: 8px; width: 232px; font-size: 12px;
}
.datepop-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px; font-weight: 600;
}
.datepop-head button {
  background: none; border: 1px solid var(--border); border-radius: 5px;
  width: 24px; height: 24px; cursor: pointer; color: var(--text);
}
.datepop-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.datepop-dow {
  text-align: center; font-size: 10px; color: var(--text-dim);
  text-transform: uppercase; padding-bottom: 2px;
}
.datepop-day {
  height: 28px; border: none; background: none; border-radius: 5px;
  cursor: pointer; color: var(--text); font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.datepop-day:hover { background: var(--surface-2); }
.datepop-day.today { color: var(--accent); font-weight: 700; }
.datepop-day.sel { background: var(--accent); color: #fff; }
.datepop-foot {
  display: flex; justify-content: space-between; gap: 6px;
  margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px;
}
.datepop-foot button {
  flex: 1; height: 26px; border: 1px solid var(--border); border-radius: 5px;
  background: var(--surface); color: var(--text); font-size: 12px; cursor: pointer;
}
.datepop-foot button:hover { background: var(--surface-2); }

/* Flash a tree row when revealed from the calendar. */
.tree-row.tree-flash {
  animation: treeFlash 1.6s ease-out;
  background: var(--accent-soft);
}
@keyframes treeFlash {
  0%   { background: var(--accent); }
  100% { background: transparent; }
}
@media (prefers-reduced-motion: reduce) {
  .tree-row.tree-flash { animation: none; }
}

/* Top bar: the month label and year button are gone; the Today button is the
   single date control. */
#lblMonth, #btnYearJump { display: none !important; }
#btnToday {
  font-weight: 500;
  border: 1px solid var(--border) !important;
  font-variant-numeric: tabular-nums;
}
#btnToday:hover { background: var(--surface-2) !important; }
.todaypop { width: 244px; }

/* A task whose day has just arrived, back in its original place in the tree. */
.tree-row.just-arrived {
  box-shadow: inset 2px 0 0 var(--ok, #16a34a);
  background: color-mix(in srgb, var(--ok, #16a34a) 8%, transparent);
}
.tree-row.just-arrived .tree-title::after {
  content: 'due today';
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--ok, #16a34a);
  margin-left: 8px;
  font-weight: 700;
  vertical-align: middle;
}

/* Calendar item action menu */
.actbtn {
  position: absolute; top: 1px; right: 1px; width: 16px; height: 16px;
  line-height: 14px; padding: 0; border: none; border-radius: 4px;
  background: var(--accent); color: #fff; font-size: 12px; cursor: pointer;
  opacity: 0; transition: opacity 120ms;
}
/* .tgevent was in this list and it broke the calendar: the rule exists so the actbtn
   can anchor inside a chip, but .tgevent is already position:absolute, and absolute is
   itself a containing block for actbtn. Forcing it back to relative made top: Npx an
   OFFSET FROM FLOW instead of a position, so every event after the first in a column
   drifted down by the height of the ones above it - one event per column looked fine,
   which is exactly why it hid for so long. */
.tgchip, .mchip { position: relative; }
.tgevent:hover .actbtn, .tgchip:hover .actbtn, .mchip:hover .actbtn { opacity: 1; }
.actmenu {
  z-index: 300; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,0.35);
  padding: 6px; min-width: 190px;
}
.actmenu-item {
  display: block; width: 100%; text-align: left; background: none; border: none;
  color: var(--text); font-size: 13px; padding: 8px 12px; border-radius: 6px;
  cursor: pointer;
}
.actmenu-item:hover { background: var(--surface-2); }
.actmenu-item.accent { color: var(--accent); font-weight: 600; }
.actmenu-item.danger { color: var(--danger); }
.actmenu-sep { height: 1px; background: var(--border); margin: 6px 8px; }

/* Edit Activity dialog */
.ea { display: flex; flex-direction: column; gap: 10px; }
.ea-title {
  width: 100%; height: 40px; padding: 0 12px; font-size: 15px;
  border: 1px solid var(--accent); border-radius: 8px;
  background: var(--surface-2); color: var(--text);
}
.ea-note {
  width: 100%; padding: 10px 12px; font-size: 13px; resize: vertical;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface-2); color: var(--text);
}
.ea-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--surface-2); border-radius: 8px; padding: 8px 12px;
}
.ea-label { font-size: 13px; color: var(--text-dim); }
.ea-input {
  background: transparent; border: none; color: var(--text); font-size: 13px;
  text-align: right; min-width: 120px; outline: none;
}
.ea-input:focus { color: var(--accent); }
.ea-sectionhead {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-dim); margin: 6px 0 4px; border-top: 1px solid var(--border);
  padding-top: 10px;
}
.ea-subs { display: flex; flex-direction: column; gap: 6px; }
.ea-sublist { display: flex; flex-direction: column; gap: 4px; }
.ea-subitem {
  font-size: 13px; padding: 6px 12px; background: var(--surface-2);
  border-radius: 6px; color: var(--text);
}

/* Tag picker: choose from what already exists instead of typing */
.tagpick { display: flex; flex-direction: column; gap: 6px; }
.tagpick-list {
  display: flex; flex-wrap: wrap; gap: 6px; max-height: 132px; overflow-y: auto;
  background: var(--surface-2); border-radius: 8px; padding: 8px;
}
.tagpick-row {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 4px 10px; cursor: pointer; color: var(--text);
}
.tagpick-row input { accent-color: var(--accent); margin: 0; }
.tagpick-new { text-align: left !important; padding: 8px 12px;
  background: var(--surface-2) !important; border-radius: 8px; }
.datepop-inline { width: 100%; box-shadow: none; border: none; padding: 0; }

/* Tree view switcher: Active / Completed / Deleted */
#treeViews {
  display: flex; gap: 4px; padding: 6px 8px;
  border-bottom: 1px solid var(--border);
}
.treeview-btn {
  flex: 1; height: 26px; border-radius: 6px; font-size: 12px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-dim); cursor: pointer;
}
.treeview-btn:hover { background: var(--surface-2); color: var(--text); }
.treeview-btn.on {
  border-color: var(--accent); background: var(--accent-soft); color: var(--text);
  font-weight: 600;
}
.trashlist { display: flex; flex-direction: column; gap: 6px; padding: 8px; }
.trashitem {
  display: flex; align-items: center; gap: 8px; font-size: 12px;
  background: var(--surface-2); border-radius: 6px; padding: 8px 10px;
}
.trashitem .t-title { flex: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.trashitem .t-when { font-size: 10px; color: var(--text-dim); }
.trashitem button {
  height: 22px; padding: 0 8px; border-radius: 5px; font-size: 11px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); cursor: pointer;
}
.trashitem button.danger { color: var(--danger); border-color: var(--danger); }
.trash-empty { padding: 20px; text-align: center; color: var(--text-dim); font-size: 12px; }

/* three-dot menu on every tree row */
.rowmenu { font-size: 13px; line-height: 1; }

/* where a task sits in the priority tree, shown in the Edit dialog */
.ea-breadcrumb {
  font-size: 11px; color: var(--text-dim); background: var(--surface-2);
  border-left: 3px solid var(--accent); border-radius: 6px; padding: 6px 10px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#buildStamp { display: none !important; }

/* Uniform row height regardless of date, badges or arrival state. */
#treeRoot .tree-row {
  min-height: 30px !important;
  height: 30px;
  align-items: center;
  box-sizing: border-box;
}
#treeRoot .tree-row.just-arrived .tree-title::after {
  position: static;
  font-size: 9px;
  line-height: 1;
}
#treeRoot .tree-row .tree-title,
#treeRoot .tree-row .tree-datechip,
#treeRoot .tree-row .tree-timechip,
#treeRoot .tree-row .tag-chip { line-height: 18px; }

/* The ⋮ menu is always available on every row, at any depth. */
#treeRoot .tree-row .tree-actions { opacity: 1; display: inline-flex; }
#treeRoot .tree-row .rowmenu { opacity: 0.55; }
#treeRoot .tree-row:hover .rowmenu { opacity: 1; }
#treeRoot .tree-row .tree-actions button:not(.rowmenu) { opacity: 0; transition: opacity 120ms; }
#treeRoot .tree-row:hover .tree-actions button:not(.rowmenu) { opacity: 1; }

/* Tags on a row are removable. */
.tag-chip { cursor: pointer; }
.tag-chip:hover { color: var(--danger); text-decoration: line-through; }

/* ============================================================
   Tree row: one fixed layout for every state.
   Order is forced with flex `order`, so DOM insertion order by various
   modules cannot change the visual arrangement.
   ============================================================ */
#treeRoot .tree-row {
  /* NOT !important: an inline display:none from the hide filters must win.
     Forcing flex here made every hidden row visible again. */
  display: flex;
  align-items: center;
  height: 30px !important;
  min-height: 30px !important;
  max-height: 30px !important;
  overflow: hidden;
  white-space: nowrap;
  gap: 6px;
  box-sizing: border-box;
}
#treeRoot .tree-row > .tree-caret { order: 0; flex: 0 0 16px; }
#treeRoot .tree-row > .area-dot   { order: 0; flex: 0 0 8px; }
#treeRoot .tree-row > .tree-check { order: 1; flex: 0 0 auto; margin: 0; }
#treeRoot .tree-row > .tree-title {
  order: 2; flex: 1 1 auto; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#treeRoot .tree-row > .tag-chip        { order: 3; flex: 0 0 auto; }
#treeRoot .tree-row > .tree-datechip   { order: 4; flex: 0 0 auto; margin-left: auto; }
#treeRoot .tree-row > .tree-dateclear  { order: 5; flex: 0 0 auto; }
#treeRoot .tree-row > .tree-timechip   { order: 6; flex: 0 0 auto; }
#treeRoot .tree-row > .tree-actions    { order: 7; flex: 0 0 auto; }
#treeRoot .tree-row > input[type="date"],
#treeRoot .tree-row > input[type="time"] { order: 4; flex: 0 0 auto; margin-left: auto; }

/* Secondary controls live in the hamburger drawer, not above the tree. */
#treeDrawer {
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  padding: 4px 0;
}
#treeDrawer #treeViews,
#treeDrawer #treeFilters { border-bottom: none; }

/* ============================================================
   Right-align the date properly.
   `margin-left:auto` on the chip was inert because .tree-title was
   `flex: 1 1 auto` and absorbed every pixel of free space. The title must not
   grow; the auto margin then pushes the date group to the right edge.
   ============================================================ */
#treeRoot .tree-row > .tree-title {
  flex: 0 1 auto !important;
  max-width: 60%;
}
#treeRoot .tree-row > .tree-datechip { margin-left: auto !important; }

/* Only the ⋮ stays in the row. The other actions live in its menu, so they no
   longer reserve ~96px of invisible width and strand the date mid-row. */
#treeRoot .tree-row .tree-actions button:not(.rowmenu):not(.rowquick):not(.tree-datechip) {
  display: none !important;
}
#treeRoot .tree-row .tree-actions {
  gap: 0;
  padding: 0;
  margin: 0;
}

/* ============================================================
   Typography is fixed. Nothing about a task's state may change the font used
   for chrome, headers or rows - only an explicit per-task style may.
   ============================================================ */
#dayView, #weekGrid, #monthGrid, #treeRoot, #treePane,
#dayView *, #weekGrid *, #monthGrid *, #treeRoot * {
  font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
}
#dayView .tgtop, #weekGrid .tgtop { font-size: 13px; min-height: 42px; }
#dayView .tgtop .tgtitle, #weekGrid .tgtop span { font-size: 14px; font-weight: 600; }
.tgdayhead { font-size: 11px !important; height: 34px; display: flex;
  flex-direction: column; align-items: center; justify-content: center; }
.tghour-label { font-size: 11px !important; }
.tgevent, .tgchip { font-size: 11px; }
.mchip { font-size: 11px; }
.mdaynum { font-size: 12px; }
.mhead { font-size: 11px; height: 30px; display: flex; align-items: center;
  justify-content: center; }
#treeRoot .tree-row .tree-title { font-size: 13px; }
#treeRoot .tree-row .tree-datechip,
#treeRoot .tree-row .tree-timechip,
#treeRoot .tree-row .tag-chip { font-size: 11px; }
/* the all-day strip must not resize as items come and go */
.tgallday { min-height: 46px; max-height: 46px; overflow: hidden; }
.tgalldaycell { min-height: 46px; max-height: 46px; overflow-y: auto; }

/* Edit dialog: style controls */
.ea-style { display: flex; align-items: center; gap: 6px; }
.ea-styletoggle {
  width: 28px; height: 26px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-size: 13px;
}
.ea-styletoggle.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.ea-check { width: 18px; height: 18px; accent-color: var(--accent); }

/* ============================================================
   Fixed-width date column so rows line up whatever the date says.
   ============================================================ */
#treeRoot .tree-row > .tree-datechip {
  min-width: 78px;
  text-align: center;
  justify-content: center;
}
#treeRoot .tree-row > .tree-timechip { min-width: 60px; text-align: center; }
/* the "due today" badge must not push anything sideways */
#treeRoot .tree-row.just-arrived .tree-title::after {
  position: absolute;
  right: 96px;
  pointer-events: none;
}
#treeRoot .tree-row { position: relative; }

/* Relative day as a fixed-width badge, so the date text always starts at the
   same x whether it is Today, Tomorrow or a plain date. */
.relbadge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 74px; height: 22px; margin-right: 8px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent);
  font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
}
#dayView .tgtop, #weekGrid .tgtop { min-height: 42px; max-height: 42px; }

/* Drag the bottom edge of an event to change its duration. */
.tgresize {
  position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
  cursor: ns-resize; background: transparent;
}
.tgevent:hover .tgresize { background: var(--accent); opacity: 0.5; }
.tgevent.tgresizing { outline: 2px solid var(--accent); z-index: 30; }

/* Inline quick buttons, revealed on hover, left of the ⋮ */
#treeRoot .tree-row .rowquick {
  opacity: 0; transition: opacity 120ms; font-size: 12px; line-height: 1;
  display: inline-flex !important;
}
#treeRoot .tree-row:hover .rowquick,
#treeRoot .tree-row:focus-within .rowquick { opacity: 0.85; }
#treeRoot .tree-row .rowquick:hover { opacity: 1; color: var(--accent); }

/* One date control per row; time is set inside its calendar. */
#treeRoot .tree-row > .tree-timechip,
#treeRoot .tree-row > .tree-dateclear { display: none !important; }
#treeRoot .tree-row > .tree-datechip { min-width: 96px; }

.datepop-time {
  display: flex; align-items: center; gap: 8px;
  border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px;
  font-size: 12px; color: var(--text-dim);
}
.datepop-timeinput {
  flex: 1; height: 26px; border: 1px solid var(--border); border-radius: 5px;
  background: var(--surface); color: var(--text); font-size: 12px; padding: 0 6px;
}
.datepop-timeclear {
  height: 26px; padding: 0 8px; border-radius: 5px; font-size: 11px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-dim); cursor: pointer;
}
.ahead-state { font-size: 11px; }
.ahead-state.on  { color: var(--text-dim); }
.ahead-state.off { color: var(--warn, #ca8a04); font-weight: 600; }

/* quick buttons: laid out always, revealed on hover */
#treeRoot .tree-row .rowquick {
  display: inline-flex !important;
  visibility: hidden;
  opacity: 1;
  width: 20px; height: 20px; padding: 0;
  align-items: center; justify-content: center;
}
#treeRoot .tree-row:hover .rowquick,
#treeRoot .tree-row:focus-within .rowquick { visibility: visible; }
.drawer-hidden {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; font-size: 12px; color: var(--text);
  border-top: 1px solid var(--border); cursor: pointer;
}
.drawer-hidden-cb { accent-color: var(--accent); }
.tree-row[data-revealed] { opacity: 0.75; }
.tree-row[data-revealed] .tree-title::before {
  content: '◦ '; color: var(--warn, #ca8a04);
}

/* ============================================================
   Row tail: title ....... [←] [→] [+] [clock] [⋮]
   Everything except the ⋮ appears on hover only.
   ============================================================ */
#treeRoot .tree-row > .tree-actions {
  order: 8;
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 2px;
}
#treeRoot .tree-row > .tree-title { flex: 1 1 auto !important; max-width: none; }
#treeRoot .tree-row .tree-actions .tree-datechip {
  order: 1;
  min-width: 0;
  width: 22px; height: 22px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border-radius: 5px;
  font-size: 13px; line-height: 1;
  color: var(--text-dim);
  visibility: hidden;
}
#treeRoot .tree-row .tree-actions .tree-datechip.hasdate {
  visibility: visible;
  color: var(--accent);
}
#treeRoot .tree-row:hover .tree-actions .tree-datechip,
#treeRoot .tree-row:focus-within .tree-actions .tree-datechip { visibility: visible; }
#treeRoot .tree-row .tree-actions .tree-datechip:hover { background: var(--surface-2); color: var(--text); }
#treeRoot .tree-row .rowmenu { order: 2; }
#treeRoot .tree-row .rowquick { order: 0; }

/* The "due today" text badge crowded the row and collided with the tail.
   Keep the green edge marker, drop the words. */
#treeRoot .tree-row.just-arrived .tree-title::after { content: none !important; }

/* A confirmation chain must not move its buttons between steps: fix the box
   size and always reserve the scrollbar so nothing shifts. */
.modal:has(.del-list), .modal:has(.del-warn) {
  width: 460px !important;
  max-width: 460px !important;
  height: 380px !important;
  min-height: 380px !important;
}
.modal:has(.del-list) .modal-body, .modal:has(.del-warn) .modal-body {
  flex: 1 1 auto;
  overflow-y: scroll;
}

/* The clock is half the size of the row text. */
#treeRoot .tree-row .tree-actions .tree-datechip svg {
  width: 11px !important;
  height: 11px !important;
}

/* Buttons in a dialog footer are one width, so a confirmation chain never
   shifts the pointer target between steps. */
.modal-footer .modal-btn { min-width: 112px; text-align: center; }

/* ============================================================
   Indentation alignment.
   A row with children renders a caret; a leaf does not. Without a reserved
   slot the leaf shifts left by the caret's width and its depth reads wrong -
   which is why adding a subtask "looked like it did not indent".
   ============================================================ */
#treeRoot .tree-row:not(:has(> .tree-caret)) > .tree-check {
  margin-left: 22px;
}
#treeRoot .tree-row > .tree-caret {
  width: 16px; min-width: 16px; flex: 0 0 16px;
  display: inline-flex; align-items: center; justify-content: center;
}

/* Draggable divider between the tree and the calendar. */
#splitter {
  flex: 0 0 5px; width: 5px; cursor: col-resize;
  background: var(--border); transition: background 120ms;
}
#splitter:hover, #splitter.splitting { background: var(--accent); }

  
/* ---------- iPhone standalone: keep UI out from under the status bar ----------
   apple-mobile-web-app-status-bar-style: black-translucent extends the page
   under the clock and battery, and under the home indicator at the bottom.
   Without these, the top bar sits behind the status bar on every notched
   iPhone. env() resolves to 0 everywhere else, so this is inert on desktop. */
header#topbar {
  padding-top: calc(var(--s2) + env(safe-area-inset-top, 0px));
  padding-left: calc(var(--s4) + env(safe-area-inset-left, 0px));
  padding-right: calc(var(--s4) + env(safe-area-inset-right, 0px));
}
main#main {
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* ---------- phone: top bar must not cut its own buttons off ----------
   Measured at 390px: the top bar was fixed at 48px with nowrap, so the next-date
   arrow landed at y=51 - outside the bar, unreachable. Let it wrap instead;
   nothing is hidden and nothing is clipped. */
@media (max-width: 700px) {
  /* One row that scrolls sideways, rather than three stacked rows eating 14% of
     a phone screen. Every button stays reachable and the bar stays ~52px. */
  header#topbar {
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  header#topbar::-webkit-scrollbar { display: none; }
  header#topbar > * { flex: 0 0 auto; }
  header#topbar .topbar-spacer { flex: 1 0 8px; }
  header#topbar .month-label { display: none; }
}

/* ---------- touch: real tap targets ----------
   Driven by WIDTH, not by (pointer: coarse). The pointer feature is correct in
   principle but cannot be emulated in the headless harness, so it could not be
   verified - and an unverifiable rule is not worth shipping alone. Width is
   testable and a <=700px window is a phone in every case that matters here.
   The pointer block below still catches tablets in landscape. */
@media (max-width: 700px) {
  header#topbar button {
    min-width: 44px;
    min-height: 44px;
  }
  .tree-row .tree-caret,
  .tree-row .rowmenu,
  .tree-row .tree-actions button {
    min-width: 34px;
    min-height: 30px;
  }
  .tree-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
  }
}
@media (pointer: coarse) {
  header#topbar button {
    min-width: 44px;
    min-height: 44px;
  }
  .tree-row .tree-caret,
  .tree-row .rowmenu,
  .tree-row .tree-actions button {
    min-width: 34px;
    min-height: 30px;
  }
  .tree-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
  }
}

/* ---------- the date button never changes width ----------
   Measured before this rule: 94px on "Sep 1, 2026" and 142px on
   "Today - Aug 14, 2026". A 48px swing meant the button moved out from under
   the pointer whenever the date changed. One width, always. The caret is a
   pseudo-element so the label text cannot push it around. */
header#topbar button#btnToday {
  width: 142px;
  min-width: 142px;
  max-width: 142px;
  justify-content: space-between;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  overflow: hidden;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
header#topbar button#btnToday::after {
  content: "\25be";
  flex: 0 0 auto;
  opacity: .6;
}
@media (max-width: 700px) {
  header#topbar button#btnToday { width: 142px; min-width: 142px; }
}

/* ---------- the note box: lines above, its own toolbar along the bottom ---- */
.note-box {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-2, var(--surface));
  overflow: hidden;
  width: 100%;
}
.note-lines { display: flex; flex-direction: column; padding: 6px 0; }
input.note-line {
  border: 0; background: transparent; color: var(--text);
  padding: 3px 10px; outline: none; width: 100%;
  font-family: inherit; line-height: 1.35;
}
input.note-line:focus { background: rgba(127,127,127,.10); }
.note-bar {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 8px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
button.note-btn {
  min-width: 26px; height: 24px; border-radius: 5px; cursor: pointer;
  font-size: 12px; font-weight: 700; line-height: 1;
}
button.note-btn.note-ital { font-style: italic; font-weight: 500; }
button.note-btn.on { background: var(--accent); color: #fff; }
select.note-size { font-size: 11px; height: 24px; border-radius: 5px; }
.note-which { font-size: 10px; opacity: .55; margin-left: auto; }
@media (max-width: 700px) {
  button.note-btn { min-width: 40px; height: 36px; }
  select.note-size { height: 36px; }
}

/* ---------- alarms: one row each, stacked under the label ---------- */
.al-wrap { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.al-head { display: flex; align-items: center; gap: 8px; font-size: 11px; opacity: .75; }
button.al-plus {
