(function () {
  var drag = null;

  function columnAt(x, y) {
    var cols = document.querySelectorAll('.tgcol');
    var best = null;
    for (var i = 0; i < cols.length; i++) {
      var r = cols[i].getBoundingClientRect();
      if (r.width === 0) continue;
      if (x >= r.left && x <= r.right) { return cols[i]; }
      var dist = x < r.left ? r.left - x : x - r.right;
      if (!best || dist < best.dist) best = {el: cols[i], dist: dist};
    }
    return best ? best.el : null;
  }

  document.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    var ev = e.target.closest ? e.target.closest('.tgevent') : null;
    if (!ev) return;
    var id = ev.dataset.nodeId;
    if (!id) return;
    var startCol = ev.closest('.tgcol');
    drag = { el: ev, id: id, startX: e.clientX, startY: e.clientY,
             grabOffset: e.clientY - ev.getBoundingClientRect().top,
             col: startCol, moved: false };
    try { ev.setPointerCapture(e.pointerId); } catch (err) {}
  });

  document.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (!drag.moved) {
      var dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
      if (dx * dx + dy * dy <= 16) return;
      drag.moved = true;
      drag.el.classList.add('tgdragging');
      drag.el.style.opacity = '0.75';
    }
    e.preventDefault();
    var col = columnAt(e.clientX, e.clientY) || drag.col;
    if (!col) return;
    if (col !== drag.el.parentElement) {
      col.appendChild(drag.el);
    }
    var rect = col.getBoundingClientRect();
    var top = e.clientY - rect.top - drag.grabOffset;
    var snapPx = (window.TG.HOUR_PX / 60) * window.TG.SNAP_MIN;
    top = Math.round(top / snapPx) * snapPx;
    if (top < 0) top = 0;
    drag.el.style.top = top + 'px';
  });

  function finish(e) {
    if (!drag) return;
    var d = drag; drag = null;
    d.el.classList.remove('tgdragging');
    d.el.style.opacity = '';
    try { d.el.releasePointerCapture(e.pointerId); } catch (err) {}
    if (!d.moved) return;
    var adCells = document.querySelectorAll('.tgalldaycell');
    for (var ai = 0; ai < adCells.length; ai++) {
      var ar = adCells[ai].getBoundingClientRect();
      if (ar.width && e.clientX >= ar.left && e.clientX <= ar.right &&
          e.clientY >= ar.top && e.clientY <= ar.bottom) return;
    }
    var col = columnAt(e.clientX, e.clientY) || d.el.closest('.tgcol') || d.col;
    if (!col) return;
    var rect = col.getBoundingClientRect();
    var newTime = window.tgFromY(e.clientY - rect.top - d.grabOffset);
    var found = window.findNode(d.id);
    if (!found || !found.node) return;
    found.node.date = col.dataset.iso;
    found.node.time = newTime;
    window.Store.save();
    window.__suppressClick = true;
    setTimeout(function () { window.__suppressClick = false; }, 400);
    window.renderAll();
  }

  document.addEventListener('pointerup', finish);
  document.addEventListener('pointercancel', function () {
    if (drag) { drag.el.classList.remove('tgdragging'); drag.el.style.opacity = ''; }
    drag = null;
  });
})();

      var r = cells[i].getBoundingClientRect();
      if (r.width === 0) continue;
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return cells[i];
    }

  function clearDropHighlight() {

    for (var i = 0; i < els.length; i++) els[i].classList.remove('tgdrop');
  }

  function updateDropHighlight(x, y) {

    if (!cell) cell = colAt(x, y);
    if (cell) cell.classList.add('tgdrop');
  }

  document.addEventListener('pointerdown', function (e) {

    var chip = e.target.closest ? e.target.closest('.tgchip') : null;

    if (!id) return;

  });

      drag.el.classList.add('tgdragging');
      drag.el.style.opacity = '0.75';
    }

      found.node.date = ad.dataset.iso;
      found.node.time = null;
    } else {
      var col = colAt(e.clientX, e.clientY);
      if (!col) return;
      found.node.date = col.dataset.iso;
      var rect = col.getBoundingClientRect();
      found.node.time = window.tgFromY(e.clientY - rect.top);
    }

    drag = null;
  });

(function () {
  var pressed = null;

  document.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    var ev = e.target.closest ? e.target.closest('.tgevent') : null;
    if (!ev || !ev.dataset.nodeId) { pressed = null; return; }
    pressed = {id: ev.dataset.nodeId, x: e.clientX, y: e.clientY};
  }, true);

  document.addEventListener('pointerup', function (e) {
    if (!pressed) return;
    var p = pressed; pressed = null;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (dx * dx + dy * dy <= 16) return;          // a click, not a drag
    var cells = document.querySelectorAll('.tgalldaycell');
    var hit = null;
    for (var i = 0; i < cells.length; i++) {
      var r = cells[i].getBoundingClientRect();
      if (r.width === 0) continue;
      if (e.clientX >= r.left && e.clientX <= r.right &&
          e.clientY >= r.top && e.clientY <= r.bottom) { hit = cells[i]; break; }
    }
    if (!hit) return;
    var found = window.findNode(p.id);
    if (!found || !found.node) return;
    
    // Make it an all-day item on that day: set date to hit.dataset.iso and time to null
    found.node.date = hit.dataset.iso;
    found.node.time = null;
    
    // Persist changes and re-render
    Store.save();
    renderAll();
  }, true);
})();

(function () {
  var base = window.renderTree;
  window.renderTree = function () {
    base();
    addTimeChips();
  };

  function addTimeChips() {
    var root = document.getElementById('treeRoot');
    if (!root) return;
    var rows = root.querySelectorAll('.tree-row');
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var existing = row.querySelector('.tree-timechip');
      if (existing) existing.remove();
      var found = window.findNode(row.dataset.id);
      if (!found || !found.node) continue;
      var node = found.node;
      if (!node.date) continue;
      var chip = document.createElement('button');
      chip.className = 'tree-timechip';
      chip.type = 'button';
      chip.textContent = node.time ? node.time : '+ time';
      chip.title = 'Set a time';
      chip.addEventListener('click', makeHandler(node, chip));
      var datechip = row.querySelector('.tree-datechip');
      if (datechip && datechip.parentNode) {
        datechip.parentNode.insertBefore(chip, datechip.nextSibling);
      } else {
        row.appendChild(chip);
      }
    }
  }

  function makeHandler(node, chip) {
    return function (e) {
      e.stopPropagation();
      var input = document.createElement('input');
      input.type = 'time';
      input.className = 'tree-timechip';
      input.value = node.time ? node.time : '09:00';
      var originalValue = input.value;

      input.addEventListener('click', function (ev) {
        ev.stopPropagation();
      });

      input.addEventListener('change', function (ev) {
        var newValue = input.value;
        node.time = newValue || null;
        Store.save();
        window.renderAll();
      });

      input.addEventListener('blur', function (ev) {
        if (input.value === originalValue) {
          window.renderTree();
        }
      });

      chip.replaceWith(input);
      input.focus();
    };
  }
})();

(function () {
  var root = document.getElementById('treeRoot');
  if (!root) return;

  var originalValues = new WeakMap();

  // Store the value when the input gets focus
  root.addEventListener('focus', function (e) {
    var t = e.target;
    if (!t || !t.classList) return;
    var isDate = t.classList.contains('tree-dateinput') || t.classList.contains('tree-timechip');
    var isTime = t.tagName === 'INPUT' && t.type === 'time';
    if (!isDate && !isTime) return;
    originalValues.set(t, t.value);
  }, true);

  // When the input loses focus without a value change, re‑render the tree
  root.addEventListener('blur', function (e) {
    var t = e.target;
    if (!t || !t.classList) return;
    var isDate = t.classList.contains('tree-dateinput') || t.classList.contains('tree-timechip');
    var isTime = t.tagName === 'INPUT' && t.type === 'time';
    if (!isDate && !isTime) return;
    var orig = originalValues.get(t);
    originalValues.delete(t);
    // If the value hasn't changed (or we have no stored original), re‑render
    if (orig === undefined || t.value === orig) {
      setTimeout(function () {
        if (typeof window.renderTree === 'function') window.renderTree();
      }, 120);
    }
  }, true);

  // Always open the native picker on click, even after a re‑render
  root.addEventListener('click', function (e) {
    var inp = e.target.closest ? e.target.closest('.tree-dateinput, .tree-timechip') : null;
    if (!inp) return;
    if (typeof inp.showPicker === 'function') {
      try {
        inp.showPicker();
      } catch (err) {
        inp.focus();
      }
    } else {
      // Fallback for browsers that don't support showPicker
      inp.focus();
    }
  });
})();

(function () {
    var base = window.renderTree;
    window.renderTree = function () { base(); enhance(); };

    function enhance() {
        var root = document.getElementById('treeRoot');
        if (!root) return;
        var rows = root.querySelectorAll('.tree-row');
        for (var i = 0; i < rows.length; i++) addControls(rows[i]);
    }

    function addControls(row) {
        if (row.querySelector('.tree-outdent')) return;
        var found = window.findNode(row.dataset.id);
        if (!found || !found.node) return;
        var node = found.node;
        var actions = row.querySelector('.tree-actions');
        if (!actions) return;

        var outdentBtn = document.createElement('button');
        outdentBtn.className = 'btn-icon tree-outdent';
        outdentBtn.textContent = '\u2190';
        outdentBtn.title = 'Move out one level';
        if (!found.parent) outdentBtn.disabled = true;
        outdentBtn.onclick = function(e) {
            e.stopPropagation();
            outdent(node);
        };
        actions.insertBefore(outdentBtn, actions.firstChild);

        var indentBtn = document.createElement('button');
        indentBtn.className = 'btn-icon tree-indent';
        indentBtn.textContent = '\u2192';
        indentBtn.title = 'Make a subtask of the task above';
        if (found.index <= 0) indentBtn.disabled = true;
        indentBtn.onclick = function(e) {
            e.stopPropagation();
            indent(node);
        };
        actions.insertBefore(indentBtn, outdentBtn.nextElementSibling);

        if (node.date) {
            var dateChip = row.querySelector('.tree-datechip');
            if (dateChip) {
                var clearBtn = document.createElement('button');
                clearBtn.className = 'tree-dateclear';
                clearBtn.textContent = '\u00d7';
                clearBtn.title = 'Clear date';
                clearBtn.onclick = function(e) {
                    e.stopPropagation();
                    node.date = null;
                    node.time = null;
                    node.block = null;
                    window.Store.save();
                    window.renderAll();
                };
                dateChip.parentNode.insertBefore(clearBtn, dateChip.nextSibling);
            }
        }
    }

    function siblingsOf(found) {
        return found.parent ? found.parent.children : window.Store.data.tree;
    }

    function outdent(node) {
        var found = window.findNode(node.id);
        if (!found || !found.parent) return;
        var parentFound = window.findNode(found.parent.id);
        if (!parentFound) return;
        var removed = window.removeNode(node.id);
        if (!removed) return;
        var target = parentFound.parent ? parentFound.parent.children : window.Store.data.tree;
        var insertIdx = parentFound.index + 1;
        if (insertIdx > target.length) insertIdx = target.length;
        target.splice(insertIdx, 0, removed);
        window.Store.save();
        window.renderAll();
    }

    function indent(node) {
        var found = window.findNode(node.id);
        if (!found) return;
        var sibs = siblingsOf(found);
        var idx = found.index;
        if (idx <= 0) return;
        var prev = sibs[idx - 1];
        var removed = window.removeNode(node.id);
        if (!removed) return;
        if (!Array.isArray(prev.children)) {
            prev.children = [];
        }
        prev.children.push(removed);
        prev.collapsed = false;
        window.Store.save();
        window.renderAll();
    }
})();

(function () {
  var drag = null;

  function cellAt(x, y) {
    var cells = document.querySelectorAll('#monthGrid .mcell');
    for (var i = 0; i < cells.length; i++) {
      var r = cells[i].getBoundingClientRect();
      if (r.width === 0) continue;
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return cells[i];
    }
    return null;
  }

  function clearHighlight() {
    var on = document.querySelectorAll('#monthGrid .mcell.dropping');
    for (var i = 0; i < on.length; i++) on[i].classList.remove('dropping');
  }

  function pad(n) { return n < 10 ? '0' + n : n; }

  document.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    var chip = e.target.closest ? e.target.closest('.mchip') : null;
    if (!chip || !chip.dataset.nodeId) return;
    drag = { el: chip, id: chip.dataset.nodeId, startX: e.clientX, startY: e.clientY, moved: false };
  });

  document.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (!drag.moved) {
      var dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
      if (dx * dx + dy * dy <= 16) return;
      drag.moved = true;
      drag.el.classList.add('tgdragging');
      drag.el.style.opacity = '0.75';
    }
    e.preventDefault();
    clearHighlight();
    var c = cellAt(e.clientX, e.clientY);
    if (c) c.classList.add('dropping');
  });

  document.addEventListener('pointerup', function (e) {
    if (!drag) return;
    var d = drag; drag = null;
    d.el.classList.remove('tgdragging');
    d.el.style.opacity = '';
    clearHighlight();
    if (!d.moved) return;
    var cell = cellAt(e.clientX, e.clientY);
    if (!cell || !cell.dataset.iso) return;
    var found = window.findNode(d.id);
    if (!found || !found.node) return;

    var isoDate = cell.dataset.iso;
    var node = found.node;
    // dates are 'YYYY-MM-DD' strings in this app; time lives separately in .time
    node.date = isoDate;

    window.Store.save();
    window.__suppressClick = true;
    setTimeout(function () { window.__suppressClick = false; }, 400);
    window.renderAll();
  });

  document.addEventListener('pointercancel', function () {
    if (drag) {
      drag.el.classList.remove('tgdragging');
      drag.el.style.opacity = '';
    }
    clearHighlight();
    drag = null;
  });
})();

(function () {
  var root = document.getElementById('treeRoot');
  if (!root) return;

  function openEditor(chip, kind) {
    var row = chip.closest('.tree-row');
    if (!row) return;
    var id = row.dataset.id;
    var found = window.findNode(id);
    if (!found || !found.node) return;
    var node = found.node;

    var input = document.createElement('input');
    input.type = (kind === 'date') ? 'date' : 'time';
    input.className = (kind === 'date') ? 'tree-dateinput' : 'tree-timeinput';
    input.value = (kind === 'date') ? (node.date || '') : (node.time || '');

    var done = false;
    function commit() {
      if (done) return;
      done = true;
      // re-resolve by id so nothing depends on a stale reference
      var f = window.findNode(id);
      if (f && f.node) {
        if (kind === 'date') {
          f.node.date = input.value || null;
          if (!f.node.date) { f.node.time = null; f.node.block = null; }
        } else {
          f.node.time = input.value || null;
        }
        window.Store.save();
        if (kind === 'date' && f.node.date && typeof window.noteMoved === 'function') {
          setTimeout(function () { window.noteMoved(f.node.date); }, 60);
        }
      }
      window.renderAll();
    }
    function cancel() {
      if (done) return;
      done = true;
      window.renderTree();
    }

    input.addEventListener('change', commit);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    });
    input.addEventListener('blur', function () {
      // give a pending change event a chance to land first
      setTimeout(function () { if (!done) cancel(); }, 150);
    });

    chip.replaceWith(input);
    input.focus();
    try { if (input.showPicker) input.showPicker(); } catch (err) {}
  }

  // Delegate in the CAPTURE phase and stop the older handlers from also firing.
  root.addEventListener('click', function (e) {
    var dateChip = e.target.closest ? e.target.closest('.tree-datechip') : null;
    if (dateChip) {
      // stop the original handler, then open our own editor
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      openEditor(dateChip, 'date');
      return;
    }
    var timeChip = e.target.closest ? e.target.closest('.tree-timechip') : null;
    if (timeChip) {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      openEditor(timeChip, 'time');
    }
  }, true);
})();

(function () {

    var at = (typeof entry.index === 'number' && entry.index <= target.length) ? entry.index : target.length;
    target.splice(at, 0, entry.node);

(function () {
  // 0 = Sunday .. 6 = Saturday. Anything else is not a week start.
  function safeStart() {
    var s = window.Store && window.Store.data && window.Store.data.settings;
    var v = s ? s.weekStart : undefined;
    return (typeof v === 'number' && isFinite(v) && v >= 0 && v <= 6) ? v : 0;
  }

    if (window.console) console.warn('m99: weekStartOf missing, not hardened');
    return;
  }

    var d = window.parseISO(iso);
    if (!d || isNaN(d.getTime())) {

      return typeof iso === 'string' ? iso : window.todayISO();
    }
    return out;
  };

  // import, or a hand-edited file gets its missing settings keys filled in.
  // Only fills what is ABSENT - never overwrites a value the operator chose.

    if (!s.filters || typeof s.filters !== 'object') s.filters = {areas: [], tags: []};
    if (!Array.isArray(s.filters.areas)) s.filters.areas = [];

/* ===== m108 version safety ===== */
(function () {
    var KEEP = 3;
    var LS_SEEN = 'planner.lastBuild';

    function buildStamp() {
        var el = document.getElementById('buildStamp');
        if (!el) return '';
        return (el.textContent || '').trim();
    }

    function countNodes(list) {
        if (!list) return 0;
        var total = 0;
        for (var i = 0; i < list.length; i++) {
            var child = list[i];
            total += 1 + countNodes(child.children);
        }
        return total;
    }

    window.tagBuild = function () {
        var d = window.Store && window.Store.data;
        if (!d) return;
        d.build = buildStamp();
    };

    window.checkRemoteBuild = function (remote) {
        if (!remote || !remote.build) return;
        var mine = buildStamp();
        if (!mine || remote.build >= mine) return;
        if (window.__oldBuildWarned) return;
        window.__oldBuildWarned = true;
        if (window.toast) {
            window.toast('Another device is running an older version (' + remote.build +
                '). Update it before editing there, or its next save can overwrite this work.', 'err');
        }
    };

    window.snapshotToGist = function (reason) {
        if (!window.CloudGist || !window.CloudGist.active || !window.CloudGist.active()) {
            return Promise.resolve(false);
        }
        var d = window.Store && window.Store.data;
        if (!d) return Promise.resolve(false);
        var stamp = String(new Date().toISOString()).slice(0, 19).replace(/[:T]/g, '-');
        var name = 'history-' + stamp + '.json';
        var files = {};
        files[name] = { content: JSON.stringify({
            at: new Date().toISOString(),
            reason: String(reason || 'manual'),
            build: buildStamp(),
            items: countNodes(d.tree),
            data: d
        }) };
        return window.CloudGist._patchFiles(files).then(function () { return true; },
                                                        function () { return false; });
    };

    window.pruneSnapshots = function (gist) {
        if (!gist || !gist.files) return Promise.resolve();
        var names = [], k;
        for (k in gist.files) {
            if (gist.files.hasOwnProperty(k) && k.indexOf('history-') === 0) names.push(k);
        }
        if (names.length <= KEEP) return Promise.resolve();
        names.sort();
        var drop = names.slice(0, names.length - KEEP), files = {}, i;
        for (i = 0; i < drop.length; i++) { files[drop[i]] = null; }
        return window.CloudGist._patchFiles(files);
    };

    function onNewBuild() {
        var now = buildStamp();
        if (!now) return;
        var seen = '';
        try { seen = localStorage.getItem(LS_SEEN) || ''; } catch (e) {}
        if (seen === now) return;
        try { localStorage.setItem(LS_SEEN, now); } catch (e) {}
        if (!seen) return;
        setTimeout(function () {
            window.snapshotToGist('upgraded from ' + seen + ' to ' + now);
        }, 6000);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { setTimeout(onNewBuild, 2000); });
    } else {
        setTimeout(onNewBuild, 2000);
    }
})();

/* ===== m109 note lines ===== */
(function () {
  var SIZES = [['small', 'Small'], ['normal', 'Normal'], ['large', 'Large']];

  function linesOf(node) {
    if (node.noteLines && node.noteLines.length) return node.noteLines;
    var txt = String(node.notes == null ? '' : node.notes);
    var parts = txt.split('\n');
    var out = [], i;
    for (i = 0; i < parts.length; i++) {
      out.push({ t: parts[i], b: false, i: false, s: 'normal' });
    }
    if (!out.length) out.push({ t: '', b: false, i: false, s: 'normal' });
    return out;
  }

  // notes stays the plain-text join so search, export and older data keep
  // working. It is DERIVED - never edited directly.
  function syncPlain(node) {
    var L = node.noteLines || [], parts = [], i;
    for (i = 0; i < L.length; i++) { parts.push(L[i].t || ''); }
    node.notes = parts.join('\n');
  }
  window.plannerSyncNoteText = syncPlain;

  function styleLine(inp, ln) {
    inp.style.fontWeight = ln.b ? '600' : '400';
    inp.style.fontStyle = ln.i ? 'italic' : 'normal';
    inp.style.fontSize = ln.s === 'small' ? '11px' : (ln.s === 'large' ? '16px' : '13px');
  }

  // Build the note box: one row per line, and a toolbar along the BOTTOM edge of
  // the box that styles whichever line the caret is in.
  window.buildNoteBox = function (node) {
    var lines = linesOf(node).slice();
    var focused = 0;

    var box = document.createElement('div');
    box.className = 'note-box';
    var list = document.createElement('div');
    list.className = 'note-lines';
    var bar = document.createElement('div');
    bar.className = 'note-bar';

    function commit() {
      node.noteLines = lines;
      syncPlain(node);
    }

    function render(focusIndex, caretAtEnd) {
      list.textContent = '';
      var i;
      for (i = 0; i < lines.length; i++) {
        (function (idx) {
          var inp = document.createElement('input');
          inp.type = 'text';
          inp.className = 'note-line';
          inp.value = lines[idx].t || '';
          styleLine(inp, lines[idx]);
          inp.addEventListener('focus', function () { focused = idx; paintBar(); });
          inp.addEventListener('input', function () { lines[idx].t = inp.value; commit(); });
          inp.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
              e.preventDefault();
              var pos = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
              var head = inp.value.slice(0, pos), tail = inp.value.slice(pos);
              lines[idx].t = head;
              lines.splice(idx + 1, 0, { t: tail, b: lines[idx].b, i: lines[idx].i, s: lines[idx].s });
              commit();
              render(idx + 1, false);
              return;
            }
            if (e.key === 'Backspace' && (inp.selectionStart === 0 && inp.selectionEnd === 0) && idx > 0) {
              e.preventDefault();
              var prevLen = (lines[idx - 1].t || '').length;
              lines[idx - 1].t = (lines[idx - 1].t || '') + (inp.value || '');
              lines.splice(idx, 1);
              commit();
              render(idx - 1, true, prevLen);
              return;
            }
            if (e.key === 'ArrowDown' && idx < lines.length - 1) { e.preventDefault(); render(idx + 1, false); }
            if (e.key === 'ArrowUp' && idx > 0) { e.preventDefault(); render(idx - 1, true); }
          });
          list.appendChild(inp);
        })(i);
      }
      var els = list.querySelectorAll('.note-line');
      if (typeof focusIndex === 'number' && els[focusIndex]) {
        focused = focusIndex;
        els[focusIndex].focus();
        var at = arguments.length > 2 ? arguments[2] : (caretAtEnd ? els[focusIndex].value.length : 0);
        try { els[focusIndex].setSelectionRange(at, at); } catch (e) {}
      }
      paintBar();
    }

    function paintBar() {
      bar.textContent = '';
      var ln = lines[focused] || lines[0];
      if (!ln) return;
      var bBtn = document.createElement('button');
      bBtn.type = 'button'; bBtn.textContent = 'B';
      bBtn.className = 'note-btn' + (ln.b ? ' on' : '');
      bBtn.addEventListener('click', function () { ln.b = !ln.b; commit(); render(focused, true); });
      var iBtn = document.createElement('button');
      iBtn.type = 'button'; iBtn.textContent = 'I';
      iBtn.className = 'note-btn note-ital' + (ln.i ? ' on' : '');
      iBtn.addEventListener('click', function () { ln.i = !ln.i; commit(); render(focused, true); });
      var sel = document.createElement('select');
      sel.className = 'note-size';
      var k;
      for (k = 0; k < SIZES.length; k++) {
        var o = document.createElement('option');
        o.value = SIZES[k][0]; o.textContent = SIZES[k][1];
        if (SIZES[k][0] === ln.s) o.selected = true;
        sel.appendChild(o);
      }
      sel.addEventListener('change', function () { ln.s = sel.value; commit(); render(focused, true); });
      var tag = document.createElement('span');
      tag.className = 'note-which';
      tag.textContent = 'line ' + (focused + 1);
      bar.appendChild(bBtn); bar.appendChild(iBtn); bar.appendChild(sel); bar.appendChild(tag);
    }

    box.appendChild(list);
    box.appendChild(bar);
    render(null, false);
    return box;
  };
})();

/* ===== m111 alarms engine ===== */
(function () {
  var LEADS = [[0,'At the time'],[5,'5 min before'],[10,'10 min before'],
               [15,'15 min before'],[30,'30 min before'],[60,'1 hour before'],
               [120,'2 hours before'],[1440,'1 day before']];
  var seq = 0;

  function uid() {
    seq = seq + 1;
    return 'al' + seq + Math.floor(Math.random() * 1000000).toString(36);
  }

  window.alarmsOf = function (node) {
    if (!node) return [];
    if (node.reminders && node.reminders.length) return node.reminders;
    var out = [];
    var r = node.reminder;
    if (r && typeof r === 'object' && r.mode && r.mode !== 'off') {
      out.push({ id: uid(), kind: 'offset', lead: Number(r.lead) || 0, mode: r.mode });
    } else if (r === true) {
      out.push({ id: uid(), kind: 'offset', lead: 10, mode: 'sound' });
    }
    return out;
  };

  window.newAlarm = function (node) {
    return { id: uid(), kind: 'at',
      date: (node && node.date) || window.todayISO(),
      time: (node && node.time) || '09:00',
      mode: 'sound' };
  };

  window.alarmFireAt = function (node, al) {
    if (!node || !al) return 0;
    if (al.mode === 'off') return 0;
    var d, hm;
    if (al.kind === 'at') {
      if (!al.date) return 0;
      d = window.parseISO(al.date);
      if (!d || isNaN(d.getTime())) return 0;
      hm = String(al.time || '00:00').split(':');
      d.setHours(parseInt(hm[0], 10) || 0, parseInt(hm[1], 10) || 0, 0, 0);
      return d.getTime();
    }
    if (!node.date) return 0;
    // A dated task with NO time still deserves a working alarm. This returned 0,
    // so "30 min before" on an all-day task produced nothing at all and the
    // event reached the calendar carrying zero alarms. 09:00 is the anchor -
    // the same convention Google Calendar uses for all-day reminders.
    var anchorTime = node.time || '09:00';
    d = window.parseISO(node.date);
    if (!d || isNaN(d.getTime())) return 0;
    hm = String(anchorTime).split(':');
    d.setHours(parseInt(hm[0], 10) || 0, parseInt(hm[1], 10) || 0, 0, 0);
    return d.getTime() - (Number(al.lead) || 0) * 60000;
  };

  window.alarmKey = function (node, al, at) {
    return 'planner.rem.' + node.id + '.' + (al.id || 'x') + '.' + at;
  };

  function walk(list, out) {
    var i, item;
    for (i = 0; i < list.length; i++) {
      item = list[i];
      if (!item) continue;
      out.push(item);
      if (item.children && item.children.length) {
        walk(item.children, out);
      }
    }
  }

  window.__remScan = function () {
    if (!window.Store || !window.Store.data) return;
    var all = [];
    walk(window.Store.data.tree || [], all);
    var now = Date.now(), WINDOW = 10 * 60 * 1000;
    var i, j, node, list, al, at, key;
    for (i = 0; i < all.length; i++) {
      node = all[i];
      if (node.done) continue;
      list = window.alarmsOf(node);
      for (j = 0; j < list.length; j++) {
        try {
          al = list[j];
          at = window.alarmFireAt(node, al);
          if (!at) continue;
          if (now < at || now - at >= WINDOW) continue;
          key = window.alarmKey(node, al, at);
          var seen = null;
          try { seen = localStorage.getItem(key); } catch (e) {}
          if (seen) continue;
          try { localStorage.setItem(key, '1'); } catch (e) {}
          if (window.fireAlarm) window.fireAlarm(node, al);
        } catch (e) {}
      }
    }
  };

  setInterval(function () { window.__remScan(); }, 15000);
  document.addEventListener('visibilitychange', function () { window.__remScan(); });
})();

/* ===== m113 date popover ===== */
(function () {
  var MONTHS = ['January','February','March','April','May','June','July',
                'August','September','October','November','December'];
  var DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];

  // ONE month grid, shared. The app already had this logic inside pickDateFor,
  // welded to a task's own date and mounted through showModal - and showModal
  // closes whatever dialog is already open, so it could never be used from
  // inside the Edit dialog. This is the same grid, taking a value and a
  // callback, with no opinion about how it is mounted.
  window.buildDateGrid = function (currentIso, onPick) {
    var host = document.createElement('div');
    host.className = 'datepop datepop-inline';
    var cur = window.parseISO(currentIso || window.todayISO());
    if (!cur || isNaN(cur.getTime())) cur = new Date();
    var cursor = new Date(cur.getFullYear(), cur.getMonth(), 1);

    function draw() {
      host.textContent = '';
      var head = document.createElement('div');
      head.className = 'datepop-head';
      var prev = document.createElement('button');
      prev.type = 'button';
      prev.textContent = '<';

        cursor = new Date(cursor.getFullYear(), cursor.getMonth() - 1, 1);
        draw();
      });
      var lab = document.createElement('span');
      lab.textContent = MONTHS[cursor.getMonth()] + ' ' + cursor.getFullYear();
      var next = document.createElement('button');
      next.type = 'button';
      next.textContent = '>';
      next.addEventListener('click', function (e) { e.stopPropagation();
        cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);

      head.appendChild(prev);
      head.appendChild(lab);
      head.appendChild(next);
      host.appendChild(head);

      var grid = document.createElement('div');
      grid.className = 'datepop-grid';
      var year = cursor.getFullYear(), month = cursor.getMonth();
      var daysInMonth = new Date(year, month + 1, 0).getDate();
      var startDow = new Date(year, month, 1).getDay();
      var i, d;
      for (i = 0; i < DOW.length; i++) {
        var dw = document.createElement('div');
        dw.className = 'datepop-dow';
        dw.textContent = DOW[i];
        grid.appendChild(dw);
      }
      for (i = 0; i < startDow; i++) {
        var blank = document.createElement('div');
        blank.className = 'datepop-blank';
        grid.appendChild(blank);
      }
      var todayIso = window.todayISO();
      for (d = 1; d <= daysInMonth; d++) {
        (function (day) {
          var iso = window.isoOf(new Date(year, month, day));
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'datepop-day';
          if (iso === todayIso) btn.classList.add('today');
          if (currentIso && iso === currentIso) btn.classList.add('sel');
          btn.dataset.iso = iso;
          btn.textContent = String(day);
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            e.preventDefault();
            if (onPick) onPick(iso);
          });
          grid.appendChild(btn);
        })(d);
      }
      host.appendChild(grid);
    }

    draw();
    return host;
  };

  // Mount that grid next to a button, WITHOUT going through showModal, so the
  // dialog it is opened from stays open.
  window.openDatePopover = function (anchorEl, currentIso, onPick) {
    var old = document.querySelector('.al-pop');
    if (old && old.parentNode) old.parentNode.removeChild(old);

    var pop = document.createElement('div');
    pop.className = 'al-pop';
    var grid = window.buildDateGrid(currentIso, function (iso) {
      if (onPick) onPick(iso);
      if (pop.parentNode) pop.parentNode.removeChild(pop);
      document.removeEventListener('mousedown', away, true);
    });
    pop.appendChild(grid);
    document.body.appendChild(pop);

    var r = anchorEl.getBoundingClientRect();
    var top = r.bottom + 4;
    var left = r.left;
    var pw = pop.getBoundingClientRect().width || 240;
    if (left + pw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - pw - 8);
    var ph = pop.getBoundingClientRect().height || 260;
    if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 4);
    pop.style.left = Math.round(left) + 'px';
    pop.style.top = Math.round(top) + 'px';

    function away(e) {
      if (pop.contains(e.target) || e.target === anchorEl) return;
      if (pop.parentNode) pop.parentNode.removeChild(pop);
      document.removeEventListener('mousedown', away, true);

})();

/* ===== m114 ios audio ===== */
(function () {
  var ctx = null, unlocked = false;

  // iOS Safari starts every AudioContext SUSPENDED unless it is created or
  // resumed inside a real user gesture, and a suspended context plays nothing
  // and reports no error. The alarm was building a fresh context at fire time -
  // long after any gesture - so it was silent on the phone every time.
  // One context, unlocked by the first touch, reused for every alarm.
  function unlock() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ctx) ctx = new AC();
    if (ctx.state === 'suspended' && ctx.resume) { ctx.resume(); }
    // a silent blip is what actually convinces iOS the context is live
    var o = ctx.createOscillator(), g = ctx.createGain();
    g.gain.value = 0.0001;
    o.connect(g); g.connect(ctx.destination);
    o.start(0); o.stop(ctx.currentTime + 0.01);
    unlocked = true;
  }

  ['touchend', 'mousedown', 'keydown'].forEach(function (evt) {
    document.addEventListener(evt, function once() {
      unlock();
      if (unlocked) {
        ['touchend', 'mousedown', 'keydown'].forEach(function (e2) {
          document.removeEventListener(e2, once, true);
        });
      }
    }, true);
  });

  window.plannerAudioReady = function () { return !!(ctx && ctx.state === 'running'); };

  window.plannerBeep = function () {
    try {
      if (!ctx) unlock();
      if (!ctx) return false;
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      var t0 = ctx.currentTime, i;
      for (i = 0; i < 3; i++) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = 880;
        var s = t0 + i * 0.45;
        g.gain.setValueAtTime(0.0001, s);
        g.gain.exponentialRampToValueAtTime(0.6, s + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, s + 0.35);
        o.connect(g); g.connect(ctx.destination);
        o.start(s); o.stop(s + 0.4);
      }
      return true;
    } catch (e) { return false; }
  };

  // iOS only shows the permission prompt from inside a user gesture, and only
  // once ever. Ask when the operator actually sets up an alarm - that is a tap.
  window.askAlarmPermission = function () {
    try {
      if (!window.Notification) return 'unsupported';
      if (Notification.permission === 'granted') return 'granted';
      if (Notification.permission === 'denied') return 'denied';
      var p = Notification.requestPermission();
      if (p && p.then) { p.then(function () {}, function () {}); }
      return 'asked';
    } catch (e) { return 'error'; }
  };
})();

    x.className = 'al-x';
    x.textContent = '✕';
    x.title = 'Remove this alarm';
    x.addEventListener('click', function (e) {
      e.preventDefault();
      pending.splice(idx, 1);
      redraw();

    return row;
  }

  function build(node) {
    var wrap = document.createElement('div');
    wrap.className = 'al-wrap';

    function redraw() {
      wrap.textContent = '';

      var head = document.createElement('div');
      head.className = 'al-head';
      var t = document.createElement('span');
      t.textContent = pending.length ? ('Alarms (' + pending.length + ')') : 'No alarms';
      var plus = document.createElement('button');
      plus.type = 'button';
      plus.className = 'al-plus';
      plus.textContent = '+';
      plus.title = 'Add an alarm';
      plus.addEventListener('click', function (e) {
        e.preventDefault();
        // a tap is the only moment iOS will show the permission prompt
        if (window.askAlarmPermission) window.askAlarmPermission();
        pending.push(window.newAlarm(node));
        redraw();
      });
      head.appendChild(t);
      head.appendChild(plus);
      wrap.appendChild(head);

      if (pending.length) {
        var group = document.createElement('div');
        group.className = 'al-group';
        var i2;
        for (i2 = 0; i2 < pending.length; i2++) {
          group.appendChild(rowFor(pending[i2], i2, node, redraw));
        }
        wrap.appendChild(group);
      }

      var add = document.createElement('button');
      add.type = 'button';
      add.className = 'al-add';
      add.textContent = '+ Add alarm';
      add.addEventListener('click', function (e) {
        e.preventDefault();
        // a tap is the only moment iOS will show the permission prompt
        if (window.askAlarmPermission) window.askAlarmPermission();
        pending.push(window.newAlarm(node));
        redraw();
      });
      wrap.appendChild(add);
    }

    redraw();
    return wrap;
  }

  function patch(id) {
    if (document.querySelector('.al-wrap')) return;
    var f = window.findNode(id);
    var node = f && f.node;
    if (!node) return;
    pending = (window.alarmsOf(node) || []).map(function (a) {
      var c = {}; for (var k in a) { if (a.hasOwnProperty(k)) c[k] = a[k]; } return c;
    });
    var rows = document.querySelectorAll('.ea .ea-row'), host = null, i, lab;
    for (i = 0; i < rows.length; i++) {
      lab = rows[i].querySelector('.ea-label');
      if (lab && lab.textContent === 'Reminder') { host = rows[i]; break; }
    }
    if (!host) return;
    var ctl = host.querySelector('.ea-remctl');
    if (ctl && ctl.parentNode) { ctl.parentNode.removeChild(ctl); }
    var cb = host.querySelector('input[type=checkbox]');
    if (cb) cb.style.display = 'none';
    host.appendChild(build(node));
    wireSave(id);
  }

  function wireSave(id) {
    var btns = document.querySelectorAll('.modal-footer button'), i;
    for (i = 0; i < btns.length; i++) {
      if (btns[i].textContent.trim() !== 'Save') continue;
      if (btns[i].dataset.alWired) continue;
      btns[i].dataset.alWired = '1';
      btns[i].addEventListener('click', function () {
        var want = pending;
        setTimeout(function () {
          var g = window.findNode(id);
          if (!g || !g.node || !want) return;
          g.node.reminders = want;
          g.node.reminder = want.length ? true : null;
          try { window.Store.save(); } catch (e) {}
        }, 0);
      });
    }
  }

  var base = window.editActivity;
  if (typeof base === 'function') {
    window.editActivity = function (id) {
      var r = base.apply(this, arguments);
      setTimeout(function () { patch(id); }, 60);
      return r;
    };
  }
})();

/* ===== m115 calendar feed ===== */
(function () {
  var LS_ICS = 'planner.ics.hash';

  function hash(s) {
    var h = 5381, i;
    for (i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) | 0; }
    return String(h);
  }

  var publishing = false;
  window.publishCalendar = function (force) {
    // Single-flight. Publishing calls buildICS, which used to save, which
    // triggers a push, which triggers a sync, which republishes - a loop that
    // hammered the GitHub API until it rate-limited and surfaced as "Sync
    // error". The save is gone; this guard makes sure no other route can
    // re-enter it either.
    if (publishing) return Promise.resolve(false);
    if (!window.CloudGist || !window.CloudGist.active || !window.CloudGist.active()) {
      return Promise.resolve(false);
    }
    if (!window.buildICS || !window.CloudGist._patchFiles) return Promise.resolve(false);
    var text;
    try { text = window.buildICS(); } catch (e) { return Promise.resolve(false); }
    if (!text) return Promise.resolve(false);
    var stable = text.replace(/DTSTAMP:[0-9TZ]+/g, '').replace(/LAST-MODIFIED:[0-9TZ]+/g, '');
    var h = hash(stable), seen = '';
    try { seen = localStorage.getItem(LS_ICS) || ''; } catch (e) {}
    if (!force && seen === h) return Promise.resolve(false);
    var files = { 'planner.ics': { content: text } };
    publishing = true;
    return window.CloudGist._patchFiles(files).then(function () {
      try { localStorage.setItem(LS_ICS, h); } catch (e) {}
      publishing = false;
      return true;
    }, function () { publishing = false; return false; });
  };

  window.calendarFeedUrl = function () {
    var id = '';
    try { id = localStorage.getItem('planner.gh.gist') || ''; } catch (e) {}
    if (!id) return '';
    return 'https://gist.githubusercontent.com/' + (window.plannerGistOwner || 'raw') +
           '/' + id + '/raw/planner.ics';
  };

  window.rememberGistOwner = function (gist) {
    if (!gist || !gist.owner || !gist.owner.login) return;
    window.plannerGistOwner = gist.owner.login;
    try { localStorage.setItem('planner.gh.owner', gist.owner.login); } catch (e) {}
  };

  try {
    var o = localStorage.getItem('planner.gh.owner');
    if (o) window.plannerGistOwner = o;
  } catch (e) {}

  // Wrap the PUBLIC sync entry points. Wrapping window.plannerSyncNow was
  // useless: CloudGist.push/pull call the module's own internal syncNow
  // reference, which never passes through the wrapper - so the calendar was
  // never republished automatically and the operator had to press Publish now
  // by hand after every single change.
  function afterSync(r) {
    if (r && r.then) {
      r.then(function () { setTimeout(function () { window.publishCalendar(false); }, 900); },
             function () {});
    } else {
      setTimeout(function () { window.publishCalendar(false); }, 900);
    }
    return r;
  }

  function wireAuto() {
    if (!window.CloudGist || window.CloudGist.__autoIcs) return;
    window.CloudGist.__autoIcs = true;
    var bp = window.CloudGist.push, bl = window.CloudGist.pull;
    if (typeof bp === 'function') {
      window.CloudGist.push = function () { return afterSync(bp.apply(window.CloudGist, arguments)); };
    }
    if (typeof bl === 'function') {
      window.CloudGist.pull = function () { return afterSync(bl.apply(window.CloudGist, arguments)); };
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(wireAuto, 2000); });
  } else {
    setTimeout(wireAuto, 2000);
  }
})();

/* ===== m121 feed resolve ===== */
(function () {
  // Stop GUESSING the feed address. It used to be built by hand from a cached
  // owner and gist id, substituting the literal word "raw" when the owner was
  // unknown and returning an empty string when the id was - then showing that to
  // the operator, who pasted it into Safari and got a search box.
  // GitHub reports the real address for every file in a gist. Use that.
  window.resolveFeedUrl = function () {
    if (!window.CloudGist || !window.CloudGist._readGist) {
      return Promise.resolve({ ok: false, why: 'Connect GitHub first.' });
    }
    return window.CloudGist._readGist().then(function (g) {
      if (!g || !g.files) return { ok: false, why: 'Could not read your gist.' };
      var f = g.files['planner.ics'];
      if (!f || !f.raw_url) {
        return { ok: false, why: 'The calendar has never been published. Press Publish now.' };
      }
      // GitHub's raw_url pins a specific revision:
      //   .../<owner>/<id>/raw/<commit-sha>/planner.ics
      // Strip the sha so the address always serves the latest, which is what
      // a subscribed calendar needs.
      var url = String(f.raw_url).replace(/\/raw\/[0-9a-f]{20,}\//, '/raw/');
      return { ok: true, url: url };
    }, function (e) {
      return { ok: false, why: (e && e.message) || 'Could not reach GitHub.' };
    });
  };

  // Publish first if needed, then hand back a working address - never a broken one.
  window.feedUrlEnsured = function () {
    return window.resolveFeedUrl().then(function (r) {
      if (r.ok) return r;
      if (!window.publishCalendar) return r;
      return window.publishCalendar(true).then(function () {
        return window.resolveFeedUrl();
      }, function () { return r; });
    });
  };
})();

(function () {
  function walk(list, out) {
    var i, len, node;
    if (!list) return;
    for (i = 0, len = list.length; i < len; i++) {
      node = list[i];
      out.push(node);
      if (node.children) {
        walk(node.children, out);
      }
    }
  }

  // Why a task is or is not in the calendar feed. The feed deliberately drops
  // things, and until now there was no way to see WHICH, so "my alarm did not
  // work" had no answer inside the app.
  window.calendarReport = function () {
    var all = [];
    walk((window.Store && window.Store.data && window.Store.data.tree) || [], all);
    var now = Date.now();
    var included = [], excluded = [], i, n, why, startMs, q;
    for (i = 0; i < all.length; i++) {
      n = all[i];
      why = '';
      // Matches the export rule exactly: an undated task still counts if one of
      // its alarms carries its own date.
      var oa = window.alarmsOf ? window.alarmsOf(n) : [];
      var dAl = null, z;
      for (z = 0; z < oa.length; z++) {
        if (oa[z] && oa[z].kind === 'at' && oa[z].date) { dAl = oa[z]; break; }
      }
      if (!n.date && !dAl) { why = 'no date, and no alarm with its own date'; }
      else if (n.done) { why = 'marked done'; }
      else {
        var aD = n.date || dAl.date;
        var aT = n.date ? n.time : dAl.time;
        startMs = window.parseISO(aD).getTime();
        if (aT) {
          q = String(aT).split(':');
          startMs += ((parseInt(q[0],10)||0) * 60 + (parseInt(q[1],10)||0)) * 60000;
        } else {
          startMs += 24 * 3600000;
        }
        if (startMs < now) { why = 'already in the past'; }
      }
      var alarms = window.alarmsOf ? window.alarmsOf(n).length : 0;
      if (why) { excluded.push({ title: n.title || 'Untitled', why: why }); }
      else { included.push({ title: n.title || 'Untitled', date: n.date, time: n.time || 'all day', alarms: alarms }); }
    }
    return { included: included, excluded: excluded };
  };

  window.showCalendarPreview = function () {
    var body = document.createElement('div');
    var r = window.calendarReport();
    var head = document.createElement('p');
    head.textContent = r.included.length
      ? (r.included.length + ' task' + (r.included.length === 1 ? '' : 's') + ' will appear in your calendar:')
      : 'Nothing will appear in your calendar yet.';

    var ul = document.createElement('ul');
    ul.style.cssText = 'font-size:12px;line-height:1.5;padding-left:18px;margin:6px 0 12px';
    var i, li;
    for (i = 0; i < r.included.length; i++) {
      li = document.createElement('li');
      li.textContent = r.included[i].title + ' - ' + r.included[i].date + ' ' + r.included[i].time
                      + ' (' + r.included[i].alarms + ' alarm' + (r.included[i].alarms === 1 ? '' : 's') + ')';
      ul.appendChild(li);
    }
    body.appendChild(ul);

    if (r.excluded.length) {
      var h2 = document.createElement('p');
      h2.style.cssText = 'font-size:12px;font-weight:600;margin-top:10px';
      h2.textContent = 'Left out (' + r.excluded.length + '):';
      body.appendChild(h2);
      var ul2 = document.createElement('ul');
      ul2.style.cssText = 'font-size:12px;line-height:1.5;padding-left:18px;opacity:.8';
      for (i = 0; i < r.excluded.length && i < 25; i++) {
        li = document.createElement('li');
        li.textContent = r.excluded[i].title + ' - ' + r.excluded[i].why;
        ul2.appendChild(li);
      }
      body.appendChild(ul2);
      var tip = document.createElement('p');
      tip.style.cssText = 'font-size:11px;opacity:.75;margin-top:10px';
      tip.textContent = 'A task only reaches the calendar if it has a date, is not done, and has not already passed. Give it a date and a time.';

      { label: 'Close' },

          if (window.publishCalendar) {

              if (window.toast) window.toast(ok ? 'Calendar published' : 'Could not publish', ok ? 'ok' : 'err');
            });

(function () {
  var CLIENT_ID = '1075525058690-i5ih4idohki0ddjp3ckkvkc9nld6f63f.apps.googleusercontent.com';
  var SCOPE = 'https://www.googleapis.com/auth/calendar';
  var API = 'https://www.googleapis.com/calendar/v3';
  var LS_TOK = 'planner.gcal.token';
  var LS_EXP = 'planner.gcal.exp';
  var LS_CAL = 'planner.gcal.calendar';
  var CAL_NAME = 'Planner';

  function ls(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }

  window.gcalToken = function () {
    var t = ls(LS_TOK), e = Number(ls(LS_EXP)) || 0;
    if (!t) return '';
    if (e && Date.now() > e - 60000) return '';
    return t;
  };

  window.gcalConnected = function () { return !!window.gcalToken(); };

  window.gcalConnect = function () {
    var redirect = location.origin + location.pathname;
    var url = 'https://accounts.google.com/o/oauth2/v2/auth'
      + '?client_id=' + encodeURIComponent(CLIENT_ID)
      + '&redirect_uri=' + encodeURIComponent(redirect)
      + '&response_type=token'
      + '&scope=' + encodeURIComponent(SCOPE)
      + '&include_granted_scopes=true'
      + '&state=gcal'
      + '&prompt=consent';
    location.href = url;
  };

  window.gcalDisconnect = function () {
    set(LS_TOK, null);
    set(LS_EXP, null);
    set(LS_CAL, null);
    return true;
  };

  (function consume() {
    var h = String(location.hash || '');
    if (h.indexOf('access_token=') < 0) return;
    var m = h.match(/access_token=([^&]+)/);
    var x = h.match(/expires_in=([0-9]+)/);
    if (!m) return;
    set(LS_TOK, decodeURIComponent(m[1]));
    set(LS_EXP, String(Date.now() + ((x ? parseInt(x[1], 10) : 3600) * 1000)));
    try { history.replaceState(null, '', location.pathname + location.search); }
    catch (e) { location.hash = ''; }
  })();

  function call(method, path, body) {
    var t = window.gcalToken();
    if (!t) return Promise.reject(new Error('not connected'));
    var opt = { method: method, headers: {
      'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' } };
    if (body) opt.body = JSON.stringify(body);

      if (r.status === 401) { window.gcalDisconnect(); throw new Error('Google sign-in expired'); }
      if (!r.ok) throw new Error('Google Calendar returned ' + r.status);
      if (r.status === 204) return {};
      return r.json();
    });
  }

  window.gcalEnsureCalendar = function () {
    // WRITE TO THE MAIN CALENDAR.
    // A separate "Planner" calendar was tidier but it does not reach the phone:
    // Google does not push secondary calendars to iOS unless they are ticked at
    // calendar.google.com/calendar/syncselect, which nobody knows to do. The
    // events existed and the phone never saw them. The main calendar always
    // syncs, so alarms actually arrive - which matters more than tidiness.
    return Promise.resolve('primary');
  };


  function walk(list, out) {
    if (!list) return;
    var i;
    for (i = 0; i < list.length; i++) {
      var node = list[i];
      out.push(node);
      if (node.children) {
        walk(node.children, out);

    var startMs = window.alarmFireAt ? window.alarmFireAt(n, al) : 0;
    if (!startMs) return null;

    var anchorTime = n.date ? (n.time || '09:00') : (al.time || '09:00');
    if (!anchorDate) return null;

    var s = window.parseISO(anchorDate);
    s.setHours(parseInt(hm[0],10)||0, parseInt(hm[1],10)||0, 0, 0);
    var e = new Date(s.getTime() + (Number(n.duration) || 30) * 60000);
    var lead = Math.max(0, Math.round((s.getTime() - startMs) / 60000));
    function iso(d) {
      function p(v){ return (v<10?'0':'')+v; }
      return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())
           +'T'+p(d.getHours())+':'+p(d.getMinutes())+':00';
    }
    return {
      summary: n.title || 'Task',
      description: n.notes || '',
      start: { dateTime: iso(s) },
      end:   { dateTime: iso(e) },
      reminders: { useDefault: false, overrides: [{ method: 'popup', minutes: lead }] }

  }

    if (!window.gcalConnected()) return Promise.resolve({ ok: false, why: 'not connected' });
    var all = [];
    walk((window.Store && window.Store.data && window.Store.data.tree) || [], all);
    return window.gcalEnsureCalendar().then(function (cal) {
      var jobs = [], made = 0, updated = 0, i;
      for (i = 0; i < all.length; i++) {
        (function (n) {
          var alarms = window.alarmsOf ? window.alarmsOf(n) : [];
          var al = alarms.length ? alarms[0] : null;
          var wanted = (!n.done && al) ? eventFor(n, al) : null;
          if (!wanted) {
            if (n.googleEventId) {
              jobs.push(call('DELETE', '/calendars/' + encodeURIComponent(cal) + '/events/' + n.googleEventId)
                .then(function () { n.googleEventId = null; }, function () {}));
            }
            return;
          }
          if (n.googleEventId) {
            jobs.push(call('PUT', '/calendars/' + encodeURIComponent(cal) + '/events/' + n.googleEventId, wanted)
              .then(function () { updated++; },
                    function () { n.googleEventId = null; }));
          } else {
            jobs.push(call('POST', '/calendars/' + encodeURIComponent(cal) + '/events', wanted)
              .then(function (ev) { n.googleEventId = ev.id; made++; }, function () {}));
          }
        })(all[i]);
      }
      return Promise.all(jobs).then(function () {
        try { window.Store.save(); } catch (e) {}
        return { ok: true, created: made, updated: updated };
      });
    });
  };
})();
