<script>
/* ===== m117 sign-in link ===== */
/* Sign-in link. The token travels in the URL FRAGMENT, which browsers never
   send to any server - so it never reaches GitHub's logs or anyone else's.
   It is read and wiped from the address bar on the first line of script that
   runs, before anything async can widen the window. */
(function () {
  var LS = 'planner.gh.token';
  var SS_ONLY = 'planner.gh.sessiononly';

  // Runs FIRST, synchronously. Anything async here leaves the token sitting in
  // the address bar for longer than it has to.
  (function consume() {
    var h = String(location.hash || '');
    var m = h.match(/[#&]k=([^&]+)/);
    if (!m) return;
    var tok = '';
    try { tok = decodeURIComponent(m[1]); } catch (e) { tok = m[1]; }
    if (!tok) return;
    var shared = /[#&]s=1/.test(h);
    try {
      if (shared) {
        sessionStorage.setItem(LS, tok);
        localStorage.setItem(SS_ONLY, '1');
      } else {
        localStorage.setItem(LS, tok);
        localStorage.removeItem(SS_ONLY);
      }
    } catch (e) {}
    try {
      history.replaceState(null, '', location.pathname + location.search);
    } catch (e) { location.hash = ''; }
  })();

  // A token put there by a sign-in link on a shared computer lives in
  // sessionStorage and disappears when the tab closes.
  window.plannerToken = function () {
    try {
      var s = sessionStorage.getItem(LS);
      if (s) return s;
    } catch (e) {}
    try { return localStorage.getItem(LS) || ''; } catch (e) { return ''; }
  };

  window.plannerSignInLink = function (shared) {
    var t = window.plannerToken ? window.plannerToken() : '';
    if (!t) return '';
    var base = location.origin + location.pathname;
    return base + '#k=' + encodeURIComponent(t) + (shared ? '&s=1' : '');
  };
})();


'use strict';

/* ===== o04 ===== */
(function() {
  "use strict";

  // ============================================
  // HELPERS
  // ============================================

  window.uid = function() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 11);
  };

  window.todayISO = function() {
    const d = new Date();
    return window.isoOf(d);
  };

  window.isoOf = function(dateObj) {
    const d = dateObj || new Date();
    const y = d.getFullYear();
    const mo = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + mo + '-' + day;
  };

  window.parseISO = function(s) {
    if (!s) return null;
    return new Date(s + 'T00:00:00');
  };

  window.fmtDate = function(s, style) {
    if (!s) return '';
    const d = window.parseISO(s);
    if (!d || isNaN(d.getTime())) return '';
    if (style === 'long') {
      return d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    if (style === 'short') {
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }
    if (style === 'month') {
      return d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    }
    return d.toLocaleDateString();
  };

  window.toast = function(msg, kind) {
    kind = kind || 'ok';
    const host = document.getElementById('toast');
    if (!host) return;
    const t = document.createElement('div');
    t.className = 'toast toast-' + kind;
    t.textContent = msg;
    host.appendChild(t);
    setTimeout(function() {
      if (t.parentNode) t.parentNode.removeChild(t);
    }, 3000);
  };

  window.el = function(tag, attrs, children) {
    const e = document.createElement(tag);
    if (!attrs) attrs = {};
    for (var key in attrs) {
      if (!attrs.hasOwnProperty(key)) continue;
      var val = attrs[key];
      if (key === 'className') {
        e.className = val;
      } else if (key === 'text') {
        e.textContent = val;
      } else if (key === 'html') {
        e.innerHTML = val;
      } else if (key === 'dataset') {
        for (var dk in val) {
          if (val.hasOwnProperty(dk)) e.dataset[dk] = val[dk];
        }
      } else if (key === 'style' && typeof val === 'object') {
        for (var sk in val) {
          if (val.hasOwnProperty(sk)) e.style[sk] = val[sk];
        }
      } else if (key.slice(0, 2) === 'on') {
        e.addEventListener(key.slice(2).toLowerCase(), val);
      } else {
        e.setAttribute(key, val);
      }
    }
    if (children != null) {
      if (Array.isArray(children)) {
        children.forEach(function(c) {
          if (c == null) return;
          if (typeof c === 'string') {
            e.appendChild(document.createTextNode(c));
          } else {
            e.appendChild(c);
          }
        });
      } else if (typeof children === 'string') {
        e.appendChild(document.createTextNode(children));
      } else {
        e.appendChild(children);
      }
    }
    return e;
  };

  window.debounce = function(fn, ms) {
    var timer;
    return function() {
      var args = Array.prototype.slice.call(arguments);
      clearTimeout(timer);
      timer = setTimeout(function() {
        fn.apply(null, args);
      }, ms);
    };
  };

  // ============================================
  // STORE
  // ============================================

  var STORAGE_KEY = 'planner.data.v1';
  var STORAGE_CORRUPT_KEY = 'planner.data.v1.corrupt';
  var listeners = [];

  var DEFAULT_DATA = {
    version: 1,
    updatedAt: new Date().toISOString(),
    tree: [],
    events: [],
    journal: {},
    habits: [],
    habitLog: {},
    settings: {
      theme: 'auto',
      weekStart: 0
    }
  };

  function deepMerge(target, source) {
    if (source == null) return target;
    if (typeof source !== 'object') return source;
    if (Array.isArray(source)) return source;

    var result = {};
    for (var k in target) {
      if (target.hasOwnProperty(k)) {
        if (source.hasOwnProperty(k)) {
          result[k] = deepMerge(target[k], source[k]);
        } else {
          result[k] = target[k];
        }
      }
    }
    for (var j in source) {
      if (source.hasOwnProperty(j) && !result.hasOwnProperty(j)) {
        result[j] = source[j];
      }
    }
    return result;
  }

  window.Store = {
    data: null,

    load: function() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try {
            var parsed = JSON.parse(raw);
            var merged = deepMerge(JSON.parse(JSON.stringify(DEFAULT_DATA)), parsed);
            this.data = merged;
            this.data.version = DEFAULT_DATA.version;
          } catch (e) {
            try {
              localStorage.setItem(STORAGE_CORRUPT_KEY, raw);
            } catch (se) {
              console.warn('Could not save corrupt data:', se);
            }
            this.data = deepMerge(JSON.parse(JSON.stringify(DEFAULT_DATA)), { tree: [] });
            window.toast('Saved data was corrupt. Backed it up and started fresh.', 'warn');
          }
        } else {
          this.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
        }
      } catch (err) {
        console.error('Store load error:', err);
        this.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
        window.toast('Could not load saved data. Using defaults.', 'err');
      }
    },

    save: window.debounce(function() {
      if (!Store.data) return;
      Store.data.updatedAt = new Date().toISOString();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data));
        Store.emit();
        if (window.Cloud && typeof Cloud.connected === 'function' && Cloud.connected()) {
          Cloud.push();
        }
      } catch (e) {
        console.error('Store save error:', e);
        window.toast('Could not save data.', 'err');
      }
    }, 800),

    flush: function() {
      if (!this.data) return;
      this.data.updatedAt = new Date().toISOString();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
        this.emit();
        if (window.Cloud && typeof Cloud.connected === 'function' && Cloud.connected()) {
          Cloud.push();
        }
      } catch (e) {
        console.error('Store flush error:', e);
      }
    },

    onChange: function(cb) {
      if (typeof cb === 'function') {
        listeners.push(cb);
      }
    },

    emit: function() {
      for (var i = 0; i < listeners.length; i++) {
        try {
          listeners[i]();
        } catch (e) {
          console.error('Listener error:', e);
        }
      }
    },

    exportJson: function() {
      if (!this.data) return;
      var json = JSON.stringify(this.data, null, 2);
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'planner-' + window.todayISO() + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      window.toast('Exported successfully.', 'ok');
    },

    importJson: function(file) {
      var reader = new FileReader();
      var self = this;
      reader.onload = function(e) {
        try {
          var parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.tree)) {
            window.toast('Invalid file: missing tree array.', 'err');
            return;
          }
          if (!confirm('This will replace ALL your data with the imported file. Are you sure?')) {
            return;
          }
          self.data = deepMerge(JSON.parse(JSON.stringify(DEFAULT_DATA)), parsed);
          self.data.version = DEFAULT_DATA.version;
          self.save();
          if (typeof window.renderAll === 'function') {
            window.renderAll();
          }
          window.toast('Imported successfully.', 'ok');
        } catch (err) {
          console.error('Import error:', err);
          window.toast('Failed to parse the file.', 'err');
        }
      };
      reader.onerror = function() {
        window.toast('Failed to read the file.', 'err');
      };
      reader.readAsText(file);
    },

    reset: function() {
      if (!confirm('Are you sure you want to reset? This cannot be undone.')) {
        return;
      }
      if (!confirm('This will delete ALL your data permanently. Type "yes" in the next prompt to confirm.\n\n(Or just click OK to cancel.)')) {
        return;
      }
      localStorage.removeItem(STORAGE_KEY);
      this.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
      this.save();
      if (typeof window.renderAll === 'function') {
        window.renderAll();
      }
      window.toast('All data has been reset.', 'ok');
    }
  };

  window.addEventListener('beforeunload', function() {
    if (window.Store && window.Store.data) {
      window.Store.flush();
    }
  });

})();

/* ===== o05 ===== */
/* ============================================================
 * Cloud sync -- OneDrive (Microsoft Graph) via OAuth 2.0 + PKCE.
 * Hand-rolled, no MSAL, no external libraries, no CDN.
 *
 * CLIENT_ID comes from an Azure portal app registration:
 *   1. portal.azure.com -> Microsoft Entra ID -> App registrations
 *      -> New registration. Name it "Planner".
 *   2. Supported account types: "Personal Microsoft accounts only".
 *   3. Authentication -> Mobile and desktop applications -> add
 *      a redirect URI that matches the origin of this page.
 *   4. API permissions -> add delegated Files.ReadWrite.AppFolder,
 *      offline_access, User.Read. Grant consent if required.
 *   5. Copy the "Application (client) ID" and paste it below.
 *
 * Until CLIENT_ID is replaced, the app runs local-only and signIn()
 * opens an explanatory modal instead of touching the network.
 * ============================================================ */

const CLIENT_ID = "PASTE_YOUR_CLIENT_ID_HERE";

const AUTHORITY   = "https://login.microsoftonline.com/consumers/oauth2/v2.0";
const SCOPES      = "Files.ReadWrite.AppFolder offline_access User.Read";
const GRAPH_BASE  = "https://graph.microsoft.com/v1.0";
const REMOTE_FILE = "planner.json";
const AUTH_KEY    = "planner.auth";
const PKCE_KEY    = "planner.pkce.verifier";
const STATE_KEY   = "planner.oauth.state";

/* ---------- tiny helpers (depend only on web platform) ---------- */

function _b64url(bytes) {
  let s = "";
  const arr = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  for (let i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function _b64urlDecode(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function _utf8(str) { return new TextEncoder().encode(str); }

function _redirectUri() {
  return location.origin + location.pathname;
}

function _isConfigured() {
  return typeof CLIENT_ID === "string"
      && CLIENT_ID.length > 0
      && CLIENT_ID !== "PASTE_YOUR_CLIENT_ID_HERE";
}

function _readAuth() {
  try {
    const raw = localStorage.getItem(AUTH_KEY);
    if (!raw) return null;
    const a = JSON.parse(raw);
    if (!a || typeof a !== "object") return null;
    return a;
  } catch (e) { return null; }
}

function _writeAuth(a) {
  try {
    if (a) localStorage.setItem(AUTH_KEY, JSON.stringify(a));
    else   localStorage.removeItem(AUTH_KEY);
  } catch (e) { /* storage may be unavailable in private modes */ }
}

/* ---------- the public Cloud object ---------- */

window.Cloud = {
  CLIENT_ID,

  state: "offline",

  signIn() {
    if (!_isConfigured()) { this._showSetupModal(); return; }
    try {
      const verifier = _b64url(crypto.getRandomValues(new Uint8Array(32)));
      const state    = _b64url(crypto.getRandomValues(new Uint8Array(16)));
      sessionStorage.setItem(PKCE_KEY,  verifier);
      sessionStorage.setItem(STATE_KEY, state);

      const challengeP = crypto.subtle.digest("SHA-256", _utf8(verifier));
      this.setState("connecting");

      challengeP.then(challenge => {
        const url = new URL(AUTHORITY + "/authorize");
        url.searchParams.set("client_id",             CLIENT_ID);
        url.searchParams.set("response_type",         "code");
        url.searchParams.set("redirect_uri",          _redirectUri());
        url.searchParams.set("scope",                 SCOPES);
        url.searchParams.set("state",                 state);
        url.searchParams.set("code_challenge",        _b64url(new Uint8Array(challenge)));
        url.searchParams.set("code_challenge_method", "S256");
        url.searchParams.set("response_mode",         "query");
        url.searchParams.set("prompt",                "select_account");
        try { location.assign(url.toString()); }
        catch (e) {
          this.setState("error");
          toast("Could not redirect to Microsoft: " + e.message, "err");
        }
      }).catch(err => {
        this.setState("error");
        toast("Could not start sign-in: " + err.message, "err");
      });
    } catch (err) {
      this.setState("error");
      toast("Could not start sign-in: " + err.message, "err");
    }
  },

  signOut() {
    _writeAuth(null);
    sessionStorage.removeItem(PKCE_KEY);
    sessionStorage.removeItem(STATE_KEY);
    this.setState("offline");
    toast("Signed out", "ok");
  },

  connected() {
    if (!_isConfigured()) return false;
    const a = _readAuth();
    return !!(a && a.refresh_token);
  },

  async handleRedirect() {
    if (!_isConfigured()) return;
    const params = new URLSearchParams(location.search);
    if (!params.has("code") && !params.has("error")) return;

    const code     = params.get("code");
    const error    = params.get("error");
    const state    = params.get("state");
    const errDesc  = params.get("error_description");

    // Strip the query immediately so a reload does not replay it.
    const clean = location.origin + location.pathname + location.hash;
    try { history.replaceState(null, "", clean); } catch (e) { /* ignore */ }

    if (error) {
      sessionStorage.removeItem(PKCE_KEY);
      sessionStorage.removeItem(STATE_KEY);
      this.setState("error");
      toast(errDesc || error, "err");
      return;
    }

    const savedState = sessionStorage.getItem(STATE_KEY);
    const verifier   = sessionStorage.getItem(PKCE_KEY);
    sessionStorage.removeItem(STATE_KEY);
    sessionStorage.removeItem(PKCE_KEY);

    if (!savedState || state !== savedState) {
      this.setState("error");
      toast("Sign-in state mismatch", "err");
      return;
    }
    if (!verifier) {
      this.setState("error");
      toast("Missing PKCE verifier -- please try again", "err");
      return;
    }

    try {
      const body = new URLSearchParams({
        client_id:     CLIENT_ID,
        grant_type:    "authorization_code",
        code:          code,
        redirect_uri:  _redirectUri(),
        code_verifier: verifier
      });
      const resp = await fetch(AUTHORITY + "/token", {
        method:  "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body:    body.toString()
      });
      const text = await resp.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
      if (!resp.ok || !data || !data.access_token) {
        this.setState("error");
        toast((data && (data.error_description || data.error)) || ("Token exchange failed (" + resp.status + ")"), "err");
        return;
      }
      const existing = _readAuth() || {};
      const auth = {
        access_token:  data.access_token,
        refresh_token: data.refresh_token || existing.refresh_token || null,
        expires_at:    Date.now() + ((data.expires_in || 3600) * 1000)
      };
      _writeAuth(auth);
      this.setState("synced");
      toast("Signed in", "ok");
    } catch (err) {
      this.setState("error");
      toast("Sign-in failed: " + err.message, "err");
    }
  },

  async token() {
    const a = _readAuth();
    if (!a || !a.access_token) return null;
    const freshUntil = (a.expires_at || 0) - 120000;
    if (Date.now() < freshUntil) return a.access_token;
    if (!a.refresh_token) {
      _writeAuth(null);
      this.setState("offline");
      return null;
    }
    try {
      const body = new URLSearchParams({
        client_id:     CLIENT_ID,
        grant_type:    "refresh_token",
        refresh_token: a.refresh_token,
        scope:         SCOPES
      });
      const resp = await fetch(AUTHORITY + "/token", {
        method:  "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body:    body.toString()
      });
      const text = await resp.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
      if (!resp.ok || !data || !data.access_token) {
        _writeAuth(null);
        this.setState("offline");
        toast("Signed out - tap Sign in to reconnect", "warn");
        return null;
      }
      const next = {
        access_token:  data.access_token,
        refresh_token: data.refresh_token || a.refresh_token,
        expires_at:    Date.now() + ((data.expires_in || 3600) * 1000)
      };
      _writeAuth(next);
      this.setState("synced");
      return next.access_token;
    } catch (err) {
      _writeAuth(null);
      this.setState("error");
      toast("Token refresh failed: " + err.message, "err");
      return null;
    }
  },

  async pull() {
    if (!_isConfigured()) return null;
    if (!this.connected()) return null;
    this.setState("syncing");
    try {
      const tok = await this.token();
      if (!tok) { this.setState("offline"); return null; }
      const url = GRAPH_BASE + "/me/drive/special/approot:/" + encodeURIComponent(REMOTE_FILE) + ":/content";
      const resp = await fetch(url, { headers: { Authorization: "Bearer " + tok } });
      if (resp.status === 404) {
        // No remote file yet; first push will create it.
        this.setState("synced");
        return null;
      }
      if (!resp.ok) {
        this.setState("error");
        toast("Pull failed (" + resp.status + ")", "err");
        return null;
      }
      const text = await resp.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
      this.setState("synced");
      return data;
    } catch (err) {
      this.setState("error");
      toast("Pull failed: " + err.message, "err");
      return null;
    }
  },

  async push() {
    if (!_isConfigured()) return;
    if (!this.connected()) return;
    if (!window.Store || !window.Store.data) return;
    this.setState("syncing");
    try {
      const tok = await this.token();
      if (!tok) { this.setState("offline"); return; }
      const body = JSON.stringify(window.Store.data);
      const url = GRAPH_BASE + "/me/drive/special/approot:/" + encodeURIComponent(REMOTE_FILE) + ":/content";
      const resp = await fetch(url, {
        method:  "PUT",
        headers: {
          Authorization: "Bearer " + tok,
          "Content-Type": "application/json"
        },
        body: body
      });
      if (!resp.ok) {
        this.setState("error");
        toast("Push failed (" + resp.status + ")", "err");
        return;
      }
      this.setState("synced");
    } catch (err) {
      this.setState("error");
      toast("Push failed: " + err.message, "err");
    }
  },

  setState(s) {
    this.state = s;
    const labels = {
      offline:    "Local only",
      connecting: "Signing in",
      syncing:    "Syncing",
      synced:     "Synced",
      error:      "Sync error"
    };
    const pill = document.getElementById("syncPill");
    if (pill) {
      pill.dataset.state = s;
      pill.textContent = labels[s] || s;
    }
    const btn = document.getElementById("btnSignIn");
    if (btn) {
      btn.textContent = this.connected() ? "Sign out" : "Sign in";
    }
  },

  _showSetupModal() {
    const host = document.getElementById("modalHost");
    if (!host) return;
    if (host.querySelector(".modal-overlay")) return;

    const overlay = el("div", "modal-overlay");
    const dialog  = el("div",  "modal");
    const title   = el("h2",   "", "Cloud sync not configured");
    const intro   = el("p",    "",
      "To enable cloud sync, register an app in the Azure portal and paste its Application (client) ID into the source file where CLIENT_ID is defined.");
    const steps   = el("ol");
    [
      "Azure portal -> Microsoft Entra ID -> App registrations -> New registration.",
      "Supported account types: Personal Microsoft accounts only.",
      "Authentication -> Mobile and desktop applications -> add a redirect URI matching this page.",
      "API permissions -> add delegated Files.ReadWrite.AppFolder, offline_access, User.Read.",
      "Copy the Application (client) ID and paste it into the CLIENT_ID constant."
    ].forEach(text => steps.appendChild(el("li", "", text)));
    const codeLine = el("pre", "", "const CLIENT_ID = \"PASTE_YOUR_CLIENT_ID_HERE\";");
    const note     = el("p", "",
      "Until then your data stays on this device. Nothing is lost.");
    const close    = el("button", "btn primary", "Close");

    const dismiss = () => {
      if (overlay.parentNode === host) host.removeChild(overlay);
      document.removeEventListener("keydown", onKey);
    };
    const onKey = (ev) => { if (ev.key === "Escape") dismiss(); };

    close.addEventListener("click", dismiss);
    overlay.addEventListener("click", (ev) => { if (ev.target === overlay) dismiss(); });
    document.addEventListener("keydown", onKey);

    dialog.append(title, intro, codeLine, steps, note, close);
    overlay.appendChild(dialog);
    host.appendChild(overlay);
    setTimeout(() => { try { close.focus(); } catch (e) { /* ignore */ } }, 0);
  }
};

/* ---------- boot-time wiring ---------- */

(function _cloudBoot() {
  const c = window.Cloud;
  if (!_isConfigured()) { c.setState("offline"); return; }
  const a = _readAuth();
  c.setState(a && a.refresh_token ? "synced" : "offline");
  // Handle the response if we just came back from Microsoft.
  c.handleRedirect();
})();

/* ===== o06 ===== */
Object.assign(window.Cloud, {
  GRAPH_BASE: "https://graph.microsoft.com/v1.0/me/drive/special/approot:",
  DATA_PATH: "https://graph.microsoft.com/v1.0/me/drive/special/approot:/planner.json:/content",
  META_PATH: "https://graph.microsoft.com/v1.0/me/drive/special/approot:/planner.json",
  BACKUP_PATH: "https://graph.microsoft.com/v1.0/me/drive/special/approot:/planner.bak.json:/content",
  lastETag: null,
  _syncTimer: null,
  _intervalId: null,

  async pull(refreshed = false) {
    if (!this.connected()) return;
    const token = this.token();
    if (!token) return;

    try {
      const res = await fetch(this.DATA_PATH, {
        headers: { Authorization: `Bearer ${token}` }
      });

      if (res.status === 401) {
        if (!refreshed) {
          const ok = await this.refreshToken();
          if (ok) return this.pull(true);
        }
        this.setState("error");
        return;
      }

      if (res.status === 404) {
        await this.push();
        return;
      }

      if (!res.ok) {
        this.setState("error");
        return;
      }

      const etag = res.headers.get("ETag");
      if (etag) this.lastETag = etag.replace(/"/g, "");

      const remote = await res.json();
      const remoteTime = remote.updatedAt ? new Date(remote.updatedAt).getTime() : 0;
      const localTime = Store.data.updatedAt ? new Date(Store.data.updatedAt).getTime() : 0;

      if (remoteTime > localTime) {
        Store.data = remote;
        Store.save();
        if (typeof window.renderAll === "function") window.renderAll();
      }

      this.setState("synced");
    } catch (err) {
      console.error("Cloud pull error:", err);
      this.setState("error");
    }
  },

  async push(refreshed = false) {
    if (!this.connected()) return;
    const token = this.token();
    if (!token) return;

    try {
      await fetch(this.BACKUP_PATH, {
        method: "PUT",
        headers: {
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(Store.data)
      });
    } catch (_) { }

    const headers = {
      Authorization: `Bearer ${token}`,
      "Content-Type": "application/json"
    };

    if (this.lastETag) {
      headers["If-Match"] = this.lastETag;
    }

    const res = await fetch(this.DATA_PATH, {
      method: "PUT",
      headers,
      body: JSON.stringify(Store.data)
    });

    if (res.status === 401) {
      if (!refreshed) {
        const ok = await this.refreshToken();
        if (ok) return this.push(true);
      }
      this.setState("error");
      return;
    }

    if (res.status === 412) {
      if (typeof window.showConflict === "function") {
        try {
          const remoteRes = await fetch(this.DATA_PATH, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (remoteRes.ok) {
            const remoteData = await remoteRes.json();
            window.showConflict(remoteData);
          }
        } catch (_) { }
      }
      return;
    }

    if (!res.ok) {
      this.setState("error");
      return;
    }

    const etag = res.headers.get("ETag");
    if (etag) this.lastETag = etag.replace(/"/g, "");

    this.setState("synced");
  },

  _debouncedPush() {
    if (this._syncTimer) clearTimeout(this._syncTimer);
    this._syncTimer = setTimeout(() => {
      this.push();
    }, 2500);
  },

  start() {
    if (!this.connected()) return;
    if (this._intervalId) return;

    this.pull();

    this._intervalId = setInterval(() => {
      if (document.visibilityState === "visible") {
        this.pull();
      }
    }, 60000);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        this.pull();
      }
    });
  }
});

(function() {
  'use strict';

  function findNode(id, nodes, parent, depth) {
    nodes = nodes || Store.data.tree;
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      if (node.id === id) {
        return { node: node, parent: parent, index: i, depth: depth || 0 };
      }
      if (node.children && node.children.length) {
        var found = findNode(id, node.children, node, (depth || 0) + 1);
        if (found) return found;
      }
    }
    return null;
  }
  window.findNode = findNode;

  function walkTree(cb, nodes, depth, parent) {
    nodes = nodes || Store.data.tree;
    depth = depth || 0;
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      cb(node, depth, parent);
      if (node.children && node.children.length) {
        walkTree(cb, node.children, depth + 1, node);
      }
    }
  }
  window.walkTree = walkTree;

  function removeNode(id) {
    var found = findNode(id);
    if (!found) return null;
    var node = found.node;
    var parent = found.parent;
    var index = found.index;
    var siblings = parent ? parent.children : Store.data.tree;
    siblings.splice(index, 1);
    return node;
  }
  window.removeNode = removeNode;

  function isDescendant(ancestorId, maybeChildId) {
    var ancestor = findNode(ancestorId);
    if (!ancestor) return false;
    var found = findNode(maybeChildId, ancestor.node.children, ancestor.node, ancestor.depth + 1);
    return found !== null;
  }
  window.isDescendant = isDescendant;

  function kindForDepth(d) {
    if (d === 0) return 'goal';
    if (d === 1) return 'milestone';
    return 'task';
  }
  window.kindForDepth = kindForDepth;

  function buildDateChip(node) {
    var btn = document.createElement('button');
    btn.className = 'tree-datechip';
    if (node.date) {
      btn.textContent = fmtDate(node.date, 'short');
    } else {
      var plus = document.createElement('span');
      plus.className = 'datechip-plus';
      plus.textContent = '+ date';
      btn.appendChild(plus);
    }
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var inp = document.createElement('input');
      inp.type = 'date';
      inp.value = node.date || '';
      inp.className = 'tree-dateinput';
      btn.replaceWith(inp);
      inp.focus();
      inp.showPicker && inp.showPicker();
      inp.addEventListener('change', function() {
        node.date = inp.value || null;
        if (!node.date) node.block = null;
        Store.save();
        window.renderAll();
      });
      inp.addEventListener('blur', function() {
        if (!inp.value && !node.date) {
          node.date = null;
          Store.save();
          window.renderAll();
        }
      });
      inp.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          inp.value = '';
          node.date = null;
          Store.save();
          window.renderAll();
        }
      });
    });
    return btn;
  }

  function buildActionButtons(node) {
    var actions = document.createElement('div');
    actions.className = 'tree-actions';

    var addBtn = document.createElement('button');
    addBtn.className = 'btn-icon';
    addBtn.title = 'Add child';
    addBtn.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" fill="none"/></svg>';
    addBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      window.addNodeAt(node.id);
    });

    var prioBtn = document.createElement('button');
    prioBtn.className = 'btn-icon';
    prioBtn.title = node.priority === 'high' ? 'Set normal priority' : 'Set high priority';
    prioBtn.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 2l2 6h6l-5 4 2 6-5-4-5 4 2-6-5-4h6z"/></svg>';
    prioBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      node.priority = node.priority === 'high' ? 'normal' : 'high';
      Store.save();
      window.renderTree();
    });

    var delBtn = document.createElement('button');
    delBtn.className = 'btn-icon btn-danger';
    delBtn.title = 'Delete';
    delBtn.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M5 2V1h6v1h4v2H1V2h4zm1 4v8h1V6H6zm3 0v8h1V6H9z"/></svg>';
    delBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      var hasChildren = node.children && node.children.length > 0;
      if (hasChildren) {
        if (!confirm('Delete "' + node.title + '" and all its children?')) return;
      }
      removeNode(node.id);
      Store.save();
      window.renderAll();
    });

    actions.appendChild(addBtn);
    actions.appendChild(prioBtn);
    actions.appendChild(delBtn);
    return actions;
  }

  function buildTreeRow(node, depth, searchMode, ancestorOfMatch) {
    var row = document.createElement('div');
    row.className = 'tree-row';
    row.dataset.id = node.id;
    row.draggable = true;
    row.style.paddingLeft = (depth * 18 + 6) + 'px';

    if (node.done) row.classList.add('done');
    if (node.priority === 'high') row.classList.add('high');

    var caret = null;
    if (node.children && node.children.length) {
      caret = document.createElement('button');
      caret.className = 'tree-caret' + (node.collapsed ? '' : ' open');
      caret.innerHTML = '<svg viewBox="0 0 16 16" width="12" height="12"><path fill="currentColor" d="M5 4l6 6-6 6z"/></svg>';
      caret.addEventListener('click', function(e) {
        e.stopPropagation();
        node.collapsed = !node.collapsed;
        Store.save();
        window.renderTree();
      });
    }

    var check = document.createElement('input');
    check.type = 'checkbox';
    check.className = 'tree-check';
    check.checked = node.done;
    check.addEventListener('change', function() {
      var setDone = function(n, val) {
        n.done = val;
        if (n.children) n.children.forEach(function(c) { setDone(c, val); });
      };
      setDone(node, check.checked);
      Store.save();
      window.renderAll();
    });
    check.addEventListener('click', function(e) { e.stopPropagation(); });

    var titleSpan = document.createElement('span');
    titleSpan.className = 'tree-title';
    titleSpan.contentEditable = 'plaintext-only';
    titleSpan.textContent = node.title;
    titleSpan.spellcheck = false;

    var prevTitle = node.title;
    titleSpan.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        titleSpan.blur();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        titleSpan.textContent = prevTitle;
        titleSpan.blur();
      }
      e.stopPropagation();
    });
    titleSpan.addEventListener('blur', function() {
      var trimmed = titleSpan.textContent.trim();
      if (trimmed === '') {
        if (node.title === '' && !node.notes && !node.date) {
          removeNode(node.id);
          Store.save();
          window.renderTree();
          return;
        }
        trimmed = node.title;
        titleSpan.textContent = trimmed;
        return;
      }
      if (trimmed !== node.title) {
        node.title = trimmed;
        Store.save();
      }
      prevTitle = trimmed;
    });
    titleSpan.addEventListener('paste', function(e) {
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text);
    });

    var dateChip = buildDateChip(node);
    var actions = buildActionButtons(node);

    if (caret) row.appendChild(caret);
    row.appendChild(check);
    row.appendChild(titleSpan);
    row.appendChild(dateChip);
    row.appendChild(actions);

    return row;
  }

  function nodeMatchesSearch(node, query) {
    query = query.toLowerCase();
    if (node.title.toLowerCase().indexOf(query) !== -1) return true;
    if ((node.notes || '').toLowerCase().indexOf(query) !== -1) return true;
    if (node.tags) {
      for (var i = 0; i < node.tags.length; i++) {
        if (node.tags[i].toLowerCase().indexOf(query) !== -1) return true;
      }
    }
    return false;
  }

  function getMatchingNodesAndAncestors(query) {
    var matches = {};
    var ancestors = {};

    walkTree(function(node, depth, parent) {
      if (nodeMatchesSearch(node, query)) {
        matches[node.id] = true;
        var curr = parent;
        while (curr) {
          ancestors[curr.id] = true;
          var p = findNode(curr.id);
          curr = p ? p.parent : null;
        }
      }
    });

    var result = {};
    for (var k in matches) result[k] = true;
    for (var k in ancestors) result[k] = true;
    return result;
  }

  function renderTree() {
    var root = document.getElementById('treeRoot');
    if (!root) return;
    root.innerHTML = '';

    var tree = Store.data.tree;
    var searchQuery = (document.getElementById('treeSearch') || { value: '' }).value.trim();
    var searchMode = searchQuery.length > 0;
    var visibleIds = searchMode ? getMatchingNodesAndAncestors(searchQuery) : null;

    if (!tree || tree.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'tree-empty';
      empty.innerHTML = '<p>No goals yet.</p><p>Click <strong>+ Add Goal</strong> to start planning.</p>';
      root.appendChild(empty);
      return;
    }

    var frag = document.createDocumentFragment();

    function renderNode(node, depth) {
      if (searchMode && !visibleIds[node.id]) return;

      var row = buildTreeRow(node, depth, searchMode, searchMode && visibleIds[node.id]);
      frag.appendChild(row);

      if (!node.collapsed && node.children && node.children.length) {
        for (var i = 0; i < node.children.length; i++) {
          renderNode(node.children[i], depth + 1);
        }
      }
    }

    for (var i = 0; i < tree.length; i++) {
      renderNode(tree[i], 0);
    }

    root.appendChild(frag);
  }
  window.renderTree = renderTree;

})();

(function () {
  "use strict";

  // ==================== DRAG AND DROP ====================

  var dragInfo = null;

  document.getElementById("treeRoot").addEventListener("dragstart", function (e) {
    var row = e.target.closest(".tree-row");
    if (!row) return;
    var id = row.dataset.id;
    var title = row.querySelector(".tree-title")?.textContent || "";
    e.dataTransfer.setData("application/x-planner-node", id);
    e.dataTransfer.setData("text/plain", title);
    e.dataTransfer.effectAllowed = "move";
    dragInfo = { id: id };
    row.classList.add("dragging");
  }, false);

  document.getElementById("treeRoot").addEventListener("dragend", function (e) {
    var row = e.target.closest(".tree-row");
    if (row) row.classList.remove("dragging");
    dragInfo = null;
    clearDropIndicators();
  }, false);

  document.getElementById("treeRoot").addEventListener("dragleave", function (e) {
    if (!e.relatedTarget || !e.currentTarget.contains(e.relatedTarget)) {
      clearDropIndicators();
    }
  }, false);

  document.getElementById("treeRoot").addEventListener("dragover", function (e) {
    e.preventDefault();
    var row = e.target.closest(".tree-row");
    if (!row || !dragInfo) return;
    var targetId = row.dataset.id;
    if (targetId === dragInfo.id) {
      clearDropIndicators();
      return;
    }
    if (isDescendant(dragInfo.id, targetId)) {
      clearDropIndicators();
      return;
    }
    var rect = row.getBoundingClientRect();
    var y = e.clientY - rect.top;
    var h = rect.height;
    var pct = y / h;
    clearDropIndicators();
    if (pct < 0.25) {
      row.classList.add("drop-before");
    } else if (pct > 0.75) {
      row.classList.add("drop-after");
    } else {
      row.classList.add("drop-into");
    }
  }, false);

  document.getElementById("treeRoot").addEventListener("drop", function (e) {
    e.preventDefault();
    if (!dragInfo) return;
    var targetRow = e.target.closest(".tree-row");
    var draggedId = dragInfo.id;
    clearDropIndicators();
    dragInfo = null;

    var found = findNode(draggedId);
    if (!found) return;
    var node = found.node;

    var parentArr, targetParent;
    if (targetRow) {
      var targetId = targetRow.dataset.id;
      var targetFound = findNode(targetId);
      if (!targetFound) return;
      targetParent = targetFound.parent;
      parentArr = targetParent ? targetParent.children : Store.data.tree;
      var targetIndex = targetFound.index;

      removeNode(draggedId);

      var rect = targetRow.getBoundingClientRect();
      var y = e.clientY - rect.top;
      var h = rect.height;
      var pct = y / h;

      if (pct < 0.25) {
        parentArr.splice(targetIndex, 0, node);
      } else if (pct > 0.75) {
        parentArr.splice(targetIndex + 1, 0, node);
      } else {
        removeNode(draggedId);
        if (!targetFound.node.children) targetFound.node.children = [];
        targetFound.node.children.push(node);
        targetFound.node.collapsed = false;
      }
    } else {
      removeNode(draggedId);
      parentArr = Store.data.tree;
      parentArr.push(node);
    }

    Store.save();
    renderAll();
  }, false);

  function clearDropIndicators() {
    var root = document.getElementById("treeRoot");
    var indicators = root.querySelectorAll(".drop-before, .drop-after, .drop-into");
    for (var i = 0; i < indicators.length; i++) {
      indicators[i].classList.remove("drop-before", "drop-after", "drop-into");
    }
  }

  // ==================== KEYBOARD HANDLING ====================

  document.getElementById("treeRoot").addEventListener("keydown", function (e) {
    var titleEl = e.target.closest(".tree-title");
    if (!titleEl) return;
    var row = titleEl.closest(".tree-row");
    if (!row) return;
    var id = row.dataset.id;

    if (e.key === "Tab") {
      e.preventDefault();
      if (e.shiftKey) {
        outdentNode(id);
      } else {
        indentNode(id);
      }
      return;
    }

    if (e.key === "Enter") {
      e.preventDefault();
      var wasEditing = titleEl.getAttribute("contenteditable") === "true";
      if (wasEditing) {
        commitInlineEdit(titleEl);
      }
      addNewSibling(id);
      return;
    }

    if (e.key === "Backspace") {
      var titleText = titleEl.textContent.trim();
      if (titleText === "") {
        e.preventDefault();
        deleteEmptyNode(id);
      }
      return;
    }
  }, false);

  function indentNode(id) {
    var found = findNode(id);
    if (!found || !found.parent) return;
    var siblings = found.parent.children;
    var idx = found.index;
    if (idx === 0) return;

    var node = siblings.splice(idx, 1)[0];
    var newParent = siblings[idx - 1];
    if (!newParent.children) newParent.children = [];
    newParent.children.push(node);
    newParent.collapsed = false;

    Store.save();
    renderAll();
    focusNode(id);
  }

  function outdentNode(id) {
    var found = findNode(id);
    if (!found || !found.parent) return;
    var parent = found.parent;
    var node = found.node;
    var siblings = parent.children;
    var idx = found.index;

    siblings.splice(idx, 1);
    var grandParent = findNode(parent.id);
    var targetArr;
    var targetIdx;
    if (grandParent && grandParent.parent) {
      targetArr = grandParent.parent.children;
      targetIdx = grandParent.index + 1;
    } else {
      targetArr = Store.data.tree;
      targetIdx = Store.data.tree.length;
      for (var i = 0; i < Store.data.tree.length; i++) {
        if (Store.data.tree[i].id === parent.id) {
          targetIdx = i + 1;
          break;
        }
      }
    }
    targetArr.splice(targetIdx, 0, node);

    Store.save();
    renderAll();
    focusNode(id);
  }

  function addNewSibling(belowId) {
    var found = findNode(belowId);
    if (!found) return;
    var newNode = {
      id: uid(),
      title: "",
      notes: "",
      kind: found.depth >= 2 ? "task" : (found.depth === 1 ? "milestone" : "goal"),
      done: false,
      priority: "normal",
      date: null,
      block: null,
      duration: null,
      repeat: null,
      tags: [],
      collapsed: false,
      children: []
    };
    var arr = found.parent ? found.parent.children : Store.data.tree;
    var idx = found.index + 1;
    arr.splice(idx, 0, newNode);
    Store.save();
    renderTree();
    focusNode(newNode.id);
  }

  function commitInlineEdit(titleEl) {
    var row = titleEl.closest(".tree-row");
    if (!row) return;
    var id = row.dataset.id;
    var found = findNode(id);
    if (!found) return;
    found.node.title = titleEl.textContent.trim();
    Store.save();
  }

  function deleteEmptyNode(id) {
    var found = findNode(id);
    if (!found) return;
    var siblings = found.parent ? found.parent.children : Store.data.tree;
    var idx = found.index;
    siblings.splice(idx, 1);

    var prevId = null;
    var allRows = document.querySelectorAll(".tree-row");
    for (var i = 0; i < allRows.length; i++) {
      if (allRows[i].dataset.id === id) {
        break;
      }
      var prevRow = allRows[i];
      if (prevRow.offsetParent !== null) {
        prevId = prevRow.dataset.id;
      }
    }

    Store.save();
    renderAll();

    if (prevId) {
      setTimeout(function () {
        focusNodeAtEnd(prevId);
      }, 10);
    }
  }

  function focusNode(id) {
    setTimeout(function () {
      var row = document.querySelector('.tree-row[data-id="' + id + '"]');
      if (!row) return;
      var title = row.querySelector(".tree-title");
      if (!title) return;
      title.setAttribute("contenteditable", "true");
      title.focus();
      var range = document.createRange();
      range.selectNodeContents(title);
      range.collapse(false);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }, 10);
  }

  function focusNodeAtEnd(id) {
    setTimeout(function () {
      var row = document.querySelector('.tree-row[data-id="' + id + '"]');
      if (!row) return;
      var title = row.querySelector(".tree-title");
      if (!title) return;
      title.focus();
      var range = document.createRange();
      range.selectNodeContents(title);
      range.collapse(false);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }, 10);
  }

  // ==================== ADD NODE ====================

  window.addNodeAt = function (parentId) {
    var depth = 0;
    if (parentId) {
      var pf = findNode(parentId);
      if (pf) depth = pf.depth + 1;
    }
    var kind = depth >= 2 ? "task" : (depth === 1 ? "milestone" : "goal");

    var newNode = {
      id: uid(),
      title: "",
      notes: "",
      kind: kind,
      done: false,
      priority: "normal",
      date: null,
      block: null,
      duration: null,
      repeat: null,
      tags: [],
      collapsed: false,
      children: []
    };

    if (parentId) {
      var pf = findNode(parentId);
      if (pf && pf.node) {
        pf.node.collapsed = false;
        if (!pf.node.children) pf.node.children = [];
        pf.node.children.push(newNode);
      }
    } else {
      Store.data.tree.push(newNode);
    }

    Store.save();
    renderTree();
    focusNode(newNode.id);
  };

  var btnAddGoal = document.getElementById("btnAddGoal");
  if (btnAddGoal) {
    btnAddGoal.addEventListener("click", function () {
      window.addNodeAt(null);
    });
  }

  // ==================== SCHEDULED ON ====================

  window.scheduledOn = function (dateISO) {
    var result = [];
    var dateObj = parseISO(dateISO);
    if (!dateObj) return result;
    var dow = dateObj.getDay();

    walkTree(function (node) {
      if (node.date === dateISO) {
        result.push({
          id: node.id,
          title: node.title,
          kind: node.kind,
          priority: node.priority,
          done: node.done,
          block: node.block,
          duration: node.duration,
          source: "tree",
          node: node,
          event: null,
          instanceDate: null
        });
      }

      if (node.repeat) {
        var rule = node.repeat;
        var baseDate = node.date ? parseISO(node.date) : null;
        var until = rule.until ? parseISO(rule.until) : null;

        if (baseDate) {
          var match = false;
          var dateNum = dateObj.getFullYear() * 10000 + (dateObj.getMonth() + 1) * 100 + dateObj.getDate();
          var baseNum = baseDate.getFullYear() * 10000 + (baseDate.getMonth() + 1) * 100 + baseDate.getDate();

          if (dateNum >= baseNum) {
            if (until) {
              var untilNum = until.getFullYear() * 10000 + (until.getMonth() + 1) * 100 + until.getDate();
              if (dateNum > untilNum) match = false;
            }

            if (match !== false) {
              if (rule.freq === "daily") {
                match = true;
              } else if (rule.freq === "weekly") {
                if (rule.days && rule.days.indexOf(dow) !== -1) {
                  match = true;
                }
              } else if (rule.freq === "monthly") {
                if (dateObj.getDate() === baseDate.getDate()) {
                  match = true;
                }
              }
            }
          }

          if (match) {
            var repeatDone = node.repeatDone || {};
            var instDone = !!repeatDone[dateISO];
            result.push({
              id: node.id + "@" + dateISO,
              title: node.title,
              kind: node.kind,
              priority: node.priority,
              done: instDone,
              block: node.block,
              duration: node.duration,
              source: "repeat",
              node: node,
              event: null,
              instanceDate: dateISO
            });
          }
        }
      }
    });

    var events = Store.data.events || [];
    for (var ei = 0; ei < events.length; ei++) {
      var ev = events[ei];
      if (ev.date === dateISO) {
        result.push({
          id: ev.id,
          title: ev.title,
          kind: "event",
          priority: "normal",
          done: false,
          block: ev.block || null,
          duration: ev.duration || null,
          source: "event",
          node: null,
          event: ev,
          instanceDate: null
        });
      }
    }

    var blockOrder = { morning: 0, afternoon: 1, evening: 2 };
    result.sort(function (a, b) {
      var ba = a.block ? blockOrder[a.block] : 3;
      var bb = b.block ? blockOrder[b.block] : 3;
      if (ba !== bb) return ba - bb;
      if (a.priority === "high" && b.priority !== "high") return -1;
      if (b.priority === "high" && a.priority !== "high") return 1;
      var at = a.title || "";
      var bt = b.title || "";
      return at.localeCompare(bt);
    });

    return result;
  };

  window.setInstanceDone = function (entry, done) {
    if (entry.source === "repeat" && entry.node) {
      var node = entry.node;
      if (!node.repeatDone) node.repeatDone = {};
      node.repeatDone[entry.instanceDate] = done;
      Store.save();
    } else if (entry.source === "tree" && entry.node) {
      entry.node.done = done;
      Store.save();
    }
  };

  // ==================== ENSURE isDescendant EXISTS ====================
  // This is referenced but may be defined in a separate part
  // If not defined, provide a fallback implementation
  if (typeof window.isDescendant !== "function") {
    window.isDescendant = function (ancestorId, nodeId) {
      var found = findNode(ancestorId);
      if (!found) return false;
      var result = false;
      walkTree(function (node, depth, parent) {
        if (node.id === nodeId && parent && parent.id === ancestorId) {
          result = true;
        }
        if (node.id === ancestorId) {
          var ancFound = findNode(nodeId);
          if (ancFound && ancFound.parent) {
            var check = ancFound.parent;
            while (check) {
              if (check.id === ancestorId) {
                result = true;
                break;
              }
              var p = findNode(check.id);
              check = p && p.parent ? p.parent : null;
            }
          }
        }
      });
      return result;
    };
  }

})();

window.renderMonth = function () {
  const grid = document.getElementById("monthGrid");
  while (grid.firstChild) grid.removeChild(grid.firstChild);

  const weekStart =
    Store.data.settings && [0, 1].includes(Store.data.settings.weekStart)
      ? Store.data.settings.weekStart
      : 0;
  const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const orderedDays = dayNames.slice(weekStart).concat(dayNames.slice(0, weekStart));

  const headerRow = document.createElement("div");
  headerRow.className = "mheader";
  orderedDays.forEach(function (label) {
    const th = document.createElement("div");
    th.className = "mhead";
    th.textContent = label;
    headerRow.appendChild(th);
  });
  grid.appendChild(headerRow);

  const view = window.viewMonth; // Date – first of displayed month
  const start = new Date(view);
  start.setDate(1);
  while (start.getDay() !== weekStart) {
    start.setDate(start.getDate() - 1);
  }

  const today = window.todayISO();
  const selDate = window.selectedDate;
  const current = new Date(start);
  const maxChips = 4;

  for (let i = 0; i < 42; i++) {
    const iso = window.isoOf(current);
    const cell = document.createElement("div");
    cell.className = "mcell";
    if (
      current.getMonth() !== view.getMonth() ||
      current.getFullYear() !== view.getFullYear()
    ) {
      cell.classList.add("other");
    }
    if (iso === today) cell.classList.add("today");
    if (iso === selDate) cell.classList.add("selected");
    cell.dataset.iso = iso;

    const dayNum = document.createElement("div");
    dayNum.className = "mdaynum";
    dayNum.textContent = current.getDate();
    cell.appendChild(dayNum);

    const chips = document.createElement("div");
    chips.className = "mchips";
    const entries = window.scheduledOn(iso);

    for (let j = 0; j < Math.min(maxChips, entries.length); j++) {
      const entry = entries[j];
      const chip = document.createElement("div");
      chip.className = "mchip";
      chip.textContent = entry.title;
      chip.title = entry.title;
      if (entry.priority === "high") chip.classList.add("high");
      if (entry.done) chip.classList.add("done");

      if (entry.source !== "repeat" && entry.node) {
        chip.dataset.nodeId = entry.node.id;
        chip.draggable = false;
        chip.addEventListener("dragstart", function (e) {
          e.dataTransfer.setData("application/x-planner-node", entry.node.id);
        });
      } else {
        chip.draggable = false;
      }
      chips.appendChild(chip);
    }

    if (entries.length > maxChips) {
      const more = document.createElement("div");
      more.className = "mmore";
      more.textContent = "+" + (entries.length - maxChips) + " more";
      chips.appendChild(more);
    }

    cell.appendChild(chips);

    cell.addEventListener("click", (function (isoVal) {
      return function () {
        window.selectedDate = isoVal;
        window.setTab("day");
      };
    })(iso));

    cell.addEventListener("dragover", function (e) {
      e.preventDefault();
      cell.classList.add("dropping");
    });
    cell.addEventListener("dragleave", function () {
      cell.classList.remove("dropping");
    });
    cell.addEventListener("drop", (function (isoVal) {
      return function (e) {
        e.preventDefault();
        cell.classList.remove("dropping");
        const nodeId = e.dataTransfer.getData("application/x-planner-node");
        if (nodeId) {
          const found = window.findNode(nodeId);
          if (found && found.node) {
            found.node.date = isoVal;
            window.Store.save();
            window.renderAll();
          }
        }
      };
    })(iso));

    grid.appendChild(cell);
    current.setDate(current.getDate() + 1);
  }
};

  panel.style.cssText = 'position:absolute;right:8px;top:48px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px;z-index:100;min-width:200px;max-height:300px;overflow:auto;';

  title.textContent = 'Schedule item';
  panel.appendChild(title);

  var list = document.createElement('div');

  window.walkTree(function(node, depth) {
    if (node.date === null && node.title && node.title.trim()) {
      found = true;
      var item = document.createElement('div');
      item.style.cssText = 'padding:4px 8px;cursor:pointer;border-radius:4px;';

      };

    empty.textContent = 'No unscheduled items';
    list.appendChild(empty);
  }

  panel.appendChild(list);

  document.addEventListener('click', function handler(e) {
    if (!panel.contains(e.target) && e.target !== document.querySelector('#dayView .day-header button:last-child')) {
      panel.remove();
      document.removeEventListener('click', handler);
    }
  });
}

function buildDayColumn(blockKey, blockLabel, entries, dateISO) {
  var col = document.createElement('div');
  col.className = 'daycol';
  col.style.cssText = 'flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surface-alt);border-radius:6px;overflow:hidden;';

  var head = document.createElement('div');
  head.className = 'daycol-head';
  head.style.cssText = 'padding:8px;font-weight:600;font-size:13px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;';

  var lbl = document.createElement('span');
  lbl.textContent = blockLabel;

  var filtered = entries.filter(function(e) { return e.block === blockKey; });
  var cnt = document.createElement('span');
  cnt.className = 'daycol-count';
  cnt.style.cssText = 'background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:1px 6px;font-size:11px;font-weight:400;';
  cnt.textContent = filtered.length;

  head.appendChild(lbl);
  head.appendChild(cnt);

  var list = document.createElement('div');
  list.className = 'daycol-list';
  list.style.cssText = 'flex:1;overflow-y:auto;padding:4px;';
  list.dataset.block = blockKey === null ? '' : blockKey;

  filtered.forEach(function(entry) {
    list.appendChild(buildDayItem(entry, dateISO));
  });

  list.addEventListener('dragover', function(e) {
    if (e.dataTransfer.types.includes('application/x-planner-node')) {
      e.preventDefault();
      list.classList.add('dropping');
    }
  });

  list.addEventListener('dragleave', function(e) {
    if (!list.contains(e.relatedTarget)) {
      list.classList.remove('dropping');
    }
  });

  list.addEventListener('drop', function(e) {
    e.preventDefault();
    list.classList.remove('dropping');
    var nodeId = e.dataTransfer.getData('application/x-planner-node');
    if (!nodeId) return;
    var found = window.findNode(nodeId);
    if (!found || !found.node) return;
    found.node.date = dateISO;
    found.node.block = blockKey;
    window.Store.save();
    window.renderAll();
  });

  var quickadd = document.createElement('input');
  quickadd.className = 'quickadd';
  quickadd.type = 'text';
  quickadd.placeholder = 'Add task...';
  quickadd.style.cssText = 'margin:4px;border:1px solid var(--border);border-radius:4px;padding:6px 8px;font-size:13px;background:var(--input-bg);color:var(--text);width:calc(100% - 18px);';
  quickadd.onkeydown = function(e) {
    if (e.key === 'Tab') return;
    if (e.key === 'Escape') { quickadd.value = ''; return; }
    if (e.key === 'Enter') {
      var text = quickadd.value.trim();
      quickadd.value = '';
      if (!text) return;
      var newNode = {
        id: window.uid(),
        title: text,
        notes: '',
        kind: 'task',
        done: false,
        priority: 'normal',
        date: dateISO,
        block: blockKey,
        duration: null,
        repeat: null,
        tags: [],
        collapsed: false,
        children: []
      };
      window.Store.data.tree.push(newNode);
      window.Store.save();
      window.renderDay();
    }
  };

  col.appendChild(head);
  col.appendChild(list);
  col.appendChild(quickadd);
  return col;
}

function showItemMenu(anchor, entry, canModify, dateISO) {

      ta.value = node.notes || '';

        { label: 'Cancel', kind: 'secondary', onClick: function(close) { close(); }},
        { label: 'Save', kind: 'primary', onClick: function(close) {

  items.forEach(function(mi) {

      document.removeEventListener('click', handler);

window.renderHabits = function () {
  var container = document.getElementById('habitsView');
  container.innerHTML = '';

  var palette = ['#1a73e8', '#34a853', '#ea4335', '#fbbc04', '#9c27b0', '#ff6d01', '#00bcd4', '#607d8b'];

  input.placeholder = 'New habit';
  addRow.appendChild(input);

  var swatchContainer = document.createElement('div');
  swatchContainer.className = 'color-swatches';
  var selectedColor = palette[0];
  palette.forEach(function (color, idx) {
    var swatch = document.createElement('span');
    swatch.className = 'color-swatch' + (idx === 0 ? ' selected' : '');
    swatch.style.background = color;
    swatch.dataset.color = color;
    swatch.style.display = 'inline-block';
    swatch.style.width = '20px';
    swatch.style.height = '20px';
    swatch.style.borderRadius = '50%';
    swatch.style.margin = '0 2px';
    swatch.style.cursor = 'pointer';
    swatch.style.border = '2px solid transparent';
    swatch.addEventListener('click', function () {
      selectedColor = color;
      var all = swatchContainer.querySelectorAll('.color-swatch');
      for (var i = 0; i < all.length; i++) {
        all[i].classList.remove('selected');
        all[i].style.border = '2px solid transparent';
      }
      swatch.classList.add('selected');
      swatch.style.border = '2px solid #333';
    });
    swatchContainer.appendChild(swatch);
  });
  addRow.appendChild(swatchContainer);

  var addBtn = document.createElement('button');
  addBtn.className = 'btn-add-habit';
  addBtn.textContent = 'Add';
  addBtn.addEventListener('click', function () {
    var name = input.value.trim();
    if (!name) return;
    var habit = { id: uid(), name: name, color: selectedColor, freq: 'daily', targetPerWeek: 7 };
    if (!Store.data.habits) Store.data.habits = [];
    Store.data.habits.push(habit);
    Store.save();
    renderHabits();
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') addBtn.click();
  });
  addRow.appendChild(addBtn);
  container.appendChild(addRow);

  // --- Habit list ---
  var habits = Store.data.habits || [];
  if (habits.length === 0) {
    var empty = document.createElement('p');
    empty.className = 'habits-empty';
    empty.textContent = 'No habits yet.';
    container.appendChild(empty);
    return;
  }

  var list = document.createElement('div');
  list.className = 'habit-list';
  var todayDate = new Date();
  var todayIso = todayISO();

  habits.forEach(function (habit) {
    var row = document.createElement('div');
    row.className = 'habit-row';

    // name
    var nameEl = document.createElement('span');
    nameEl.className = 'habit-name';
    nameEl.textContent = habit.name;
    row.appendChild(nameEl);

    // 7‑day cells (oldest left, today right)
    var cells = document.createElement('div');
    cells.className = 'habit-cells';
    for (var i = 6; i >= 0; i--) {
      var d = new Date(todayDate);
      d.setDate(d.getDate() - i);
      var iso = isoOf(d);
      var dayNum = d.getDate();
      var weekday = d.toLocaleDateString('en-US', { weekday: 'narrow' });
      var cell = document.createElement('div');
      cell.className = 'habit-cell';
      var log = Store.data.habitLog ? Store.data.habitLog[habit.id] : null;
      if (log && log[iso]) {
        cell.classList.add('done');
        cell.style.background = habit.color;
      }
      if (iso === todayIso) cell.classList.add('today');
      cell.dataset.iso = iso;
      cell.textContent = weekday + ' ' + dayNum;
      cell.addEventListener('click', (function (habitId, iso) {
        return function () {
          if (!Store.data.habitLog) Store.data.habitLog = {};
          if (!Store.data.habitLog[habitId]) Store.data.habitLog[habitId] = {};
          Store.data.habitLog[habitId][iso] = !Store.data.habitLog[habitId][iso];
          Store.save();
          renderHabits();
        };
      })(habit.id, iso));
      cells.appendChild(cell);
    }
    row.appendChild(cells);

    // streak badge
    var streak = (function (habitId) {
      var hlog = Store.data.habitLog ? Store.data.habitLog[habitId] : null;
      if (!hlog) return 0;
      var d = new Date(todayDate);
      if (!hlog[isoOf(d)]) d.setDate(d.getDate() - 1);
      var count = 0;
      while (true) {
        var iso = isoOf(d);
        if (hlog[iso]) {
          count++;
          d.setDate(d.getDate() - 1);
        } else break;
      }
      return count;
    })(habit.id);
    var streakBadge = document.createElement('span');
    streakBadge.className = 'streak-badge';
    streakBadge.textContent = 'Streak ' + streak;
    row.appendChild(streakBadge);

    // weekly progress
    var weekCount = (function (habitId) {
      var hlog = Store.data.habitLog ? Store.data.habitLog[habitId] : null;
      var weekStart = (Store.data.settings && Store.data.settings.weekStart) || 0;
      var start = new Date(todayDate);
      var dow = start.getDay();
      var diff = (dow - weekStart + 7) % 7;
      start.setDate(start.getDate() - diff);
      var count = 0;
      var cur = new Date(start);
      while (cur <= todayDate) {
        if (hlog && hlog[isoOf(cur)]) count++;
        cur.setDate(cur.getDate() + 1);
      }
      return count;
    })(habit.id);
    var target = habit.targetPerWeek || 7;
    var progressLabel = document.createElement('span');
    progressLabel.className = 'habit-progress';
    progressLabel.textContent = weekCount + ' / ' + target + ' this week';
    row.appendChild(progressLabel);

    // delete button
    var delBtn = document.createElement('button');
    delBtn.className = 'habit-delete';
    delBtn.textContent = '\xD7';
    delBtn.title = 'Delete habit';
    delBtn.addEventListener('click', (function (habitId, habitName) {
      return function () {
        if (!confirm('Delete habit "' + habitName + '"?')) return;
        var idx = Store.data.habits.findIndex(function (h) { return h.id === habitId; });
        if (idx !== -1) Store.data.habits.splice(idx, 1);
        if (Store.data.habitLog) delete Store.data.habitLog[habitId];
        Store.save();
        renderHabits();
      };
    })(habit.id, habit.name));
    row.appendChild(delBtn);

    list.appendChild(row);
  });
  container.appendChild(list);
};

(function () {
  'use strict';

  var activeModal = null;

  window.showModal = function (title, bodyNode, buttons) {
    // One dialog at a time. Opening a second used to stack them, so edits went
    // into whichever was underneath and Save appeared not to close anything.
    var open = document.querySelectorAll('#modalHost .modal-backdrop');
    for (var oi = 0; oi < open.length; oi++) open[oi].remove();

    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';

    var modal = document.createElement('div');
    modal.className = 'modal';

    var header = document.createElement('div');
    header.className = 'modal-header';

    var heading = document.createElement('h2');
    heading.textContent = title;
    header.appendChild(heading);

    var closeBtn = document.createElement('button');
    closeBtn.className = 'modal-close';
    closeBtn.setAttribute('aria-label', 'Close');
    closeBtn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    header.appendChild(closeBtn);

    var body = document.createElement('div');
    body.className = 'modal-body';
    if (typeof bodyNode === 'string') {
      body.textContent = bodyNode;
    } else {
      body.appendChild(bodyNode);
    }

    var footer = document.createElement('div');
    footer.className = 'modal-footer';
    buttons.forEach(function (b) {
      var btn = document.createElement('button');
      btn.className = 'modal-btn modal-btn-' + (b.kind || 'secondary');
      btn.textContent = b.label;
      btn.addEventListener('click', function () {
        try {
          if (b.onClick) b.onClick();
        } catch (err) {
          if (window.toast) window.toast('Action failed: ' + err.message, 'err');
        } finally {
          closeModal();
        }
      });
      footer.appendChild(btn);
    });

    modal.appendChild(header);
    modal.appendChild(body);
    modal.appendChild(footer);
    backdrop.appendChild(modal);
    document.getElementById('modalHost').appendChild(backdrop);

    function closeModal() {
      backdrop.removeEventListener('click', onBackdropClick);
      document.removeEventListener('keydown', onKey);
      activeModal = null;
      // It never actually removed itself from the page. Every dialog in the app
      // stayed on screen after Save/Cancel/Escape because of this one omission.
      if (backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
    }

    function onBackdropClick(e) {
      if (e.target === backdrop) closeModal();
    }

    function onKey(e) {
      if (e.key === 'Escape') {
        e.stopPropagation();
        closeModal();
      }
    }

    backdrop.addEventListener('click', onBackdropClick);
    document.addEventListener('keydown', onKey);
    closeBtn.addEventListener('click', closeModal);
    activeModal = closeModal;
    return closeModal;
  };

  window.showConflict = function (remoteData) {
    var localData = Store.data;
    var localStamp = localData.updatedAt ? fmtDate(localData.updatedAt, 'long') : 'unknown';
    var remoteStamp = remoteData.updatedAt ? fmtDate(remoteData.updatedAt, 'long') : 'unknown';

    var localTime = localData.updatedAt ? new Date(localData.updatedAt) : null;
    var remoteTime = remoteData.updatedAt ? new Date(remoteData.updatedAt) : null;
    var newer = 'unknown';
    if (localTime && remoteTime) {
      newer = remoteTime > localTime ? 'the synced copy' : 'this device';
    }

    var msg = 'This device and your synced planner have both changed since the last sync. Choose which to keep, or close this and they will be merged.';
    var body = document.createElement('div');
    body.innerHTML = '<p>' + msg + '</p>';
    var table = document.createElement('table');
    table.style.width = '100%';
    table.style.marginTop = '1em';
    table.innerHTML =
      '<thead><tr><th>Source</th><th>Last updated</th></tr></thead>' +

      '<tr><td>Synced copy</td><td>' + remoteStamp + '</td></tr>' +
      '</tbody>';
    body.appendChild(table);
    body.insertAdjacentText('beforeend', '\nNewer: ' + newer + '.');

    var buttons = [
      {
        label: 'Keep this device',
        kind: 'primary',
        onClick: function () {
          Cloud.push({ clearMatch: true }).catch(function (err) {
            toast('Push failed: ' + err.message, 'err');
          });
        }
      },
      {
        label: 'Use synced copy',
        kind: 'secondary',
        onClick: function () {
          Store.data = remoteData;
          Store.save();
          renderAll();
        }
      },
      {
        label: 'Download both',
        kind: 'secondary',
        onClick: function () {
          var dateStr = fmtDate(todayISO(), 'short').replace(/\s/g, '-');
          function download(name, content) {
            var a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([content], { type: 'application/json' }));
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
          }
          download('planner-local-' + dateStr + '.json', JSON.stringify(localData, null, 2));
          download('planner-remote-' + dateStr + '.json', JSON.stringify(remoteData, null, 2));
        }
      }
    ];

    window.showModal('Sync Conflict', body, buttons);
  };

  var rendering = false;
  window.renderAll = function () {
    if (rendering) return;
    rendering = true;
    try {
      if (typeof renderTree === 'function') renderTree();
      if (typeof renderMonth === 'function') renderMonth();
      if (typeof renderDay === 'function') renderDay();
      if (typeof renderJournal === 'function') renderJournal();
      if (typeof renderHabits === 'function') renderHabits();
    } finally {
      rendering = false;
    }
  };

  Store.onChange(window.renderAll);

  function initSplitter() {
    var splitter = document.getElementById('splitter');
    var treePane = document.getElementById('treePane');
    if (!splitter || !treePane) return;
    var dragging = false;
    var startX = 0;
    var startWidth = 0;

    var savedWidth = Store.data.settings && Store.data.settings.treeWidth;
    if (savedWidth) {
      treePane.style.width = savedWidth + 'px';
    }

    splitter.addEventListener('pointerdown', function (e) {
      dragging = true;
      startX = e.clientX;
      startWidth = treePane.offsetWidth;
      splitter.setPointerCapture(e.pointerId);
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });

    document.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var diff = e.clientX - startX;
      var newWidth = startWidth + diff;
      var minWidth = 220;
      var maxWidth = Math.floor(window.innerWidth * 0.6);
      if (newWidth < minWidth) newWidth = minWidth;
      if (newWidth > maxWidth) newWidth = maxWidth;
      treePane.style.width = newWidth + 'px';
    });

    document.addEventListener('pointerup', function (e) {
      if (!dragging) return;
      dragging = false;
      splitter.releasePointerCapture(e.pointerId);
      document.body.style.userSelect = '';
      if (!Store.data.settings) Store.data.settings = {};
      Store.data.settings.treeWidth = treePane.offsetWidth;
      Store.save();
    });

    window.addEventListener('resize', function () {
      var w = treePane.offsetWidth;
      var max = Math.floor(window.innerWidth * 0.6);
      if (w > max) {
        treePane.style.width = max + 'px';
      }
    });
  }

  function seedFirstRun() {
    if (Store.data.tree.length > 0) return;
    if (localStorage.getItem('planner.seeded')) return;

    var goalId = uid();
    var taskIds = [uid(), uid(), uid()];
    var goal = {
      id: goalId,
      title: 'Set up my planner',
      notes: '',
      kind: 'goal',
      done: false,
      priority: 'normal',
      date: null,
      block: null,
      duration: null,
      repeat: null,
      tags: [],
      collapsed: false,
      children: [
        { id: taskIds[0], title: 'Drag me onto a calendar day', notes: '', kind: 'task', done: false, priority: 'normal', date: null, block: null, duration: null, repeat: null, tags: [], collapsed: false, children: [] },
        { id: taskIds[1], title: 'Press Tab on a task to indent it', notes: '', kind: 'task', done: false, priority: 'normal', date: null, block: null, duration: null, repeat: null, tags: [], collapsed: false, children: [] },
        { id: taskIds[2], title: 'Star a task to mark it high priority', notes: '', kind: 'task', done: false, priority: 'normal', date: null, block: null, duration: null, repeat: null, tags: [], collapsed: false, children: [] }
      ]
    };

    Store.data.tree = [goal];
    localStorage.setItem('planner.seeded', '1');
    Store.save();
  }

  function init() {
    try {
      Store.load();
      applyTheme();
      seedFirstRun();

      // Render FIRST, synchronously. The cloud must never be able to keep the
      // page blank, and it must never reset the view after the user has begun
      // navigating. Both were real defects.
      var now = new Date();
      window.viewMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      window.selectedDate = todayISO();
      renderAll();
      setTab('day');
      initSplitter();

      (async function () {
        try {
          await Cloud.handleRedirect();
          if (Cloud.connected()) {
            await Cloud.pull();
            await Cloud.start();
            // only redraw once remote data has actually arrived; never touch
            // viewMonth or selectedDate here - the user may have navigated
            renderAll();
          }
        } catch (e) {
          toast('Cloud init error: ' + e.message, 'err');
        }
      })();
    } catch (e) {
      toast(e.message, 'err');
      document.title = 'Error: ' + e.message;
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

    var areas = window.Store.data.areas;
    for (var i = 0; i < areas.length; i++) {

      var dot = document.createElement('span');
      dot.className = 'pdot';
      dot.style.background = area.color;
      btn.appendChild(dot);
      var txt = document.createTextNode(area.name);
      btn.appendChild(txt);
      btn.onclick = (function(id){ return function(){ pick(id); }; })(area.id);
      picker.appendChild(btn);
    }
    var noneBtn = document.createElement('button');
    noneBtn.type = 'button';
    noneBtn.textContent = 'None';
    noneBtn.onclick = function(){ pick(null); };
    picker.appendChild(noneBtn);
