  margin-left: auto; min-width: 26px; height: 22px;
  border-radius: 5px; cursor: pointer; font-size: 13px; line-height: 1;
}
.al-group {
  display: flex; flex-direction: column; gap: 4px;
  border: 1px solid var(--border); border-radius: 8px; padding: 5px;
}
button.al-add {
  align-self: flex-start; font-size: 11px; padding: 5px 10px;
  border-radius: 5px; cursor: pointer; opacity: .85;
}
/* the alarm date popover floats above the dialog without closing it */
.al-pop {
  position: fixed; z-index: 100000;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: 0 10px 34px rgba(0,0,0,.45); padding: 6px;
}
.al-row {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface-2, var(--surface));
}
.al-lab { font-size: 11px; opacity: .8; white-space: nowrap; }
.al-num { font-size: 11px; opacity: .55; min-width: 14px; }
button.al-date { font-size: 12px; padding: 4px 8px; border-radius: 5px; cursor: pointer; flex: 1 1 auto; text-align: left; }
input.al-time { font-size: 12px; padding: 3px 6px; border-radius: 5px; font-variant-numeric: tabular-nums; }
select.al-lead { font-size: 12px; flex: 1 1 auto; }
button.al-x { margin-left: auto; font-size: 11px; opacity: .6; cursor: pointer; background: none; border: 0; }
button.al-x:hover { opacity: 1; color: var(--danger); }
@media (max-width: 700px) {
  button.al-date, input.al-time, select.al-lead { min-height: 36px; }
  button.al-x { min-width: 36px; min-height: 36px; }
}

/* ---------- the Edit dialog must scroll, not run off the screen ----------
   Measured: with alarms added, the date button landed at y=807 in an 813px
   viewport - below the fold and unclickable. The dialog now caps its height and
   scrolls its own body, so every field stays reachable however many alarms are
   added. */
#modalHost .modal {
  max-height: calc(100vh - 32px);
  display: flex;
  flex-direction: column;
}
#modalHost .modal .ea {
  overflow-y: auto;
  overscroll-behavior: contain;
  flex: 1 1 auto;
  min-height: 0;
}
#modalHost .modal .modal-footer { flex: 0 0 auto; }
@media (max-width: 700px) {
  #modalHost .modal { max-height: calc(100vh - 16px); }
}

/* ---------- phone bottom bar ---------- */
#bottomBar { display: none; }
@media (max-width: 700px) {
  #bottomBar {
    display: flex;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9000;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #bottomBar .bb-tab {
    flex: 1 1 0; display: flex; flex-direction: column; align-items: center;
    gap: 2px; padding: 8px 4px 6px; background: none; border: 0;
    color: var(--text-dim, var(--text)); cursor: pointer; min-height: 52px;
  }
  #bottomBar .bb-tab.on { color: var(--accent); }
  #bottomBar .bb-ic { font-size: 18px; line-height: 1; }
  #bottomBar .bb-lb { font-size: 10px; letter-spacing: .2px; }
  /* keep content clear of the bar */
  main#main { padding-bottom: 64px; }
  /* Plan shows tree + day; Settings shows the drawer; Alarms opens its dialog */
  /* Settings: the drawer lives INSIDE #treePane, so hiding that pane hid the
     menu too and left a blank screen. Keep the pane, hide the tree itself. */
  body[data-bb="settings"] section#rightPane { display: none; }
  body[data-bb="settings"] aside#treePane { display: flex; width: 100%; max-height: none; }
  body[data-bb="settings"] #treeRoot,
  body[data-bb="settings"] .tree-toolbar { display: none; }
  body[data-bb="settings"] #treeDrawer {
    display: block !important;
    overflow-y: auto;
    padding: 8px 10px 16px;
  }
  body[data-bb="settings"] #treeDrawer button { width: 100%; text-align: left; margin: 4px 0; }
  /* Alarms tab: same shape, the list renders into the drawer area */
  body[data-bb="alarms"] section#rightPane { display: none; }

  /* Dialogs must clear the bottom bar - the Save and Delete buttons were
     underneath it and could not be reached at all. */
  #modalHost { z-index: 99999; }
  #modalHost .modal { max-height: calc(100vh - 96px); }
  #modalHost .modal-footer { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  #modalHost .modal-backdrop { padding-bottom: 64px; }
}

/* ================= VISUAL PASS 2026-08-17 =================
   Three surface tones in one hue, restrained colour, weight-led hierarchy,
   a 4px rhythm. Depth from tone, never from shadows or glow - that is what
   separates a dark UI that reads as professional from one that reads as a
   template. No gradients, no glass, no glow, deliberately. */
:root {
  --s-base:     #14161a;   /* the page */
  --s-raised:   #191c21;   /* panels */
  --s-elevated: #1f2329;   /* hover, dialogs, popovers */
  --line:       #262a31;   /* hairlines, barely there */
  --t-1: rgba(255,255,255,.92);   /* titles */
  --t-2: rgba(255,255,255,.68);   /* secondary */
  --t-3: rgba(255,255,255,.45);   /* times, counts, meta */
  --accent-q:   #5b8def;   /* desaturated ~30% from a pure blue */
}
:root:not([data-theme="light"]) body,
:root[data-theme="dark"] body { background: var(--s-base); }
:root:not([data-theme="light"]) aside#treePane,
:root:not([data-theme="light"]) section#rightPane { background: var(--s-raised); }
:root:not([data-theme="light"]) header#topbar { background: var(--s-raised); border-bottom: 1px solid var(--line); }

/* ---- tree rows: two sizes, weight does the hierarchy ---- */
#treeRoot .tree-row { padding: 0 8px; border-radius: 6px; }
#treeRoot .tree-row:hover { background: var(--s-elevated); }
#treeRoot .tree-title { font-size: 13px; font-weight: 400; color: var(--t-1); letter-spacing: .1px; }
/* TOP-LEVEL rows are the sections. Depth decides that, not whether a task
   happens to have a subtask - "Run 10 minutes" is a task, not a heading. */
#treeRoot .tree-row[data-depth="0"] .tree-title { font-weight: 600; letter-spacing: .2px; }
/* One text size for every title. Weight alone carries the hierarchy, which
   reads better than mixing sizes - and it keeps the 30px row honest. */
#treeRoot .tree-row .tree-title { font-size: 13px; }
/* icons match the secondary text size so the row has two sizes, not four */
/* higher specificity: an earlier rule sets these to 12px and was winning,
   which is why the row still showed three sizes instead of two */
#treeRoot .tree-row button.btn-icon,
#treeRoot .tree-row button.rowmenu,
#treeRoot .tree-row button.rowquick,
#treeRoot .tree-row .tree-caret { font-size: 11px; }
/* the old green selection edge fights the accent - one colour, quietly */
#treeRoot .tree-row.selected,
#treeRoot .tree-row.sel {
  background: var(--s-elevated);
  box-shadow: inset 2px 0 0 0 var(--accent-q);
  border-left-color: transparent !important;
}
#treeRoot .tag-chip,
#treeRoot .tree-timechip,
#treeRoot .tree-dateclear { font-size: 11px; font-weight: 500; color: var(--t-3); }
#treeRoot .tag-chip { background: var(--s-elevated); border: 0; border-radius: 4px; padding: 1px 6px; }
/* every icon the same size, in one aligned column */
#treeRoot .btn-icon,
#treeRoot .rowmenu,
#treeRoot .rowquick { font-size: 12px; color: var(--t-3); }
#treeRoot .btn-icon:hover,
#treeRoot .rowmenu:hover { color: var(--t-1); background: transparent; }
/* the older duplicate arrow pair is hidden but still shipped - keep it gone */
#treeRoot .tree-outdent, #treeRoot .tree-indent { display: none !important; }

/* ---- calendar: strips, not filled blocks ---- */
.tgevent, .wchip, .tgchip {
  background: var(--s-elevated) !important;
  border: 0 !important;
  border-left: 3px solid var(--accent-q) !important;
  border-radius: 4px;
  color: var(--t-1);
}
.tgevent .tgtime, .tgchip .tgtime { color: var(--t-3); font-size: 11px; }
/* most grid lines go; keep the hour rules faint */
.tgrow, .tgcell, .wcell { border-color: var(--line) !important; }
.tghour, .wlabel { color: var(--t-3); font-size: 11px; font-variant-numeric: tabular-nums; }
/* today: one bar along the top, not a filled cell */
.tgalldaycell.today, .whead.wtoday, .mday.today {
  background: transparent !important;
  box-shadow: inset 0 2px 0 0 var(--accent-q);
}

/* ---- colour: one hue per branch, carried by the area it belongs to ----
   The palette already existed in the data and was never shown. A goal takes its
   area's colour; everything beneath inherits it, so a whole branch reads as one
   thing. Colour on the EDGE, never as a fill - a filled row is the fastest way
   to make a dark UI look cheap. */
#treeRoot .tree-row { position: relative; }
#treeRoot .tree-row[data-depth="0"] {
  box-shadow: inset 3px 0 0 0 var(--row-colour, var(--accent-q));
}
#treeRoot .tree-row[data-depth="0"] .tree-title { color: var(--row-colour, var(--t-1)); }
/* children: a quiet guide line in the same colour, so nesting is visible */
#treeRoot .tree-row:not([data-depth="0"]) {
  box-shadow: inset 3px 0 0 0 color-mix(in srgb, var(--row-colour, var(--accent-q)) 30%, transparent);
}
#treeRoot .tree-row[data-depth="2"],
#treeRoot .tree-row[data-depth="3"] .tree-title { color: var(--t-2); }
/* the checkbox picks up the branch colour when ticked */
#treeRoot .tree-row input[type="checkbox"] { accent-color: var(--row-colour, var(--accent-q)); }
/* calendar events take the same colour as their branch */
.tgevent, .tgchip, .wchip { border-left-color: var(--row-colour, var(--accent-q)) !important; }
/* kill the leftover green edge that fought the accent */
#treeRoot .tree-row { border-left: 0 !important; }

/* ===== o05 visual formats =====
   One block of custom properties per look. No JS per preset: the picker only
   writes data-look on <html>, so a new look is a CSS edit and nothing else.
   The branch colours are not deleted - they are gated, so "Colour by area"
   stays available for whoever wants it. */

/* Quiet is the default: suppress the per-branch colour without touching the JS
   that computes it. !important is required because that JS writes --row-colour
   inline, and inline beats a plain stylesheet declaration. */
:root:not([data-look="area"]) #treeRoot .tree-row { --row-colour: var(--accent-q) !important; }

/* High contrast: brighter text, stronger lines, a louder accent. */
:root[data-look="contrast"] {
  --t-1: rgba(255,255,255,1);
  --t-2: rgba(255,255,255,.86);
  --t-3: rgba(255,255,255,.64);
  --accent-q: #7aa5ff;
  --line: rgba(255,255,255,.22);
  --s-base: #0f1115; --s-raised: #171a20; --s-elevated: #232830;
}
:root[data-look="contrast"] #treeRoot .tree-row[data-depth="0"] .tree-title { font-weight: 700; }

/* Compact: same palette, tighter rhythm - more rows on one screen. */
:root[data-look="compact"] #treeRoot .tree-row { padding: 0 6px; min-height: 24px; }
:root[data-look="compact"] #treeRoot .tree-row .tree-title { font-size: 12px; }
:root[data-look="compact"] #treeRoot .tree-row .time-chip,
:root[data-look="compact"] #treeRoot .tree-row .tag-chip { font-size: 10px; }
:root[data-look="compact"] #treeRoot .tree-row button.btn-icon { font-size: 11px; }

/* the picker itself */
.look-row {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: var(--s-raised); color: var(--t-1);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 11px; margin-bottom: 7px;
}
.look-row:hover { background: var(--s-elevated); }
.look-row.on { border-color: var(--accent-q); box-shadow: inset 3px 0 0 0 var(--accent-q); }
.look-name { font-size: 13px; font-weight: 600; }
.look-hint { font-size: 11px; color: var(--t-3); margin-top: 2px; }

/* Measured: .tgbody is NOT the scroll host (scrollHeight == clientHeight).
   .tgscroll is. Left as a comment rather than a rule because the grid already
   scrolls correctly - the bug was never CSS, it was opening at 6am. */

/* ===== o06 settings label + the looks read as one simple list ===== */
.drawer-title {
  font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--t-3); padding: 8px 10px 6px;
}
.drawer-hint { font-size: 11px; color: var(--t-3); padding: 0 10px 8px; line-height: 1.45; }
#btnSettings { font-size: 12px; }

/* "Simple, consistent throughout" - one type size for every drawer control, one
   weight, one alignment. Six sizes in one tray is what made it feel unfinished. */
#treeDrawer .drawer-btn {
  font-size: 12px; font-weight: 500; text-align: left;
  padding: 7px 10px; border-radius: 6px;
}

/* On the phone the bottom bar already has a Settings tab, so the top-bar one is
   redundant and eats width from a bar that is already tight. */
@media (max-width: 700px) { #btnSettings { display: none !important; } }

/* =====================================================================
   o07  VISUAL VARIATIONS - 10 aspects x 10 variations
   =====================================================================
   The operator rejected four bundled "looks" and asked for ten variations of
   each aspect so they can pick piece by piece instead of accepting a bundle.

   Every variation here is built against measured values from a shipped
   professional app (Linear's published dark tokens) rather than my taste,
   because that is what the four rejected looks got wrong: the individual
   choices were amateur, not the combinations. Specifically wrong before:
   3 surfaces starting too light, text as white-alpha instead of blue-tinted
   solids, an 11px chip below any real app's floor, POSITIVE letter-spacing,
   and one 6px radius on everything.

   Mechanism: one data attribute per aspect on <html>, e.g. data-v-surface="4".
   No JavaScript per variation - the picker only writes attributes.
   ===================================================================== */

/* ---------------------------------------------------------------
   ASPECT 1 - SURFACE LADDER  (data-v-surface)
   The page, panels, and raised things. Depth without shadows.
   --------------------------------------------------------------- */
:root[data-v-surface="1"]  { --s-base:#010102; --s-raised:#0f1011; --s-elevated:#141516; --s-top:#18191a; }
:root[data-v-surface="2"]  { --s-base:#0b0c0e; --s-raised:#121317; --s-elevated:#181a1f; --s-top:#1e2127; }
:root[data-v-surface="3"]  { --s-base:#101114; --s-raised:#16181c; --s-elevated:#1c1f24; --s-top:#23272e; }
:root[data-v-surface="4"]  { --s-base:#0d0f13; --s-raised:#14171d; --s-elevated:#1b1f26; --s-top:#232830; }
:root[data-v-surface="5"]  { --s-base:#000000; --s-raised:#0c0c0d; --s-elevated:#131314; --s-top:#1a1a1c; }
:root[data-v-surface="6"]  { --s-base:#12100f; --s-raised:#191614; --s-elevated:#201c19; --s-top:#28231f; }
:root[data-v-surface="7"]  { --s-base:#0f1216; --s-raised:#151a20; --s-elevated:#1c222a; --s-top:#242c36; }
:root[data-v-surface="8"]  { --s-base:#14161a; --s-raised:#191c21; --s-elevated:#1f2329; --s-top:#272c34; }
:root[data-v-surface="9"]  { --s-base:#1a1a1d; --s-raised:#212125; --s-elevated:#28282d; --s-top:#313137; }
:root[data-v-surface="10"] { --s-base:#0a0d0c; --s-raised:#111514; --s-elevated:#171c1b; --s-top:#1e2423; }

:root[data-v-surface] body,
:root[data-v-surface] { background: var(--s-base); }
:root[data-v-surface] section#rightPane,
:root[data-v-surface] header#topbar,
:root[data-v-surface] aside#treePane { background: var(--s-raised); }
:root[data-v-surface] #treeRoot .tree-row:hover { background: var(--s-elevated); }
:root[data-v-surface] #treeDrawer { background: var(--s-elevated); }
:root[data-v-surface] .modal, :root[data-v-surface] .sheet { background: var(--s-top); }

/* ---------------------------------------------------------------
   ASPECT 2 - TEXT RAMP  (data-v-text)
   Four levels. Solid colours read cleaner than white-alpha on dark.
   --------------------------------------------------------------- */
:root[data-v-text="1"]  { --t-1:#f7f8f8; --t-2:#d0d6e0; --t-3:#8a8f98; --t-4:#62666d; }
:root[data-v-text="2"]  { --t-1:#ffffff; --t-2:#c9ced6; --t-3:#868c95; --t-4:#5c6169; }
:root[data-v-text="3"]  { --t-1:#f4f4f5; --t-2:#d4d4d8; --t-3:#a1a1aa; --t-4:#71717a; }
:root[data-v-text="4"]  { --t-1:#fafaf9; --t-2:#d6d3d1; --t-3:#a8a29e; --t-4:#78716c; }
:root[data-v-text="5"]  { --t-1:#f0f6fc; --t-2:#c9d1d9; --t-3:#8b949e; --t-4:#6e7681; }
:root[data-v-text="6"]  { --t-1:#ecfdf5; --t-2:#c7d5cf; --t-3:#8b9a94; --t-4:#63706b; }
:root[data-v-text="7"]  { --t-1:#fff7ed; --t-2:#e0d5c8; --t-3:#a09183; --t-4:#75695e; }
:root[data-v-text="8"]  { --t-1:rgba(255,255,255,.92); --t-2:rgba(255,255,255,.68); --t-3:rgba(255,255,255,.45); --t-4:rgba(255,255,255,.32); }
:root[data-v-text="9"]  { --t-1:#e8e8ea; --t-2:#b4b4bb; --t-3:#78787f; --t-4:#55555b; }
:root[data-v-text="10"] { --t-1:#ffffff; --t-2:#e4e4e7; --t-3:#b8b8bf; --t-4:#8c8c93; }

:root[data-v-text] #treeRoot .tree-title { color: var(--t-1); }
:root[data-v-text] .time-chip, :root[data-v-text] .tgevent-time { color: var(--t-3); }
:root[data-v-text] .drawer-title, :root[data-v-text] .drawer-hint { color: var(--t-3); }
:root[data-v-text] .tree-row.done .tree-title { color: var(--t-4); }

/* ---------------------------------------------------------------
   ASPECT 3 - TYPE SCALE & WEIGHT  (data-v-type)
   Hierarchy by weight, not by size. 12px is the floor.
   --------------------------------------------------------------- */
:root[data-v-type="1"]  { --f-title:14px; --f-meta:12px; --w-goal:590; --w-task:400; --ls:-0.05px; --lh:1.5; }
:root[data-v-type="2"]  { --f-title:14px; --f-meta:12px; --w-goal:510; --w-task:400; --ls:-0.1px;  --lh:1.5; }
:root[data-v-type="3"]  { --f-title:15px; --f-meta:12px; --w-goal:600; --w-task:400; --ls:-0.2px;  --lh:1.45; }
:root[data-v-type="4"]  { --f-title:13px; --f-meta:12px; --w-goal:600; --w-task:450; --ls:0;       --lh:1.5; }
:root[data-v-type="5"]  { --f-title:16px; --f-meta:13px; --w-goal:600; --w-task:400; --ls:-0.25px; --lh:1.4; }
:root[data-v-type="6"]  { --f-title:14px; --f-meta:12px; --w-goal:700; --w-task:400; --ls:-0.1px;  --lh:1.5; }
:root[data-v-type="7"]  { --f-title:14px; --f-meta:12px; --w-goal:500; --w-task:500; --ls:0;       --lh:1.55; }
:root[data-v-type="8"]  { --f-title:13px; --f-meta:11px; --w-goal:600; --w-task:400; --ls:0.1px;   --lh:1.4; }
:root[data-v-type="9"]  { --f-title:15px; --f-meta:13px; --w-goal:510; --w-task:400; --ls:-0.15px; --lh:1.5; }
:root[data-v-type="10"] { --f-title:14px; --f-meta:12px; --w-goal:400; --w-task:400; --ls:-0.05px; --lh:1.5; }

:root[data-v-type] #treeRoot .tree-row .tree-title {
  font-size: var(--f-title); letter-spacing: var(--ls); line-height: var(--lh);
  font-weight: var(--w-task);
}
:root[data-v-type] #treeRoot .tree-row[data-depth="0"] .tree-title { font-weight: var(--w-goal); }
:root[data-v-type] #treeRoot .tree-row .time-chip,
:root[data-v-type] #treeRoot .tree-row .tag-chip,
:root[data-v-type] #treeRoot .tree-row button.btn-icon { font-size: var(--f-meta); }
:root[data-v-type] .tgevent-time, :root[data-v-type] .tgevent-title { font-size: var(--f-meta); }

/* ---------------------------------------------------------------
   ASPECT 4 - ROW DENSITY  (data-v-density)
   All 4px multiples.
   --------------------------------------------------------------- */
:root[data-v-density="1"]  { --row-h:24px; --row-px:6px;  --row-gap:0px; }
:root[data-v-density="2"]  { --row-h:28px; --row-px:8px;  --row-gap:0px; }
:root[data-v-density="3"]  { --row-h:32px; --row-px:8px;  --row-gap:0px; }
:root[data-v-density="4"]  { --row-h:32px; --row-px:12px; --row-gap:2px; }
:root[data-v-density="5"]  { --row-h:36px; --row-px:12px; --row-gap:2px; }
:root[data-v-density="6"]  { --row-h:40px; --row-px:16px; --row-gap:4px; }
:root[data-v-density="7"]  { --row-h:28px; --row-px:12px; --row-gap:4px; }
:root[data-v-density="8"]  { --row-h:44px; --row-px:16px; --row-gap:4px; }
:root[data-v-density="9"]  { --row-h:36px; --row-px:8px;  --row-gap:0px; }
:root[data-v-density="10"] { --row-h:26px; --row-px:10px; --row-gap:1px; }

/* Measured: an earlier rule sets `#treeRoot .tree-row { height: 30px }`. A fixed
   height makes min-height inert, so the height itself has to be set here. */
:root[data-v-density] #treeRoot .tree-row {
  height: var(--row-h) !important; min-height: var(--row-h) !important;
  padding-left: var(--row-px); padding-right: var(--row-px);
  margin-bottom: var(--row-gap);
}

/* ---------------------------------------------------------------
   ASPECT 5 - CORNER RADIUS  (data-v-radius)
   Radius should scale with the element, not be one number everywhere.
   --------------------------------------------------------------- */
:root[data-v-radius="1"]  { --r-chip:4px;  --r-row:6px;  --r-btn:8px;  --r-card:12px; }
:root[data-v-radius="2"]  { --r-chip:2px;  --r-row:4px;  --r-btn:6px;  --r-card:8px;  }
:root[data-v-radius="3"]  { --r-chip:0px;  --r-row:0px;  --r-btn:0px;  --r-card:0px;  }
:root[data-v-radius="4"]  { --r-chip:6px;  --r-row:8px;  --r-btn:10px; --r-card:14px; }
:root[data-v-radius="5"]  { --r-chip:9999px; --r-row:9999px; --r-btn:9999px; --r-card:16px; }
:root[data-v-radius="6"]  { --r-chip:4px;  --r-row:10px; --r-btn:10px; --r-card:16px; }
:root[data-v-radius="7"]  { --r-chip:9999px; --r-row:8px; --r-btn:9999px; --r-card:12px; }
:root[data-v-radius="8"]  { --r-chip:3px;  --r-row:5px;  --r-btn:5px;  --r-card:7px;  }
:root[data-v-radius="9"]  { --r-chip:6px;  --r-row:6px;  --r-btn:6px;  --r-card:6px;  }
:root[data-v-radius="10"] { --r-chip:4px;  --r-row:12px; --r-btn:8px;  --r-card:20px; }

:root[data-v-radius] #treeRoot .tree-row { border-radius: var(--r-row); }
:root[data-v-radius] .time-chip, :root[data-v-radius] .tag-chip { border-radius: var(--r-chip); }
:root[data-v-radius] .drawer-btn, :root[data-v-radius] .look-row,
:root[data-v-radius] button.btn-icon { border-radius: var(--r-btn); }
:root[data-v-radius] .tgevent, :root[data-v-radius] .modal { border-radius: var(--r-card); }

/* ---------------------------------------------------------------
   ASPECT 6 - ACCENT COLOUR  (data-v-accent)
   One accent. Desaturated enough to sit on a dark surface.
   --------------------------------------------------------------- */
:root[data-v-accent="1"]  { --accent-q:#5e6ad2; --accent-hi:#828fff; }  /* lavender-blue */
:root[data-v-accent="2"]  { --accent-q:#3b82f6; --accent-hi:#60a5fa; }  /* clean blue */
:root[data-v-accent="3"]  { --accent-q:#10b981; --accent-hi:#34d399; }  /* emerald */
:root[data-v-accent="4"]  { --accent-q:#f59e0b; --accent-hi:#fbbf24; }  /* amber */
:root[data-v-accent="5"]  { --accent-q:#ef4444; --accent-hi:#f87171; }  /* red */
:root[data-v-accent="6"]  { --accent-q:#8b5cf6; --accent-hi:#a78bfa; }  /* violet */
:root[data-v-accent="7"]  { --accent-q:#06b6d4; --accent-hi:#22d3ee; }  /* cyan */
:root[data-v-accent="8"]  { --accent-q:#ec4899; --accent-hi:#f472b6; }  /* pink */
:root[data-v-accent="9"]  { --accent-q:#a3a3a3; --accent-hi:#e5e5e5; }  /* no colour at all */
:root[data-v-accent="10"] { --accent-q:#d97757; --accent-hi:#e89b82; }  /* terracotta */

:root[data-v-accent] #treeRoot .tree-row input[type="checkbox"] { accent-color: var(--accent-q); }
:root[data-v-accent] .look-row.on { border-color: var(--accent-q); }
:root[data-v-accent] [data-tab].on { color: var(--accent-hi); }

/* ---------------------------------------------------------------
   ASPECT 7 - GOAL EMPHASIS  (data-v-emphasis)
   What tells you a top-level goal apart from a subtask.
   --------------------------------------------------------------- */
:root[data-v-emphasis="1"]  #treeRoot .tree-row[data-depth="0"] { box-shadow: inset 3px 0 0 0 var(--accent-q) !important; }
:root[data-v-emphasis]:not([data-v-emphasis="1"]):not([data-v-emphasis="9"]) #treeRoot .tree-row[data-depth="0"] { box-shadow: none; }
:root[data-v-emphasis="2"]  #treeRoot .tree-row[data-depth="0"] { background: var(--s-elevated); }
:root[data-v-emphasis="3"]  #treeRoot .tree-row[data-depth="0"] .tree-title { text-transform: uppercase; letter-spacing: .06em; font-size: 12px; }
:root[data-v-emphasis="4"]  #treeRoot .tree-row[data-depth="0"] { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 8px; }
:root[data-v-emphasis="5"]  #treeRoot .tree-row[data-depth="0"] .tree-title { color: var(--accent-hi); }
:root[data-v-emphasis="6"]  #treeRoot .tree-row[data-depth="0"] .tree-title::before { content:''; display:inline-block; width:6px; height:6px; border-radius:9999px; background:var(--accent-q); margin-right:8px; vertical-align:middle; }
:root[data-v-emphasis="7"]  #treeRoot .tree-row:not([data-depth="0"]) .tree-title { color: var(--t-2); }
:root[data-v-emphasis="8"]  #treeRoot .tree-row:not([data-depth="0"]) { padding-left: calc(var(--row-px, 8px) + 18px) !important; }
:root[data-v-emphasis="9"]  #treeRoot .tree-row[data-depth="0"] { box-shadow: inset 0 -1px 0 0 var(--line); }
:root[data-v-emphasis="10"] #treeRoot .tree-row[data-depth="0"] .tree-title { font-style: normal; }
:root[data-v-emphasis="10"] #treeRoot .tree-row:not([data-depth="0"]) .tree-title { opacity: .78; }

/* ---------------------------------------------------------------
   ASPECT 8 - DIVIDERS / HAIRLINES  (data-v-line)
   --------------------------------------------------------------- */
:root[data-v-line="1"]  { --line:#23252a; }
:root[data-v-line="2"]  { --line:#34343a; }
:root[data-v-line="3"]  { --line:transparent; }
:root[data-v-line="4"]  { --line:rgba(255,255,255,.06); }
:root[data-v-line="5"]  { --line:rgba(255,255,255,.14); }
:root[data-v-line="6"]  { --line:rgba(255,255,255,.24); }
:root[data-v-line="7"]  { --line:#1a1c20; }
:root[data-v-line="8"]  { --line:#3e3e44; }
:root[data-v-line="9"]  { --line:color-mix(in srgb, var(--accent-q) 26%, transparent); }
:root[data-v-line="10"] { --line:#2b2f36; }

:root[data-v-line] header#topbar { border-bottom: 1px solid var(--line); }
:root[data-v-line] #treeDrawer { border-bottom: 1px solid var(--line); }
:root[data-v-line] .drawer-btn { border: 1px solid var(--line); }

/* ---------------------------------------------------------------
   ASPECT 9 - CALENDAR EVENT BLOCK  (data-v-event)
   Custom properties, then one rule specific enough to win. The direct-styling
   version lost to `#dayView .tgevent` and to an existing !important on
   border-left-color - measured, not assumed.
   --------------------------------------------------------------- */
:root[data-v-event="1"]  { --ev-bg:var(--s-elevated); --ev-bd:0; --ev-lw:3px; --ev-lc:var(--accent-q); --ev-fg:var(--t-1); }
:root[data-v-event="2"]  { --ev-bg:color-mix(in srgb, var(--accent-q) 16%, var(--s-raised)); --ev-bd:1px solid color-mix(in srgb, var(--accent-q) 40%, transparent); --ev-lw:1px; --ev-lc:color-mix(in srgb, var(--accent-q) 40%, transparent); --ev-fg:var(--t-1); }
:root[data-v-event="3"]  { --ev-bg:transparent; --ev-bd:1px solid var(--line); --ev-lw:1px; --ev-lc:var(--line); --ev-fg:var(--t-2); }
:root[data-v-event="4"]  { --ev-bg:var(--accent-q); --ev-bd:0; --ev-lw:0px; --ev-lc:transparent; --ev-fg:#fff; }
:root[data-v-event="5"]  { --ev-bg:var(--s-top); --ev-bd:1px solid var(--line); --ev-lw:0px; --ev-lc:transparent; --ev-fg:var(--t-1); }
:root[data-v-event="6"]  { --ev-bg:var(--s-raised); --ev-bd:0; --ev-lw:2px; --ev-lc:var(--accent-hi); --ev-fg:var(--t-1); }
:root[data-v-event="7"]  { --ev-bg:color-mix(in srgb, var(--accent-q) 10%, transparent); --ev-bd:0; --ev-lw:4px; --ev-lc:var(--accent-q); --ev-fg:var(--t-1); }
:root[data-v-event="8"]  { --ev-bg:var(--s-base); --ev-bd:1px solid var(--accent-q); --ev-lw:1px; --ev-lc:var(--accent-q); --ev-fg:var(--t-2); }
:root[data-v-event="9"]  { --ev-bg:transparent; --ev-bd:0; --ev-lw:0px; --ev-lc:transparent; --ev-fg:var(--t-1); }
:root[data-v-event="10"] { --ev-bg:var(--s-elevated); --ev-bd:1px solid var(--line); --ev-lw:6px; --ev-lc:var(--accent-hi); --ev-fg:var(--t-1); }

:root[data-v-event] #dayView .tgevent,
:root[data-v-event] #weekView .tgevent,
:root[data-v-event] .tgevent {
  background: var(--ev-bg) !important;
  border: var(--ev-bd) !important;
  border-left: var(--ev-lw) solid var(--ev-lc) !important;
  color: var(--ev-fg) !important;
}

/* ---------------------------------------------------------------
   ASPECT 10 - CHIPS & BADGES  (data-v-chip)
   Same story: `#treeRoot .tag-chip` carries an ID and beat the plain
   attribute selector, so the values go through custom properties.
   --------------------------------------------------------------- */
:root[data-v-chip="1"]  { --ch-bg:transparent; --ch-bd:0; --ch-fg:var(--t-3); --ch-pad:0 4px;  --ch-w:400; }
:root[data-v-chip="2"]  { --ch-bg:var(--s-elevated); --ch-bd:0; --ch-fg:var(--t-2); --ch-pad:2px 8px; --ch-w:400; }
:root[data-v-chip="3"]  { --ch-bg:transparent; --ch-bd:1px solid var(--line); --ch-fg:var(--t-2); --ch-pad:1px 7px; --ch-w:400; }
:root[data-v-chip="4"]  { --ch-bg:color-mix(in srgb, var(--accent-q) 18%, transparent); --ch-bd:0; --ch-fg:var(--accent-hi); --ch-pad:2px 8px; --ch-w:500; }
:root[data-v-chip="5"]  { --ch-bg:var(--s-top); --ch-bd:1px solid var(--line); --ch-fg:var(--t-2); --ch-pad:3px 9px; --ch-w:400; }
:root[data-v-chip="6"]  { --ch-bg:transparent; --ch-bd:0; --ch-fg:var(--t-4); --ch-pad:0 3px;  --ch-w:400; }
:root[data-v-chip="7"]  { --ch-bg:#ffffff; --ch-bd:0; --ch-fg:#111111; --ch-pad:1px 7px; --ch-w:500; }
:root[data-v-chip="8"]  { --ch-bg:transparent; --ch-bd:0; --ch-fg:var(--t-3); --ch-pad:0 2px;  --ch-w:600; }
:root[data-v-chip="9"]  { --ch-bg:var(--s-raised); --ch-bd:0; --ch-fg:var(--t-3); --ch-pad:2px 6px; --ch-w:400; }
:root[data-v-chip="10"] { --ch-bg:transparent; --ch-bd:0; --ch-fg:var(--accent-q); --ch-pad:0 5px;  --ch-w:500; }

:root[data-v-chip] #treeRoot .tag-chip,
:root[data-v-chip] #treeRoot .time-chip,
:root[data-v-chip] .tag-chip,
:root[data-v-chip] .time-chip {
  background: var(--ch-bg) !important;
  border: var(--ch-bd) !important;
  color: var(--ch-fg) !important;
  padding: var(--ch-pad) !important;
  font-weight: var(--ch-w) !important;
}

/* ---------------------------------------------------------------
   THE PICKER ITSELF
   --------------------------------------------------------------- */
.vp-wrap { max-height: 62vh; overflow-y: auto; }
.vp-aspect { margin-bottom: 14px; }
.vp-aspect h4 {
  font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--t-3, #8a8f98); margin: 0 0 2px;
}
.vp-aspect p { font-size: 11px; color: var(--t-4, #62666d); margin: 0 0 6px; line-height: 1.45; }
.vp-opts { display: flex; flex-wrap: wrap; gap: 5px; }
.vp-opt {
  min-width: 30px; padding: 5px 0; cursor: pointer;
  background: var(--s-elevated, #1f2329); color: var(--t-2, #d0d6e0);
  border: 1px solid var(--line, #23252a); border-radius: 6px;
  font-size: 12px; font-weight: 500; text-align: center; flex: 1 1 30px;
}
.vp-opt:hover { color: var(--t-1, #fff); }
.vp-opt.on {
  border-color: var(--accent-q, #5e6ad2);
  box-shadow: inset 0 0 0 1px var(--accent-q, #5e6ad2);
  color: var(--t-1, #fff);
}
.vp-actions { display: flex; gap: 6px; margin-top: 4px; }
.vp-actions button { flex: 1 1 auto; font-size: 12px; padding: 7px 10px; border-radius: 8px; }

/* ---------------------------------------------------------------
   BOTTOM BAR ON DESKTOP  (asked for twice)
   Same shape as the phone app: Plan / Alarms / Settings along the bottom.
   --------------------------------------------------------------- */
:root[data-chrome="bottom"] #bottomBar {
  display: flex !important;
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  background: var(--s-raised, #191c21);
  border-top: 1px solid var(--line, #23252a);
  padding: 4px 0 6px;
}
:root[data-chrome="bottom"] #bottomBar [data-tab] {
  flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: none; border: 0; cursor: pointer;
  color: var(--t-3, #8a8f98); font-size: 11px; font-weight: 500; padding: 5px 0;
}
:root[data-chrome="bottom"] #bottomBar [data-tab] span:first-child { font-size: 17px; line-height: 1; }
:root[data-chrome="bottom"] #bottomBar [data-tab].on { color: var(--accent-hi, #828fff); }
:root[data-chrome="bottom"] #main { padding-bottom: 58px; }
:root[data-chrome="bottom"] #btnTreeToggle,
:root[data-chrome="bottom"] #btnSettings { display: none !important; }

/* The hidden ATTRIBUTE on #treeDrawer was inert: an author `display` rule beats
   the UA stylesheet's [hidden]{display:none}. That is why three separate code
   paths all "closed" the drawer and it stayed on screen. Make the attribute
   authoritative once, here, instead of patching a fourth caller. */
#treeDrawer[hidden] { display: none !important; }

/* =====================================================================
   o08  THE FLOATING VISUAL-FORMATS PANEL
   =====================================================================
   No scrim and no overlay: the app behind stays visible AND usable, which was
   the whole complaint - every choice applied instantly and the modal hid the
   result. Fixed positioning on document.body so a tree re-render cannot move
   or bury it.
   ===================================================================== */

#vpPanel {
  position: fixed;
  z-index: 90;
  display: flex;
  flex-direction: column;
  background: var(--s-raised, #191c21);
  border: 1px solid var(--line, #23252a);
  border-radius: 12px;
  box-shadow: 0 10px 34px rgba(0, 0, 0, .55);
  overflow: hidden;
  color: var(--t-1, #f7f8f8);
}

/* the drag handle */
.vp-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 8px 8px 12px;
  background: var(--s-elevated, #1f2329);
  border-bottom: 1px solid var(--line, #23252a);
  cursor: move;
  touch-action: none;          /* or the phone scrolls instead of dragging */
  user-select: none;
}
.vp-title { flex: 1 1 auto; font-size: 12px; font-weight: 600; letter-spacing: .01em; }
.vp-x {
  flex: 0 0 auto; width: 24px; height: 24px; line-height: 1;
  background: transparent; border: 1px solid var(--line, #23252a); border-radius: 6px;
  color: var(--t-2, #d0d6e0); font-size: 13px; cursor: pointer;
}
.vp-x:hover { color: var(--t-1, #fff); background: var(--s-top, #272c34); }

.vp-body { flex: 1 1 auto; overflow-y: auto; padding: 10px 12px 4px; }
.vp-note { font-size: 11px; line-height: 1.5; color: var(--t-3, #8a8f98); margin: 0 0 10px; }

.vp-aspect { margin-bottom: 11px; }
.vp-head { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.vp-head h4 {
  flex: 1 1 auto; margin: 0;
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--t-3, #8a8f98);
}
.vp-nav { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; }
.vp-step {
  width: 22px; height: 22px; line-height: 1; padding: 0;
  background: var(--s-elevated, #1f2329); color: var(--t-2, #d0d6e0);
  border: 1px solid var(--line, #23252a); border-radius: 5px;
  font-size: 13px; cursor: pointer;
}
.vp-step:hover { color: var(--t-1, #fff); }
.vp-num {
  min-width: 20px; text-align: center;
  font-size: 11px; font-weight: 600; color: var(--t-2, #d0d6e0);
  font-variant-numeric: tabular-nums;
}

.vp-opts { display: flex; flex-wrap: wrap; gap: 4px; }
.vp-opt {
  flex: 1 1 26px; min-width: 26px; padding: 5px 0;
  background: var(--s-elevated, #1f2329); color: var(--t-2, #d0d6e0);
  border: 1px solid var(--line, #23252a); border-radius: 6px;
  font-size: 11px; font-weight: 500; text-align: center; cursor: pointer;
}
.vp-opt:hover { color: var(--t-1, #fff); }
.vp-opt.on {
  border-color: var(--accent-q, #5e6ad2);
  box-shadow: inset 0 0 0 1px var(--accent-q, #5e6ad2);
  color: var(--t-1, #fff);
}

.vp-foot {
  flex: 0 0 auto; padding: 8px 12px 12px;
  border-top: 1px solid var(--line, #23252a);
}
.vp-reset {
  width: 100%; padding: 7px 10px;
  background: var(--s-elevated, #1f2329); color: var(--t-2, #d0d6e0);
  border: 1px solid var(--line, #23252a); border-radius: 8px;
  font-size: 12px; cursor: pointer;
}
.vp-reset:hover { color: var(--t-1, #fff); }

/* the resize corner */
.vp-grip {
  position: absolute; right: 0; bottom: 0; width: 18px; height: 18px;
  cursor: nwse-resize; touch-action: none;
  background:
    linear-gradient(135deg, transparent 0 46%, var(--t-4, #62666d) 46% 54%, transparent 54% 100%),
    linear-gradient(135deg, transparent 0 66%, var(--t-4, #62666d) 66% 74%, transparent 74% 100%);
}

/* The old modal path is gone; keep the wrapper harmless if anything still
   references it. */
.vp-wrap { max-height: none; overflow: visible; }

/* the row the arrow keys are pointing at */
.vp-aspect.cur > .vp-head h4 { color: var(--accent-hi, #828fff); }
.vp-aspect.cur {
  box-shadow: inset 2px 0 0 0 var(--accent-q, #5e6ad2);
  padding-left: 7px; margin-left: -9px;
}
/* a click that makes a row current must not also select its label text */
.vp-aspect h4, .vp-num, .vp-note { user-select: none; }

/* ===== o09  "show me where" =====
   Selecting an aspect outlines the real elements it changes, on the live
   screen, for a couple of seconds. The operator could not tell whether an
   aspect affected the main screen, the calendar or Settings; a numbered square
   in a box cannot answer that, so point at the thing itself. */
.vp-spot {
  outline: 2px solid var(--accent-hi, #828fff) !important;
  outline-offset: 1px;
  animation: vpPulse 1.1s ease-in-out 2;
}
@keyframes vpPulse {
  0%, 100% { outline-color: var(--accent-hi, #828fff); }
  50%      { outline-color: transparent; }
}

/* where each aspect lives, in plain words, under its name */
.vp-where {
  font-size: 10px; line-height: 1.4; color: var(--t-4, #62666d);
  margin: 0 0 5px;
}
.vp-aspect.cur .vp-where { color: var(--t-3, #8a8f98); }

/* A bigger, unmistakable drag handle. The old one was a thin strip and the
   operator could not get hold of it. */
.vp-bar { padding: 10px 8px 10px 10px; }
.vp-bar::before {
  content: '\2059\2059';
  flex: 0 0 auto; letter-spacing: -2px;
  color: var(--t-4, #62666d); font-size: 13px; margin-right: 2px;
}

/* =====================================================================
   o10  REFERENCE PALETTE
   =====================================================================
   Colours and shapes taken from the app the operator likes. Structure is NOT
   copied - the priority tree stays exactly as it is. Operator 2026-08-18:
   "I don't want the task set up, I want the priority tree. When I meant the
   layout, I meant the coloring and shapes of things."

   These carry !important because the 10x10 variation blocks are attribute
   selectors and would otherwise outrank a plain :root. The variation picker is
   on hold, so this is the single source of colour for now.
   ===================================================================== */
:root {
  --s-base:      #1c1f26 !important;   /* the page */
  --s-raised:    #262a33 !important;   /* cards, panels, the tree side */
  --s-elevated:  #2f343e !important;   /* hover, dropdown rows */
  --s-top:       #333844 !important;   /* dialogs above everything */

  --t-1:         #e8eaed !important;   /* titles */
  --t-2:         #9aa0a8 !important;   /* the detail line under a title */
  --t-3:         #6b7280 !important;   /* times, counts */
  --t-4:         #565d68 !important;   /* the faintest text */

  --accent-q:    #4c9aff !important;   /* today, focus, tick boxes */
  --accent-hi:   #6fb0ff !important;
  --accent-warm: #f0a933 !important;   /* used sparingly, like their gold */

  --line:        #333844 !important;   /* card edges */
  --grid-line:   #2c313a !important;   /* calendar hour lines */
  --past-tint:   #3a2529 !important;   /* the wash over days already gone */

  --r-card:      8px !important;
  --r-chip:      4px !important;
  --r-input:     6px !important;
  --r-box:       4px !important;
}

/* ---- surfaces ---- */
body, html { background: var(--s-base); }
aside#treePane, section#rightPane, header#topbar { background: var(--s-raised); }
#treeDrawer { background: var(--s-raised); }

/* ---- the tree rows as cards, the shape from the reference ---- */
#treeRoot .tree-row {
  background: var(--s-raised);
  border: 1px solid var(--line);
  border-radius: var(--r-card) !important;
  margin: 3px 6px;
}
#treeRoot .tree-row:hover { background: var(--s-elevated); }
#treeRoot .tree-title { color: var(--t-1); }
#treeRoot .tree-row[data-depth="0"] .tree-title { font-weight: 600; }

/* ---- controls ---- */
#treeRoot .tree-row input[type="checkbox"] {
  accent-color: var(--accent-q);
  border-radius: var(--r-box);
  width: 15px; height: 15px;
}
input[type="text"], input[type="date"], input[type="time"], textarea, select {
  background: var(--s-base);
  color: var(--t-1);
  border: 1px solid var(--line);
  border-radius: var(--r-input);
}
input:focus, textarea:focus, select:focus {
  outline: 2px solid var(--accent-q);
  outline-offset: -1px;
  border-color: transparent;
}

/* ---- calendar ---- */
.tghour-line, .tghalf-line { border-color: var(--grid-line) !important; }
.tgevent {
  background: var(--s-raised) !important;
  border: 1px solid var(--line) !important;
  border-left: 3px solid var(--accent-q) !important;
  border-radius: var(--r-chip) !important;
  color: var(--t-1) !important;
}
.tgcol.past, .tgcol[data-past="1"] { background: var(--past-tint); }
.tgnow { border-top-color: var(--accent-q); }

/* ---- small labels ---- */
.time-chip, .tag-chip {
  background: transparent !important;
  border: 1px solid var(--line) !important;
  color: var(--t-3) !important;
  border-radius: var(--r-chip) !important;
  padding: 1px 6px !important;
}

/* ---- buttons and the bottom bar ---- */
.drawer-btn, button.btn-icon {
  background: var(--s-elevated);
  color: var(--t-2);
  border: 1px solid var(--line);
  border-radius: var(--r-input);
}
.drawer-btn:hover, button.btn-icon:hover { color: var(--t-1); }
#bottomBar { background: var(--s-raised); border-top: 1px solid var(--line); }
#bottomBar [data-tab] { color: var(--t-3); }
#bottomBar [data-tab].on { color: var(--accent-q); }

/* The note lines are textareas now, not single-line inputs. A textarea that
   still looks like a line of a notepad: no resize grip, no scrollbar, wraps,
   and grows to fit what is in it. */
.note-line {
  display: block; width: 100%;
  background: transparent !important;
  border: 0 !important; outline: none !important;
  padding: 2px 4px; margin: 0;
  color: var(--t-1);
  font-family: inherit; line-height: 1.5;
  resize: none; overflow: hidden;
  white-space: pre-wrap; word-wrap: break-word;
  min-height: 1.5em;
}
.note-line:focus { background: rgba(76,154,255,.07) !important; border-radius: 3px; }
.note-box { background: var(--s-base); border: 1px solid var(--line); border-radius: var(--r-input); }
.note-lines { padding: 6px 4px; max-height: 320px; overflow-y: auto; }
.note-bar {
  display: flex; gap: 4px; padding: 5px 6px;
  border-top: 1px solid var(--line); background: var(--s-raised);
}
.note-btn {
  min-width: 26px; padding: 3px 7px; cursor: pointer;
  background: var(--s-elevated); color: var(--t-2);
  border: 1px solid var(--line); border-radius: 5px; font-size: 12px;
}
.note-btn.on { color: var(--accent-q); border-color: var(--accent-q); }

/* =====================================================================
   o11  CALENDAR GEOMETRY + THE BAR UNDER THE TREE
   ===================================================================== */

/* BUG 1 - an event spanning several day columns.
   Events are position:absolute inside .tgcol and are given a PIXEL width
   (el.style.width = Math.round(b.w)+'px') computed against the wrong container,
   so in week view - where each column is a seventh of the grid - the box runs
   across the following days. The column is position:relative, so clamping to
   its own box is enough and keeps side-by-side overlapping events working. */
.tgcol > .tgevent,
#weekGrid .tgevent,
#dayView .tgevent {
  max-width: calc(100% - 2px) !important;
  box-sizing: border-box;
}

/* BUG 2 - hour lines running straight through the day separators, so several
   days read as one block. The separators exist but were drawn in --border,
   which is invisible against the new palette, and sat under the lines. Give
   them the palette colour, full height, and put them above. */
.tgcols { z-index: 2 !important; }
.tglines { z-index: 0 !important; }
.tgcol {
  border-left: 1px solid var(--line, #333844) !important;
  position: relative;
}
.tgcol:first-child { border-left: 0 !important; }
/* the separator itself, drawn over the hour lines for the full height */
.tgcol::before {
  content: '';
  position: absolute; left: -1px; top: 0; bottom: 0; width: 1px;
  background: var(--line, #333844);
  pointer-events: none;
  z-index: 3;
}
.tgcol:first-child::before { display: none; }

/* BUG 3 - day columns you can widen or narrow.
   The grid was a hard repeat(7, 1fr). Driving it from a variable lets the
   column width be changed and remembered without touching the markup. */
:root { --tg-cols: 7; --tg-colw: 1fr; }
.tgcols { grid-template-columns: repeat(var(--tg-cols), var(--tg-colw)) !important; }
:root[data-colw="narrow"] .tgcols { --tg-colw: minmax(64px, 1fr); }
:root[data-colw="wide"]   .tgcols { --tg-colw: minmax(180px, 1fr); }
:root[data-colw="wide"]   .tgscroll { overflow-x: auto; }

/* THE BOTTOM BAR BELONGS UNDER THE PRIORITY TREE ONLY.
   It spanned the whole window and butted against the calendar. It must sit
   inside the left pane and stop at the splitter. */
:root[data-chrome="bottom"] #bottomBar {
  position: absolute !important;
  left: 0 !important;
  right: auto !important;
  bottom: 0 !important;
  width: 100% !important;
  border-top: 1px solid var(--line, #333844);
  border-right: 1px solid var(--line, #333844);
}
:root[data-chrome="bottom"] aside#treePane {
  position: relative;
  padding-bottom: 58px;
}
:root[data-chrome="bottom"] #main { padding-bottom: 0 !important; }
:root[data-chrome="bottom"] section#rightPane { padding-bottom: 0 !important; }

/* BUG 9 (operator) - the typing fix flickers.
   Restoring the caret after a redraw repaints the row, which reads as a flash.
   Suppress the row's transition/animation while a field inside it has focus. */
#treeRoot .tree-row:focus-within,
#treeRoot .tree-row:focus-within * {
  animation: none !important;
  transition: none !important;
}

/* =====================================================================
   o12  THE BAR IS PINNED TO THE BOTTOM OF THE TREE, ALWAYS
   =====================================================================
   Screenshot 2026-08-19: the bar sat in the MIDDLE of the list with tasks
   rendered below it. Yesterday I moved it inside the tree pane but left it
   absolutely positioned, so it parked at the pane's bottom edge while the list
   kept drawing past it.
   #treePane is already `display:flex; flex-direction:column`, so the honest fix
   is to let the bar BE the last flex child and give the list above it the job
   of scrolling. No absolute positioning, nothing to drift.
   ===================================================================== */

:root[data-chrome="bottom"] aside#treePane,
:root[data-chrome="bottom"] #treePane {
  display: flex !important;
  flex-direction: column !important;
  min-height: 0;
  padding-bottom: 0 !important;   /* the bar occupies real space now */
  overflow: hidden;
}

/* the list takes all remaining height and scrolls inside itself -
   which also gives the tree a proper mouse wheel */
:root[data-chrome="bottom"] #treePane #treeRoot {
  flex: 1 1 auto !important;
  min-height: 0 !important;
  overflow-y: auto !important;
  overscroll-behavior: contain;
}

/* the bar: last in the column, never scrolls away, never overlaps a row */
:root[data-chrome="bottom"] #treePane > #bottomBar {
  position: static !important;
  order: 999;
  flex: 0 0 auto !important;
  margin-top: auto !important;
  width: 100% !important;
  left: auto !important; right: auto !important; bottom: auto !important;
  border-top: 1px solid var(--line, #333844);
  border-right: 0;
  background: var(--s-raised, #262a33);
  z-index: 5;
}

/* anything the tree renders after the list - the "3 hidden / Show them /
   3 overdue" strip - belongs ABOVE the bar, not below it */
:root[data-chrome="bottom"] #treePane > *:not(#bottomBar) { order: 1; }

/* =====================================================================
   o13  YOU CAN SEE WHAT BELONGS TO WHAT
   =====================================================================
   Indentation alone was too subtle to tell a child from a top-level item.
   A vertical guide runs down each level, so a branch and everything inside it
   read as one group.
   ===================================================================== */

#treeRoot .tree-row { position: relative; }

/* the guide for this row's own level */
#treeRoot .tree-row[data-depth]:not([data-depth="0"])::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 1px;
  background: var(--line, #333844);
  pointer-events: none;
}
#treeRoot .tree-row[data-depth="1"]::after { left: 15px; }
#treeRoot .tree-row[data-depth="2"]::after { left: 33px; }
#treeRoot .tree-row[data-depth="3"]::after { left: 51px; }
#treeRoot .tree-row[data-depth="4"]::after { left: 69px; }

/* a top-level item gets clear air above it, so groups separate */
#treeRoot .tree-row[data-depth="0"] { margin-top: 8px; }
#treeRoot .tree-row[data-depth="0"]:first-child { margin-top: 2px; }

/* a branch that is folded says how much is hidden inside it */
#treeRoot .tree-row.is-collapsed > .tree-title::after {
  content: attr(data-kids);
  margin-left: 8px;
  font-size: 10px;
  color: var(--t-3, #6b7280);
  background: var(--s-elevated, #2f343e);
  border-radius: 9px;
  padding: 1px 6px;
  vertical-align: middle;
}

/* The area dot is removed at the operator's request. Nesting is shown by the
   guide lines and the indentation now, so the dot only added noise. */
#treeRoot .area-dot { display: none !important; }

/* Numbers next to a folded branch: removed at the operator's request. */
#treeRoot .tree-row.is-collapsed > .tree-title::after { content: none !important; }

/* The marker is a HOLLOW RED SQUARE - red outline, nothing inside - and it gets
   smaller the deeper the row sits, so a branch, its children and their children
   are told apart at a glance. */
#treeRoot .tree-row > .tree-marker {
  flex: 0 0 auto;
  display: inline-block;
  border: 1.5px solid #e5484d;
  background: transparent;
  border-radius: 1px;
  margin-right: 2px;
}
#treeRoot .tree-row[data-depth="0"] > .tree-marker { width: 10px; height: 10px; }
#treeRoot .tree-row[data-depth="1"] > .tree-marker { width: 8px;  height: 8px; }
#treeRoot .tree-row[data-depth="2"] > .tree-marker { width: 6px;  height: 6px; border-width: 1.25px; }
#treeRoot .tree-row[data-depth="3"] > .tree-marker { width: 5px;  height: 5px; border-width: 1px; }
#treeRoot .tree-row[data-depth="4"] > .tree-marker { width: 4px;  height: 4px; border-width: 1px; }

/* ===== o15  the LAST red dots, and real indentation at every level =====
   The dots that survived were never elements - they are ::before
   pseudo-elements (the overdue marker and a goal marker), which is why
   removing three dot CLASSES from the DOM did nothing to them. */
#treeRoot .tree-row.overdue .tree-title::before,
#treeRoot .tree-row[data-depth="0"] .tree-title::before { content: none !important; }

/* Indentation must step visibly at EVERY level, not just the first two.
   28px per level, with the guide line following it. */
#treeRoot .tree-row[data-depth="0"] { padding-left: 6px !important; }
#treeRoot .tree-row[data-depth="1"] { padding-left: 34px !important; }
#treeRoot .tree-row[data-depth="2"] { padding-left: 62px !important; }
#treeRoot .tree-row[data-depth="3"] { padding-left: 90px !important; }
#treeRoot .tree-row[data-depth="4"] { padding-left: 118px !important; }
#treeRoot .tree-row[data-depth="5"] { padding-left: 146px !important; }
#treeRoot .tree-row[data-depth="1"]::after { left: 20px !important; }
#treeRoot .tree-row[data-depth="2"]::after { left: 48px !important; }
#treeRoot .tree-row[data-depth="3"]::after { left: 76px !important; }
#treeRoot .tree-row[data-depth="4"]::after { left: 104px !important; }
#treeRoot .tree-row[data-depth="5"]::after { left: 132px !important; }

/* A parent shown as context for its children was dimmed to 45% and italicised
   (.ancestor-muted). The operator reads that as the branch being switched off.
   A parent should look like a parent. */
#treeRoot .tree-row.ancestor-muted { opacity: 1 !important; }
#treeRoot .tree-row.ancestor-muted .tree-title { font-style: normal !important; }
#treeRoot .tree-row.ancestor-muted .tree-check,
#treeRoot .tree-row.ancestor-muted .tree-marker { opacity: 1 !important; }

/* the permanent branch offers no delete control */
#treeRoot .tree-row.is-permanent .btn-danger { display: none !important; }

/* The permanent home branch offers no way to delete it - the row's own delete
   button AND the delete entry in its row menu. Hiding only .btn-danger left the
   menu route open. */
#treeRoot .tree-row.is-permanent .btn-danger,
#treeRoot .tree-row.is-permanent .tree-delete,
#treeRoot .tree-row.is-permanent .rowmenu,
#treeRoot .tree-row.is-permanent .tree-actions .btn-danger { display: none !important; }

/* No done tick box on the permanent home branch - it is a container, not a task,
   and ticking it made no sense. Every real task keeps its tick box. */
#treeRoot .tree-row.is-permanent .tree-check { display: none !important; }

/* No done tick box on a BRANCH - only on a task you can actually finish.
   A branch is any row with a fold triangle, i.e. one that has children. */
#treeRoot .tree-row:has(> .tree-caret) > .tree-check { display: none !important; }
#treeRoot .tree-row.is-permanent > .tree-check { display: none !important; }

/* The done tick box is removed everywhere, at the operator's instruction -
   branches, tasks, subtasks, every depth, and the edit screen. Marking a task
   complete is still available from the row menu, so nothing is stranded. */
#treeRoot .tree-check,
#treeRoot input[type="checkbox"].tree-check,
#treeRoot .tree-row > input[type="checkbox"],
.ea-body input[type="checkbox"].tree-check { display: none !important; }

/* A task with a date in the PAST must always show in its branch. The tree hides
   dated tasks until their day arrives; that is right for a future date and wrong
   for one already gone - the task simply vanished from the branch it lives in.
   .overdue is stamped on exactly those rows, so force them visible. */
#treeRoot .tree-row.overdue { display: flex !important; }

/* The calendar-housing rule is parked. It moved a dated task out of the branch
   the operator had put it in - twice - which is worse than the problem it
   solved. Tasks now stay exactly where they are placed. Nothing is lost: the
   Unbranched branch is still there and still permanent, it just no longer
   pulls things into itself. */

/* Day separators you can actually SEE.
   Measured: the lines were rgb(51,56,68) on a rgb(28,31,38) page - about twenty
   units of contrast, which reads as no line at all, so the week ran together as
   one block. Each day now owns a clearly visible full-height edge drawn above
   the hour lines and above the events. */
:root { --day-edge: #4d566b; }
#weekGrid .tgcol, .tgcols .tgcol {
  border-left: 1px solid var(--day-edge) !important;
  position: relative;
}
#weekGrid .tgcol::before, .tgcols .tgcol::before {
  content: '' !important;
  position: absolute !important;
  left: -1px; top: 0; bottom: 0;
  width: 1px !important;
  background: var(--day-edge) !important;
  z-index: 6 !important;
  pointer-events: none;
}
.tgcols .tgcol:first-child::before { display: none !important; }
/* the hour lines stay quiet so the day edges dominate */
.tghour-line { border-top-color: #262b34 !important; }
.tghalf-line { border-top-color: #21252c !important; }

/* ===== o16  ONE COLUMN PER DAY, PROPORTIONAL AT ANY WIDTH =====
   Measured from the operator's screenshot: headers evenly ~273px apart while
   the columns below were 180px, 180px, 513px, 490px - so an event sat across
   three days and no line matched its date.
   Cause: `repeat(7, 1fr)`. A `1fr` track is `minmax(auto, 1fr)`, and `auto`
   refuses to shrink below the content's minimum width - so a long task title
   physically widened its own day and squeezed the rest. `minmax(0, 1fr)` is the
   fix: seven exactly equal shares whatever the calendar is resized to. */
.tgcols {
  grid-template-columns: repeat(7, minmax(0, 1fr)) !important;
}
#dayView .tgcols { grid-template-columns: minmax(0, 1fr) !important; }

/* An event must never widen its column. It wraps inside its own day. */
.tgcol { min-width: 0 !important; overflow: hidden; }
.tgevent {
  min-width: 0 !important;
  max-width: 100% !important;
  overflow: hidden;
  white-space: normal !important;
  word-break: break-word;
}
.tgevent-title {
  min-width: 0 !important;
  white-space: normal !important;
  overflow-wrap: anywhere;
  display: block;
}
.tgevent-time { flex: 0 0 auto; }

/* The day line runs the full height of the grid, top to bottom. */
.tgcols .tgcol::before {
  content: '' !important;
  position: absolute !important;
  left: -1px; top: 0; bottom: 0;
  width: 1px !important;
  background: var(--day-edge, #4d566b) !important;
  z-index: 6 !important;
  pointer-events: none;
}
.tgbody { position: relative; }

/* ===== o17  NO FLICKER ON THE HIDDEN-COUNT STRIP =====
   Measured: `.ahead-state` and its parent both carried `transition: all`.
   `all` animates EVERY property that changes - including width, height and
   layout - so each time the count updated the strip visibly jumped. Transitions
   belong on colour and opacity, never on layout, and never as `all`. */
#treePane .ahead-state,
#treePane .ahead-state * ,
#treePane .ahead-state + *,
.ahead-state {
  transition: color .12s ease, background-color .12s ease !important;
  animation: none !important;
}
/* reserve the line so a changing count cannot reflow the rows above it */
#treePane .ahead-state {
  display: inline-block;
  min-height: 17px;
  line-height: 17px;
  vertical-align: middle;
}
/* the strip's own row keeps a fixed height whether it says 0 or 12 */
#treePane .ahead-state, #treePane .ahead-state ~ * { will-change: auto; }

/* One caret per row. A duplicate caret wired to a dead id looks exactly like a
   triangle that does nothing when clicked. */
#treeRoot .tree-row > .tree-caret ~ .tree-caret { display: none !important; }
/* ===== o18  THE BUILD VERSION, TOP RIGHT =====
   It was hidden in the UI, which made "which build am I on" unanswerable
   without opening Settings. Fixed positioning so it can never push the top bar
   around - the last time a version line was added inline it wrapped the bar and
   knocked the month arrows off screen. */
#buildStamp {
  display: block !important;
  position: fixed !important;
  top: 10px;
  right: 12px;
  z-index: 80;
  font-size: 10px;
  line-height: 1;
  letter-spacing: .02em;
  color: var(--t-3, #6b7280);
  background: transparent;
  padding: 4px 6px;
  border-radius: 5px;
  pointer-events: none;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
@media (max-width: 700px) {
  #buildStamp { top: 6px; right: 6px; font-size: 9px; }
}

/* ===== o19  the Repeat panel ===== */
.rep-wrap { margin: 10px 0; }
.rep-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; cursor: pointer;
  background: var(--s-base, #1c1f26);
  border: 1px solid var(--accent-q, #4c9aff);
  border-radius: var(--r-input, 6px);
}
.rep-label { font-size: 13px; color: var(--accent-q, #4c9aff); }
.rep-value { font-size: 13px; font-weight: 600; color: var(--t-1, #e8eaed); }
.rep-body {
  margin-top: 8px; padding: 12px;
  background: var(--s-raised, #262a33);
  border: 1px solid var(--line, #333844);
  border-radius: var(--r-card, 8px);
}
.rep-sub { font-size: 12px; color: var(--t-2, #9aa0a8); margin: 10px 0 6px; }
.rep-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; }
.rep-n { width: 58px; }
.rep-freq, .rep-unit, .rep-n {
  background: var(--s-elevated, #2f343e); color: var(--t-1, #e8eaed);
  border: 1px solid var(--line, #333844); border-radius: 6px; padding: 5px 8px; font-size: 12px;
}
.rep-days { display: flex; flex-wrap: wrap; gap: 5px; }
.rep-day {
  min-width: 38px; padding: 5px 7px; cursor: pointer; font-size: 12px;
  background: var(--s-elevated, #2f343e); color: var(--t-2, #9aa0a8);
  border: 1px solid var(--line, #333844); border-radius: 5px;
}
.rep-day.on {
  background: var(--accent-q, #4c9aff); color: #fff;
  border-color: var(--accent-q, #4c9aff);
}
.rep-dates { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 4px; }
.rep-datebtn {
  background: var(--s-elevated, #2f343e); color: var(--t-1, #e8eaed);
  border: 1px solid var(--line, #333844); border-radius: 6px;
  padding: 6px 10px; font-size: 12px; cursor: pointer;
}

.rep-warn{margin-top:10px;padding:8px 10px;font-size:11px;line-height:1.5;border-radius:6px;
  color:#ffd9a0;background:rgba(240,169,51,.12);border:1px solid rgba(240,169,51,.4);}

/* the Level row is removed at the operator's request */
.ea-levelrow { display: none !important; }

/* One continuous notepad - select across paragraphs like anywhere else. */
.note-full {
  display: block; width: 100%; min-height: 160px; max-height: 46vh;
  padding: 10px 12px; resize: vertical; overflow-y: auto;
  background: var(--s-base, #1c1f26); color: var(--t-1, #e8eaed);
  border: 1px solid var(--line, #333844); border-radius: var(--r-input, 6px);
  font-family: inherit; font-size: 13px; line-height: 1.6;
  white-space: pre-wrap; word-wrap: break-word;
}
.note-full:focus { outline: 2px solid var(--accent-q, #4c9aff); outline-offset: -1px; }
.note-box { background: transparent; border: 0; }
.note-lines, .note-bar { display: none !important; }

/* One notepad you can select right across, that can still be styled. */
.note-rich {
  display: block; width: 100%; min-height: 160px; max-height: 46vh;
  overflow-y: auto; padding: 10px 12px;
  background: var(--s-base, #1c1f26); color: var(--t-1, #e8eaed);
  border: 1px solid var(--line, #333844);
  border-radius: var(--r-input, 6px) var(--r-input, 6px) 0 0;
  font-family: inherit; font-size: 13px; line-height: 1.6;
  white-space: pre-wrap; word-wrap: break-word; outline: none;
}
.note-rich:focus { outline: 2px solid var(--accent-q, #4c9aff); outline-offset: -1px; }
.note-bar2 {
  display: flex; gap: 4px; flex-wrap: wrap; padding: 6px 8px;
  background: var(--s-raised, #262a33);
  border: 1px solid var(--line, #333844); border-top: 0;
  border-radius: 0 0 var(--r-input, 6px) var(--r-input, 6px);
}
.note-tool {
  min-width: 28px; padding: 4px 8px; cursor: pointer; font-size: 12px;
  background: var(--s-elevated, #2f343e); color: var(--t-2, #9aa0a8);
  border: 1px solid var(--line, #333844); border-radius: 5px;
}
.note-tool:hover { color: var(--t-1, #e8eaed); }
.note-full, .note-lines, .note-bar { display: none !important; }

/* picking the dates for "On specific dates" */
.rep-datelist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.rep-adddate {
  padding: 6px 10px; cursor: pointer; font-size: 12px;
  background: var(--accent-q, #4c9aff); color: #fff;
  border: 0; border-radius: 6px;
}
.rep-datechip {
  padding: 5px 9px; cursor: pointer; font-size: 12px;
  background: var(--s-elevated, #2f343e); color: var(--t-1, #e8eaed);
  border: 1px solid var(--line, #333844); border-radius: 6px;
  font-variant-numeric: tabular-nums;
}
.rep-datechip:hover { border-color: #e5484d; color: #ffb4b7; }

/* the date picker must sit ABOVE the edit dialog, or "+ Add a date" looks dead */
.al-pop, .datepop { z-index: 200 !important; }

/* A task at 23:30 lasting an hour ran past the bottom of the grid - the grid
   ended exactly at midnight with nothing below it. Give the scroll area an
   hour of room underneath so late events sit inside it. The hour lines are
   positioned absolutely, so this adds space without moving any of them. */
/* A minimum height on the BODY stretched the last hour: the hour lines are
   spaced from the body's own height, so forcing it taller than
   (hours x 40px) left a gap that did not match the other hours. The room for a
   late event belongs on the SCROLL container instead, which does not feed the
   hour spacing at all. */
/* Room for a late event goes INSIDE the grid body as padding, not below it on
   the scroller. Padding on the scroller put empty space underneath the day
   columns, and an event dropped there landed on nothing - which broke dragging
   an event to another day. Hour lines are positioned from the body's top, so
   bottom padding does not disturb their spacing. */
.tgbody { padding-bottom: 64px; }

/* The current-time bar was re-created on every redraw and animated each time,
   which read as flicker. It moves, it does not fade. */
.tgnow, .tgnow-dot { transition: none !important; animation: none !important; }
.tgnow ~ .tgnow { display: none !important; }
/* the inline month grid for "On specific dates" */
.sd-cal { margin-top: 12px; }
.sd-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sd-title { font-size: 13px; font-weight: 600; color: var(--t-1, #e8eaed); }
.sd-nav {
  width: 28px; height: 26px; cursor: pointer; font-size: 15px; line-height: 1;
  background: var(--s-elevated, #2f343e); color: var(--t-1, #e8eaed);
  border: 1px solid var(--line, #333844); border-radius: 6px;
}
.sd-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.sd-dow { text-align: center; font-size: 10px; color: var(--t-3, #6b7280); padding: 2px 0; }
.sd-blank { height: 30px; }
.sd-day {
  height: 30px; cursor: pointer; font-size: 12px;
  background: var(--s-elevated, #2f343e); color: var(--t-1, #e8eaed);
  border: 1px solid var(--line, #333844); border-radius: 6px;
}
.sd-day:hover { border-color: var(--accent-q, #4c9aff); }
.sd-day.on {
  background: var(--accent-q, #4c9aff); color: #fff; font-weight: 600;
  border-color: var(--accent-q, #4c9aff);
}
.sd-count { margin-top: 8px; font-size: 11px; color: var(--t-3, #6b7280); }
.rep-datelist, .rep-adddate { display: none !important; }

/* The edit dialog must scroll. With the Repeat panel and a month grid inside it,
   the days fell below the bottom of the screen and could not be clicked at all -
   which is why "no options" kept coming back however many times the picker was
   rebuilt. */
.modal { max-height: 88vh; display: flex; flex-direction: column; }
.modal > *:not(.modal-actions):not(.modal-buttons) { min-height: 0; }
.ea-body, .modal-body { overflow-y: auto; max-height: 72vh; }
.modal:has(.rep-wrap) { overflow-y: auto; }
.rep-body { max-height: none; }

/* The dialog must be able to reach its own bottom, or the month grid sits below
   the screen edge and cannot be clicked - which is what "no options" was. */
.modal { max-height: 90vh; overflow-y: auto; }
.sd-cal { padding-bottom: 4px; }

/* THE ACTUAL CAUSE of "no options to choose".
   Measured: a day button reported top=0 bottom=0 - zero size - and
   elementFromPoint at its centre returned the modal backdrop. The month grid was
   being placed inside the repeat panel's body while that body was still
   display:none, so it rendered with no size at all and every click fell through
   to the backdrop behind it. Three pickers were rebuilt chasing this; none of
   them was ever the problem.
   Whenever the panel holds content, the panel is shown. */
.rep-body:has(.sd-cal),
.rep-body:has(.rep-freq) { display: block !important; }
.sd-cal { display: block; }
.sd-day { min-height: 30px; }

/* The date and time fields were drawing their hour/minute spinners in the
   browser's default light style, which looked pasted in. `color-scheme` is what
   tells the browser to render its own controls dark - styling the input alone
   never reaches those inner parts. */
:root { color-scheme: dark; }
input[type="date"], input[type="time"], input[type="datetime-local"], select {
  color-scheme: dark;
  background: var(--s-base, #1c1f26) !important;
  color: var(--t-1, #e8eaed) !important;
  border: 1px solid var(--line, #333844) !important;
  border-radius: var(--r-input, 6px) !important;
  padding: 6px 8px;
  font-family: inherit; font-size: 13px;
}
input[type="date"]:focus, input[type="time"]:focus, select:focus {
  outline: 2px solid var(--accent-q, #4c9aff); outline-offset: -1px;
}
/* the little calendar/clock buttons inside the field */
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator {
  filter: invert(0.8); cursor: pointer; opacity: .8;
}
input[type="date"]::-webkit-calendar-picker-indicator:hover,
input[type="time"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }
/* hour / minute / am-pm segments */
input[type="time"]::-webkit-datetime-edit-hour-field,
input[type="time"]::-webkit-datetime-edit-minute-field,
input[type="time"]::-webkit-datetime-edit-ampm-field,
input[type="date"]::-webkit-datetime-edit-month-field,
input[type="date"]::-webkit-datetime-edit-day-field,
input[type="date"]::-webkit-datetime-edit-year-field { color: var(--t-1, #e8eaed); }
input[type="time"]::-webkit-datetime-edit-hour-field:focus,
input[type="time"]::-webkit-datetime-edit-minute-field:focus,
input[type="time"]::-webkit-datetime-edit-ampm-field:focus,
input[type="date"]::-webkit-datetime-edit-month-field:focus,
input[type="date"]::-webkit-datetime-edit-day-field:focus,
input[type="date"]::-webkit-datetime-edit-year-field:focus {
  background: var(--accent-q, #4c9aff); color: #fff; border-radius: 3px;
}
input[type="time"]::-webkit-datetime-edit-text { color: var(--t-3, #6b7280); }

/* ===== o14  the month grid reads like a schedule =====
   A task at 9:36 pm looked the same as an untimed one, so the month disagreed
   with the week and day views. The time now rides in front of the title, and a
   day's chips sit in time order. */
#monthGrid .mtime {
  display: inline-block;
  margin-right: 5px;
  font-size: 10px;
  font-weight: 590;
  font-variant-numeric: tabular-nums;
  color: var(--t-3, #8a8f98);
  letter-spacing: -.01em;
}
#monthGrid .mchip:hover .mtime { color: var(--t-2, #d0d6e0); }

/* ===== o15  no time label on the calendar blocks =====
   Removed at the operator's request. In week and day view the block's POSITION
   already states the time - it sits on its own hour line - so the label repeated
   what the grid was already saying and ate room from the title.
   Month chips keep their time (.mtime): a month cell has no hour rows, so there
   the label is the only thing carrying the time. */
#weekGrid .tgevent-time,
#dayView .tgevent-time,
.tgevent > .tgevent-time { display: none !important; }

/* the title reclaims the space */
#weekGrid .tgevent-title,
#dayView .tgevent-title { flex: 1 1 auto; min-width: 0; }

/* the "a new build is live" pill - tap to load, never auto-reloads */
.newbuild-pill {
  position: fixed; right: 14px; bottom: 14px; z-index: 9999;
  padding: 9px 14px; border-radius: 999px; cursor: pointer;
  background: var(--accent-q, #5e6ad2); color: #fff;
  border: 1px solid rgba(255,255,255,.18);
  font-size: 12px; font-weight: 590; letter-spacing: -.01em;
  box-shadow: 0 6px 22px rgba(0,0,0,.42);
}
.newbuild-pill:hover { filter: brightness(1.08); }

/* the calendar's date range is now a control, so it must look like one */
.tgtop .tgdatelabel {
  cursor: pointer; border-radius: 6px; padding: 3px 8px;
  border: 1px solid transparent;
}
.tgtop .tgdatelabel:hover {
  background: var(--s-elevated, #1f2329);
  border-color: var(--line, #23252a);
}
.tgtop .tgdatelabel::after { content: ' \25BE'; opacity: .55; font-size: 10px; }

/* the undo control, sitting with the other Settings options */
#treeDrawer #btnUndo {
  display: block; width: 100%; margin-top: 8px; padding: 8px 12px;
  background: var(--s-elevated, #1f2329); color: var(--t-2, #d0d6e0);
  border: 1px solid var(--line, #23252a); border-radius: 8px;
  font-size: 12px; font-weight: 510; text-align: left; cursor: pointer;
}
#treeDrawer #btnUndo:hover:not(:disabled) { color: var(--t-1, #f7f8f8); }
#treeDrawer #btnUndo:disabled { cursor: default; }

/* ===== o19  the month header must span the grid, not sit in one cell =====
   #monthGrid is display:grid. The header was added as its first child, so the
   browser placed it in a single 7th-of-the-width CELL: 207x88 instead of the
   week header's 960x42, which pushed the whole month grid 30px down and made it
   30px shorter than the week view. Spanning every column makes month and week
   line up exactly - same left, same top, same width, same header height. */
#monthGrid .tgtop {
  grid-column: 1 / -1;
  box-sizing: border-box;
  width: 100%;
  min-height: 42px;
  align-items: center;
}
/* the month grid itself now starts flush with the week grid */
#monthGrid { padding: 0; align-content: start; }

/* The month header now lives at the top of the tab, exactly like the week view.
   The old inline Today button sat above the grid and created a 30px offset that
   made month and week start at different heights; the header replaces it. */
#tabMonth .btn-today-inline { display: none !important; }
#tabMonth > .tgtop { grid-column: auto; min-height: 0; }

/* the month header matches the week header's height exactly */
#tabMonth > .tgtop { min-height: 42px; }

/* ===== o21  one type style across day / week / month headers =====
   Day and week drew their date at 14px/600 while month used 13px/400, so the
   three timeframes looked like three different apps. Month is the style the
   operator asked for: short and plain. */
#dayView .tgtop .tgdatelabel,
#dayView .tgtop .tgtitle,
#weekGrid .tgtop .tgdatelabel,
#tabMonth > .tgtop .tgdatelabel {
  font-size: 13px;
  font-weight: 400;
  padding: 3px 8px;
  white-space: nowrap;
}
/* the redundant duplicates: month has neither, so day and week should not either */
/* The trailing Today duplicated the one now sitting in position 3, in every view.
   JS was hiding it per-render but it kept coming back; CSS settles it. */
#weekGrid .tgtop .btn-today-inline,
#dayView .tgtop .btn-today-inline,
#tabMonth .btn-today-inline { display: none !important; }
#dayView .tgtop .relbadge { display: none !important; }

/* ===== o22  the month grid takes the priority tree's colour =====
   #monthGrid had background rgb(46,50,58) and gap:1px - that background showing
   through the gaps IS the grid lines, so it could not simply be recoloured to
   match the tree side without the day separators vanishing. Instead: the gaps
   become the app's hairline colour, and the CELLS take the tree side's
   background. Same result the operator asked for, lines intact. */
/* Deliberately NOT overriding #monthGrid's own background: it is already
   theme-aware (rgb(227,229,233) light / rgb(46,50,58) dark, the same colour the
   top-bar buttons use for their borders), whereas --line is a single #333844 in
   BOTH themes and would have put a dark hairline on the light page. Only the
   CELLS change, so they match the priority tree side. */
#monthGrid .mcell { background: var(--bg, #16181c); }
#monthGrid .mhead { background: var(--bg, #16181c); }

/* ===== o23  the amber "Not today" badge is gone =====
   .not-today painted background: var(--warn) - a loud yellow pill in the calendar
   header whenever the view was parked off today. The header already carries a
   Today / This week / This month button, so the warning was noise on top of the
   control that fixes it. Removed at the operator's request. */
.not-today, .not-this-month { display: none !important; }

/* ===== o24  the month grid's day-name row must size to its text =====
   .mheader is display:contents, so Sun..Sat become grid items in ROW 1 - and
   grid-auto-rows: minmax(88px,1fr) forced that row to 88px for 30px of text,
   leaving a dead band between the day names and the first week. Give row 1 an
   explicit auto height and let the six week rows share what is left. */
#monthGrid {
  grid-template-rows: auto repeat(6, minmax(72px, 1fr));
}
#monthGrid .mhead { align-self: center; }

/* the build stamp was overlapping the Diagnose button */
/* The stamp must stay pinned top-right (operator's requirement, and the suite
   enforces innerWidth - right <= 20 and top <= 60). It was OVERLAPPING the
   Diagnose button because both sat on the same line. Keep it in the corner and
   drop it just below the button row instead of moving it out of the corner. */
#buildStamp {
  position: absolute;
  right: 12px;
  top: 44px;
  white-space: nowrap;
  pointer-events: none;
  opacity: .55;
  font-size: 11px;
  z-index: 1;
}

/* ===== o25  the header must not move when you page through dates =====
   The date label was auto-width, so its text length moved every control after
   it: stepping Next in Day view swung the label 110->128px and jumped the next
   arrow 18px; Week swung 87->114px and jumped it 27px. The buttons literally
   moved out from under the cursor on every click. A fixed box holds them still.
   Width fits the longest strings: "Wednesday, Sep 10" and "Aug 30 - Sep 5". */
#dayView .tgtop .tgdatelabel,
#dayView .tgtop .tgtitle,
#weekGrid .tgtop .tgdatelabel,
#tabMonth > .tgtop .tgdatelabel {
  display: inline-block;
  box-sizing: border-box;
  width: 152px;
  min-width: 152px;
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ===== o26  day / week / month must be the SAME BOX =====
   Measured: day header 481,87 958x42 (inset 1px by a border), week 480,86 960x42,
   month 480,86 960x43. Three views, three slightly different boxes - which is what
   the operator kept seeing as "not consistent". Pin all three to one geometry. */
#dayView, #weekGrid, #tabMonth, #monthGrid {
  border: 0 !important;
  box-sizing: border-box;
}
#dayView > .tgtop,
#weekGrid > .tgtop,
#tabMonth > .tgtop {
  box-sizing: border-box;
  height: 42px;
  min-height: 42px;
  max-height: 42px;
  margin: 0;
  width: 100%;
}
/* and the panes below them start at the same place */
#dayView, #weekGrid, #tabMonth { padding: 0 !important; }

/* ===== o27  childless rows must reserve the caret's space =====
   Measured: at depth 1, "IRS letter" (has a caret) puts its marker at x=62 while
   "2025 taxes" (no caret) puts its at x=40 - 22px left of its own sibling. Same
   at depth 3: 118 vs 96. Rows without children simply omitted the caret element,
   so everything after it slid left and the tree looked ragged. Reserve the space. */
#treeRoot .tree-row:not(:has(.tree-caret)) > .tree-marker { margin-left: 22px; }

/* ===== o28  the vertical guide lines are gone =====
   #treeRoot .tree-row[data-depth]::after drew a 1px full-height rule beside every
   nested row (o13, added to make nesting readable). Removed at the operator's
   request 2026-08-21 - indentation and the shrinking red markers already carry
   the hierarchy, and the lines read as clutter. */
#treeRoot .tree-row[data-depth]::after,
#treeRoot .tree-row[data-depth]:not([data-depth="0"])::after { content: none !important; }

.branchpick-back { display: flex; align-items: center; justify-content: center; z-index: 10000; }

.branchpick-list { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }
.branchpick-item {
