<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16181c">
<title>Planner</title>
<style>
 :root{
   --bg:#16181c; --surface:#1d2025; --surface2:#24272e; --line:#2e323a;
   --t1:#e6e8ec; --t2:#9aa1ab; --accent:#4d8bff; --accent-soft:#1e2a3f;
   --danger:#ef4444; --ok:#10b981; --warn:#f59e0b;
   --tap:46px;                       /* every control is at least this tall */
 }
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 html,body{height:100%;overscroll-behavior-y:none}
 body{margin:0;background:var(--bg);color:var(--t1);
      font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      display:flex;flex-direction:column;
      padding-top:env(safe-area-inset-top)}
 button,input,select{font:inherit;color:inherit}
 button{background:none;border:0;cursor:pointer}

 /* ---------- top ---------- */
 header{flex:0 0 auto;padding:10px 14px 8px;border-bottom:1px solid var(--line);
        background:var(--surface)}
 .hrow{display:flex;align-items:center;gap:10px}
 .hdate{flex:1 1 auto;min-width:0}
 .hdate b{display:block;font-size:19px;line-height:1.2}
 .hdate span{display:block;font-size:12.5px;color:var(--t2);margin-top:1px}
 .nav{display:flex;gap:6px;flex:0 0 auto}
 .nav button{width:46px;height:46px;border-radius:9px;background:var(--surface2);
             font-size:19px;display:flex;align-items:center;justify-content:center}
 .nav button:active{background:var(--line)}
 .today{font-size:13px;padding:0 14px;height:46px;border-radius:9px;
        background:var(--accent);color:#fff;font-weight:600}

 /* ---------- scrolling body ---------- */
 main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
      padding:12px 14px calc(20px + env(safe-area-inset-bottom))}
 .pane{display:none}
 .pane.on{display:block}

 /* ---------- the day ---------- */
 .slot{display:flex;gap:10px;align-items:stretch;margin-bottom:8px}
 .slot .t{flex:0 0 58px;color:var(--t2);font-size:12.5px;padding-top:12px;
          font-variant-numeric:tabular-nums}
 .ev{flex:1 1 auto;min-width:0;background:var(--surface);border:1px solid var(--line);
     border-left:3px solid var(--accent);border-radius:10px;padding:11px 12px;
     min-height:var(--tap);display:flex;align-items:center;gap:10px}
 .ev .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
         white-space:nowrap}
 .ev .du{flex:0 0 auto;color:var(--t2);font-size:12px}
 .ev.done .nm{text-decoration:line-through;color:var(--t2)}
 .empty{color:var(--t2);font-size:14px;text-align:center;padding:26px 10px}

 /* ---------- tasks ---------- */
 .task{display:flex;align-items:center;gap:11px;background:var(--surface);
       border:1px solid var(--line);border-radius:10px;padding:10px 12px;
       margin-bottom:8px;min-height:var(--tap)}
 .task.sub{margin-left:20px;background:var(--bg)}
 .box{flex:0 0 24px;width:24px;height:24px;border-radius:6px;
      border:2px solid var(--danger);display:flex;align-items:center;
      justify-content:center;font-size:15px;color:var(--ok)}
 .task.done .box{border-color:var(--ok)}
 .task.done .nm{text-decoration:line-through;color:var(--t2)}
 .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
     white-space:nowrap;font-size:15.5px}
 .when{flex:0 0 auto;color:var(--warn);font-size:11.5px;opacity:.75;
       font-variant-numeric:tabular-nums}
 .when.late{color:var(--danger);opacity:1}

 /* ---------- habits ---------- */
 .hab{display:flex;align-items:center;gap:11px;background:var(--surface);
      border:1px solid var(--line);border-radius:10px;padding:10px 12px;
      margin-bottom:8px;min-height:var(--tap)}

 /* ---------- bottom tabs ---------- */
 nav.tabs{flex:0 0 auto;display:flex;border-top:1px solid var(--line);
          background:var(--surface);
          padding-bottom:env(safe-area-inset-bottom)}
 nav.tabs button{flex:1 1 0;padding:11px 4px 9px;color:var(--t2);font-size:11.5px;
                 display:flex;flex-direction:column;align-items:center;gap:3px;
                 min-height:var(--tap)}
 nav.tabs button.on{color:var(--accent)}
 nav.tabs .ic{font-size:19px;line-height:1}

 /* ---------- sign in ---------- */
 #gate{position:fixed;inset:0;z-index:50;background:var(--bg);
       display:flex;align-items:center;justify-content:center;padding:22px}
 .card{width:100%;max-width:380px;background:var(--surface);
       border:1px solid var(--line);border-radius:16px;padding:22px 20px}
 .card h1{font-size:22px;margin:0 0 4px}
 .card p.s{margin:0 0 18px;color:var(--t2);font-size:14px}
 label{display:block;font-size:11.5px;letter-spacing:.07em;color:var(--t2);
       text-transform:uppercase;margin:0 0 6px}
 .card input{width:100%;height:50px;border-radius:10px;background:var(--bg);
             border:1px solid var(--line);padding:0 13px;font-size:16px;
             margin-bottom:14px}
 .card input:focus{outline:none;border-color:var(--accent)}
 .go{width:100%;height:52px;border-radius:10px;background:var(--accent);
     color:#fff;font-size:16px;font-weight:600}
 .err{color:#ffb4b7;font-size:13.5px;margin:12px 0 0;min-height:18px}
 .note{color:var(--t2);font-size:12.5px;margin:16px 0 0;text-align:center}

 /* ---------- sync pill ---------- */
 #sync{position:fixed;left:50%;transform:translateX(-50%);
       top:calc(6px + env(safe-area-inset-top));z-index:40;
       background:var(--surface2);border:1px solid var(--line);
       border-radius:999px;padding:5px 13px;font-size:12px;color:var(--t2);
       opacity:0;transition:opacity .2s;pointer-events:none}
 #sync.show{opacity:1}
 .stamp{text-align:center;color:#5c636d;font-size:11px;padding:10px 0 2px}
</style></head><body>

<div id="gate">
  <div class="card">
    <h1>Planner</h1>
    <p class="s">Sign in to open your planner</p>
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" inputmode="email"
           autocapitalize="none" spellcheck="false">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="go" id="signin">Sign in</button>
    <p class="err" id="err"></p>
    <p class="note">Same account as the desktop planner &mdash; same data.</p>
  </div>
</div>

<div id="sync">saving&hellip;</div>

<header>
  <div class="hrow">
    <div class="hdate"><b id="dTitle">Today</b><span id="dSub"></span></div>
    <div class="nav">
      <button id="prev" aria-label="Previous day">&#8249;</button>
      <button class="today" id="todayBtn">Today</button>
      <button id="next" aria-label="Next day">&#8250;</button>
    </div>
  </div>
</header>

<main>
  <section class="pane on" id="p-day"></section>
  <section class="pane" id="p-tasks"></section>
  <section class="pane" id="p-habits"></section>
  <div class="stamp" id="stamp"></div>
</main>

<nav class="tabs">
  <button class="on" data-p="day"><span class="ic">&#128197;</span>Day</button>
  <button data-p="tasks"><span class="ic">&#9745;</span>Tasks</button>
  <button data-p="habits"><span class="ic">&#8635;</span>Habits</button>
</nav>

<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>
<script>
/* ===========================================================================
   PHONE PLANNER  -  /planner/m/
   Build 2026-11-20 01:28

   Reads and writes the SAME Firestore document as the desktop planner:
       users/<uid>  ->  { doc: JSON.stringify(data), updatedAt: <stamp> }
   That contract was read out of app/index.html (doWrite), not assumed, which is
   what makes the two one planner rather than two copies.

   DELIBERATELY SMALL. This is a companion for a phone, not a second full app:
   it shows the day, the tasks and the habits, and it ticks things off. Anything
   structural - adding branches, repeats, notes - stays on the desktop planner,
   so there is only ever one place that can create a conflicting edit.
   =========================================================================== */
(function () {
  'use strict';

  var CFG = {
    apiKey: "AIzaSyAcdgyujMPFIdtEGEjqa66SUS8MRVe-L7Y",
    authDomain: "ultimate-planner-9a61d.firebaseapp.com",
    projectId: "ultimate-planner-9a61d",
    storageBucket: "ultimate-planner-9a61d.firebasestorage.app",
    messagingSenderId: "955204289418",
    appId: "1:955204289418:web:023ae471b623b813d2fe73"
  };

  var auth = null, db = null, ref = null;
  var data = null;          /* the planner, same shape as Store.data */
  var view = new Date();    /* the day on screen */
  var pane = 'day';
  var writing = false, dirty = false;

  function $(id) { return document.getElementById(id); }

  function iso(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }
  function todayISO() { return iso(new Date()); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }

  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function pill(msg, ms) {
    var p = $('sync');
    p.textContent = msg;
    p.classList.add('show');
    clearTimeout(pill._t);
    pill._t = setTimeout(function () { p.classList.remove('show'); }, ms || 1400);
  }

  /* ---------- walking the tree ---------- */
  function walk(list, fn, depth, parent) {
    if (!list || !list.length) return;
    for (var i = 0; i < list.length; i++) {
      var n = list[i];
      if (!n) continue;
      if (fn(n, depth || 0, parent || null) === false) return;
      if (n.children) walk(n.children, fn, (depth || 0) + 1, n);
    }
  }

  /* A repeating node occurs on a date when its rule says so. This mirrors the
     desktop planner's own reading of node.repeat; anything it cannot work out
     it answers false for, so the phone never INVENTS an occurrence. */
  function occursOn(n, dISO) {
    var r = n && n.repeat;
    if (!r || !r.freq) return n && n.date === dISO;
    if (r.start && dISO < r.start) return false;
    if (r.end && dISO > r.end) return false;
    /* a per-occurrence move wins over the rule */
    if (r.moves) {
      for (var k in r.moves) {
        if (Object.prototype.hasOwnProperty.call(r.moves, k)) {
          if (r.moves[k] && r.moves[k].to === dISO) return true;
          if (k === dISO && r.moves[k] && r.moves[k].to !== dISO) return false;
        }
      }
    }
    var d = new Date(dISO + 'T00:00:00');
    var st = r.start ? new Date(r.start + 'T00:00:00') : d;
    var days = Math.round((d - st) / 86400000);
    var n_ = Math.max(1, parseInt(r.everyN, 10) || 1);
    if (r.freq === 'daily') {
      if (r.days && r.days.length && r.days.length < 7) {
        return r.days.indexOf(d.getDay()) !== -1;
      }
      return days >= 0 && days % n_ === 0;
    }
    if (r.freq === 'weekly') {
      if (r.days && r.days.length) return r.days.indexOf(d.getDay()) !== -1;
      return days >= 0 && days % (7 * n_) === 0;
    }
    if (r.freq === 'monthly') return d.getDate() === st.getDate();
    if (r.freq === 'yearly') {
      return d.getDate() === st.getDate() && d.getMonth() === st.getMonth();
    }
    if (r.freq === 'specific') {
      return !!(r.dates && r.dates.indexOf(dISO) !== -1);
    }
    return false;
  }

  function timeOf(n, dISO) {
    var r = n && n.repeat;
    if (r && r.moves) {
      for (var k in r.moves) {
        if (Object.prototype.hasOwnProperty.call(r.moves, k) &&
            r.moves[k] && r.moves[k].to === dISO && r.moves[k].time) {
          return r.moves[k].time;
        }
      }
    }
    return n.time || '';
  }

  /* ---------- the DAY ---------- */
  function renderDay() {
    var host = $('p-day');
    host.textContent = '';
    var dISO = iso(view);
    var rows = [];

    walk(data.tree, function (n) {
      if (n.deleted) return;
      /* a finished one-off is history, not today's plan - measured: 'already
         finished' sat in the middle of the day with nothing to do. A finished
         REPEAT still shows, because it comes round again and the tick is for
         this occurrence only. */
      if (n.done && !n.repeat) return;
      if (!occursOn(n, dISO)) return;
      rows.push({ node: n, time: timeOf(n, dISO) });
    });

    (data.events || []).forEach(function (e) {
      if (e && e.date === dISO) rows.push({ node: e, time: e.time || '' });
    });

    rows.sort(function (a, b) {
      if (!a.time && !b.time) return 0;
      if (!a.time) return 1;
      if (!b.time) return -1;
      return a.time < b.time ? -1 : 1;
    });

    if (!rows.length) {
      var em = document.createElement('div');
      em.className = 'empty';
      em.textContent = 'Nothing scheduled for this day.';
      host.appendChild(em);
      return;
    }

    rows.forEach(function (r) {
      var slot = document.createElement('div');
      slot.className = 'slot';
      var t = document.createElement('div');
      t.className = 't';
      t.textContent = r.time ? fmtTime(r.time) : '';
      var ev = document.createElement('div');
      ev.className = 'ev' + (r.node.done ? ' done' : '');
      var nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = r.node.title || r.node.name || '(untitled)';
      ev.appendChild(nm);
      if (r.node.duration) {
        var du = document.createElement('div');
        du.className = 'du';
        du.textContent = r.node.duration + 'm';
        ev.appendChild(du);
      }
      ev.addEventListener('click', function () { toggleDone(r.node); });
      slot.appendChild(t); slot.appendChild(ev);
      host.appendChild(slot);
    });
  }

  function fmtTime(t) {
    var p = String(t).split(':');
    var h = parseInt(p[0], 10); if (isNaN(h)) return t;
    var m = p[1] || '00';
    var ap = h >= 12 ? 'PM' : 'AM';
    var hh = h % 12; if (hh === 0) hh = 12;
    return hh + ':' + m + ' ' + ap;
  }

  /* ---------- TASKS ---------- */
  function renderTasks() {
    var host = $('p-tasks');
    host.textContent = '';
    var today = todayISO();
    var any = false;

    walk(data.tree, function (n, depth) {
      if (n.deleted) return;
      if (n.done && !showDone) return;
      any = true;
      var row = document.createElement('div');
      row.className = 'task' + (depth > 0 ? ' sub' : '') + (n.done ? ' done' : '');
      var box = document.createElement('div');
      box.className = 'box';
      box.textContent = n.done ? '✓' : '';
      var nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = n.title || '(untitled)';
      row.appendChild(box); row.appendChild(nm);
      if (n.date) {
        var w = document.createElement('div');
        w.className = 'when' + (n.date < today && !n.done ? ' late' : '');
        var dd = new Date(n.date + 'T00:00:00');
        w.textContent = MON[dd.getMonth()].toUpperCase() + ' ' + dd.getDate();
        row.appendChild(w);
      }
      row.addEventListener('click', function () { toggleDone(n); });
      host.appendChild(row);
    });

    if (!any) {
      var em = document.createElement('div');
      em.className = 'empty';
      em.textContent = 'No tasks.';
      host.appendChild(em);
    }
  }
  var showDone = false;

  /* ---------- HABITS ---------- */
  function renderHabits() {
    var host = $('p-habits');
    host.textContent = '';
    var list = data.habits || [];
    var dISO = iso(view);
    if (!list.length) {
      var em = document.createElement('div');
      em.className = 'empty';
      em.textContent = 'No habits yet.';
      host.appendChild(em);
      return;
    }
    list.forEach(function (h) {
      if (!h || h.deleted) return;
      var log = (data.habitLog && data.habitLog[h.id]) || {};
      var on = !!log[dISO];
      var row = document.createElement('div');
      row.className = 'hab';
      var box = document.createElement('div');
      box.className = 'box';
      if (on) { box.style.borderColor = 'var(--ok)'; box.textContent = '✓'; }
      var nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = h.name || h.title || '(untitled)';
      row.appendChild(box); row.appendChild(nm);
      row.addEventListener('click', function () {
        if (!data.habitLog) data.habitLog = {};
        if (!data.habitLog[h.id]) data.habitLog[h.id] = {};
        if (data.habitLog[h.id][dISO]) delete data.habitLog[h.id][dISO];
        else data.habitLog[h.id][dISO] = true;
        save(); render();
      });
      host.appendChild(row);
    });
  }

  /* ---------- editing ---------- */
  function toggleDone(n) {
    n.done = !n.done;
    if (n.done) n.completedAt = new Date().toISOString();
    save();
    render();
  }

  /* ---------- render ---------- */
  function render() {
    var dISO = iso(view);
    var t = todayISO();
    $('dTitle').textContent =
      dISO === t ? 'Today'
      : dISO === iso(addDays(new Date(), 1)) ? 'Tomorrow'
      : dISO === iso(addDays(new Date(), -1)) ? 'Yesterday'
      : DOW[view.getDay()];
    $('dSub').textContent =
      DOW[view.getDay()] + ', ' + MON[view.getMonth()] + ' ' + view.getDate();
    if (pane === 'day') renderDay();
    if (pane === 'tasks') renderTasks();
    if (pane === 'habits') renderHabits();
  }

  /* ---------- firestore ---------- */
  function save() {
    if (!ref) return;
    dirty = true;
    if (writing) return;
    writing = true;
    pill('saving…', 4000);
    setTimeout(function () {
      dirty = false;
      data.updatedAt = new Date().toISOString();
      /* the SAME two fields the desktop planner writes - read out of its
         doWrite(), so neither side can read the other's record as empty */
      ref.set({ doc: JSON.stringify(data), updatedAt: Date.now() }, { merge: true })
        .then(function () {
          writing = false;
          pill('saved');
          if (dirty) save();
        })
        .catch(function (e) {
          writing = false;
          pill('not saved: ' + (e && e.code ? e.code : 'error'), 4000);
        });
    }, 350);   /* one write per burst of taps */
  }

  function listen() {
    ref.onSnapshot(function (snap) {
      if (!snap.exists) { data = blank(); render(); return; }
      var raw = snap.get('doc');
      if (!raw) { data = data || blank(); render(); return; }
      try {
        var incoming = JSON.parse(raw);
        /* while a write of ours is in flight, our own copy is the newer one */
        if (!writing) { data = incoming; render(); }
      } catch (e) { pill('could not read the planner', 4000); }
    }, function (e) {
      pill('offline: ' + (e && e.code ? e.code : 'error'), 4000);
    });
  }

  function blank() {
    return { version: 1, updatedAt: new Date().toISOString(),
             tree: [], events: [], journal: {}, habits: [], habitLog: {} };
  }

  /* ---------- wiring ---------- */
  $('prev').addEventListener('click', function () { view = addDays(view, -1); render(); });
  $('next').addEventListener('click', function () { view = addDays(view, 1); render(); });
  $('todayBtn').addEventListener('click', function () { view = new Date(); render(); });

  var tabs = document.querySelectorAll('nav.tabs button');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', function () {
      var p = this.getAttribute('data-p'), j;
      for (j = 0; j < tabs.length; j++) tabs[j].classList.remove('on');
      this.classList.add('on');
      var ps = document.querySelectorAll('.pane');
      for (j = 0; j < ps.length; j++) ps[j].classList.remove('on');
      var el = $('p-' + p);
      if (el) el.classList.add('on');
      pane = p;
      render();
    });
  }

  function signIn() {
    var em = $('em').value.trim(), pw = $('pw').value;
    if (!em || !pw) { $('err').textContent = 'Email and password, please.'; return; }
    $('err').textContent = '';
    $('signin').textContent = 'Signing in…';
    auth.signInWithEmailAndPassword(em, pw).catch(function (e) {
      $('signin').textContent = 'Sign in';
      var c = (e && e.code) || '';
      $('err').textContent =
        c.indexOf('wrong-password') >= 0 || c.indexOf('invalid-credential') >= 0
          ? 'That email and password did not match.'
          : c.indexOf('network') >= 0 ? 'No connection.'
          : 'Could not sign in (' + c + ').';
    });
  }
  $('signin').addEventListener('click', signIn);
  $('pw').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') signIn();
  });

  $('stamp').textContent = 'phone planner · build 2026-11-20 01:28';

  try {
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(CFG);
    auth = firebase.auth();
    db = firebase.firestore();
    try { auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (e) {}
    auth.onAuthStateChanged(function (user) {
      if (!user) {
        ref = null;
        $('gate').style.display = 'flex';
        $('signin').textContent = 'Sign in';
        return;
      }
      $('gate').style.display = 'none';
      ref = db.collection('users').doc(user.uid);
      data = data || blank();
      render();
      listen();
    });
  } catch (e) {
    $('err').textContent = 'Could not start: ' + e.message;
  }
})();
</script>
</body></html>
